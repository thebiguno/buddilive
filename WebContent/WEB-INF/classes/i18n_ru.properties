u0435\u0434\u0435\u043B\u044C\u043D\u044B\u0439 \u0441\u043D\u0438\u043C\u043E\u043A \u0441\u0442\u0440\u043E\u0438\u0442\u0441\u044F \u0434\u043B\u044F \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u0430\u043A\u0442\u0438\u0432\u043D\u043E\u0433\u043E \u0441\u0447\u0435\u0442\u0430.\n\n\u041F\u0440\u0435\u0434\u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u044F: \u043F\u043E\u043A\u0430\u0437\u0430\u043D\u044B \u0442\u043E\u043B\u044C\u043A\u043E \u0441\u0447\u0435\u0442\u0430 \u0441\u043E \u0441\u0440\u0435\u0434\u043D\u0435\u043C\u0435\u0441\u044F\u0447\u043D\u044B\u043C \u0438\u0437\u043C\u0435\u043D\u0435\u043D\u0438\u0435\u043C, \u043F\u0440\u0435\u0432\u044B\u0448\u0430\u044E\u0449\u0438\u043C 1 \u0434\u043E\u043B\u043B\u0430\u0440 \u0421\u0428\u0410 (\u0441\u0442\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u0438\u043D\u0432\u0435\u0441\u0442\u0438\u0446\u0438\u043E\u043D\u043D\u044B\u0435 \u0441\u0447\u0435\u0442\u0430 \u0441\u043A\u0440\u044B\u0442\u044B). \u041F\u0440\u043E\u0433\u043D\u043E\u0437 \u043F\u0440\u0435\u0434\u043F\u043E\u043B\u0430\u0433\u0430\u0435\u0442, \u0447\u0442\u043E \u0431\u0443\u0434\u0443\u0449\u0435\u0435 \u0431\u0443\u0434\u0435\u0442 \u043F\u043E\u0445\u043E\u0436\u0435 \u043D\u0430 \u0441\u0440\u0435\u0434\u043D\u0435\u0435 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0435 \u0437\u0430 \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\u0435 12 \u043C\u0435\u0441\u044F\u0446\u0435\u0432 \u2014 \u043E\u043D\u043E \u043D\u0435 \u0443\u0447\u0438\u0442\u044B\u0432\u0430\u0435\u0442 \u0440\u0430\u0437\u043E\u0432\u044B\u0435 \u043A\u0440\u0443\u043F\u043D\u044B\u0435 \u0442\u0440\u0430\u043D\u0437\u0430\u043A\u0446\u0438\u0438, \u0441\u0435\u0437\u043E\u043D\u043D\u044B\u0435 \u043A\u043E\u043B\u0435\u0431\u0430\u043D\u0438\u044F \u0438\u043B\u0438 \u0438\u0437\u043C\u0435\u043D\u0435\u043D\u0438\u044F \u0432 \u043F\u043E\u043A\u0443\u043F\u0430\u0442\u0435\u043B\u044C\u0441\u043A\u0438\u0445 \u043F\u0440\u0438\u0432\u044B\u0447\u043A\u0430\u0445.
REPORT_INFO_PROJECTED_BALANCE_TITLE=\u041F\u0440\u043E\u0433\u043D\u043E\u0437\u0438\u0440\u0443\u0435\u043C\u044B\u0439 \u0431\u0430\u043B\u0430\u043D\u0441
REPORT_INFO_SAVINGS_RATE_BODY=\u041F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u0435\u0442, \u043A\u0430\u043A\u043E\u0439 \u043F\u0440\u043E\u0446\u0435\u043D\u0442 \u0432\u0430\u0448\u0435\u0433\u043E \u0434\u043E\u0445\u043E\u0434\u0430 \u0432\u044B \u043E\u0442\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u043B\u0438 \u043A\u0430\u0436\u0434\u044B\u0439 \u043C\u0435\u0441\u044F\u0446 \u0432 \u0442\u0435\u0447\u0435\u043D\u0438\u0435 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u0433\u043E \u043F\u0435\u0440\u0438\u043E\u0434\u0430.\n\n\u0420\u0430\u0441\u0447\u0435\u0442: \u043D\u043E\u0440\u043C\u0430 \u0441\u0431\u0435\u0440\u0435\u0436\u0435\u043D\u0438\u0439 % = (\u0414\u043E\u0445\u043E\u0434\u044B \u2212 \u0420\u0430\u0441\u0445\u043E\u0434\u044B) / \u0414\u043E\u0445\u043E\u0434 \u00D7 100, \u0440\u0430\u0441\u0441\u0447\u0438\u0442\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u0437\u0430 \u043A\u0430\u043B\u0435\u043D\u0434\u0430\u0440\u043D\u044B\u0439 \u043C\u0435\u0441\u044F\u0446. \u041F\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u043B\u0435\u043D\u043E \u0432 \u0432\u0438\u0434\u0435 \u043B\u0438\u043D\u0435\u0439\u043D\u043E\u0439 \u0434\u0438\u0430\u0433\u0440\u0430\u043C\u043C\u044B.\n\n\u0414\u043E\u043F\u0443\u0449\u0435\u043D\u0438\u044F: \u043C\u0435\u0441\u044F\u0446\u044B \u0441 \u043D\u0443\u043B\u0435\u0432\u044B\u043C \u0434\u043E\u0445\u043E\u0434\u043E\u043C \u043F\u0440\u043E\u043F\u0443\u0441\u043A\u0430\u044E\u0442\u0441\u044F, \u0447\u0442\u043E\u0431\u044B \u0438\u0437\u0431\u0435\u0436\u0430\u0442\u044C \u0434\u0435\u043B\u0435\u043D\u0438\u044F \u043D\u0430 \u043D\u043E\u043B\u044C. \u0421\u0442\u0430\u0432\u043A\u0430 \u0432\u044B\u0448\u0435 0% \u043E\u0437\u043D\u0430\u0447\u0430\u0435\u0442, \u0447\u0442\u043E \u0432\u044B \u0441\u044D\u043A\u043E\u043D\u043E\u043C\u0438\u043B\u0438 \u0434\u0435\u043D\u044C\u0433\u0438; \u043D\u0438\u0436\u0435 0% \u043E\u0437\u043D\u0430\u0447\u0430\u0435\u0442, \u0447\u0442\u043E \u0432\u044B \u043F\u043E\u0442\u0440\u0430\u0442\u0438\u043B\u0438 \u0431\u043E\u043B\u044C\u0448\u0435, \u0447\u0435\u043C \u0437\u0430\u0440\u0430\u0431\u043E\u0442\u0430\u043B\u0438. \u041F\u0435\u0440\u0435\u0432\u043E\u0434\u044B \u043C\u0435\u0436\u0434\u0443 \u0441\u0447\u0435\u0442\u0430\u043C\u0438 \u0438\u0441\u043A\u043B\u044E\u0447\u0435\u043D\u044B.
REPORT_INFO_SAVINGS_RATE_TITLE=\u0421\u0442\u0430\u0432\u043A\u0430 \u0441\u0431\u0435\u0440\u0435\u0436\u0435\u043D\u0438\u0439
REPORT_INFO_TOP_PAYEES_BODY=\u0420\u0435\u0439\u0442\u0438\u043D\u0433 \u043E\u0441\u043D\u043E\u0432\u043D\u044B\u0445 \u043F\u043E\u043B\u0443\u0447\u0430\u0442\u0435\u043B\u0435\u0439 \u043F\u043B\u0430\u0442\u0435\u0436\u0435\u0439 (\u043E\u043F\u0438\u0441\u0430\u043D\u0438\u0439 \u0442\u0440\u0430\u043D\u0437\u0430\u043A\u0446\u0438\u0439) \u043F\u043E \u043E\u0431\u0449\u0438\u043C \u0440\u0430\u0441\u0445\u043E\u0434\u0430\u043C \u0437\u0430 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u044B\u0439 \u043F\u0435\u0440\u0438\u043E\u0434, \u043F\u043E\u043A\u0430\u0437\u0430\u043D\u043D\u044B\u0439 \u0432 \u0432\u0438\u0434\u0435 \u0433\u043E\u0440\u0438\u0437\u043E\u043D\u0442\u0430\u043B\u044C\u043D\u043E\u0439 \u0433\u0438\u0441\u0442\u043E\u0433\u0440\u0430\u043C\u043C\u044B.\n\n\u0420\u0430\u0441\u0447\u0435\u0442: \u0432\u0441\u0435 \u0440\u0430\u0437\u0434\u0435\u043B\u0435\u043D\u0438\u044F \u0440\u0430\u0441\u0445\u043E\u0434\u043E\u0432 \u0441\u0433\u0440\u0443\u043F\u043F\u0438\u0440\u043E\u0432\u0430\u043D\u044B \u043F\u043E \u043E\u043F\u0438\u0441\u0430\u043D\u0438\u044E \u0442\u0440\u0430\u043D\u0437\u0430\u043A\u0446\u0438\u0438 (\u043F\u043E\u043B\u0443\u0447\u0430\u0442\u0435\u043B\u044E). \u0418\u0442\u043E\u0433\u0438 \u043E\u0442\u0441\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u0430\u043D\u044B \u043F\u043E \u0443\u0431\u044B\u0432\u0430\u043D\u0438\u044E. \u041D\u0430 \u043A\u0430\u0436\u0434\u043E\u0439 \u043F\u043E\u043B\u043E\u0441\u0435 \u0442\u0430\u043A\u0436\u0435 \u043E\u0442\u043E\u0431\u0440\u0430\u0436\u0430\u0435\u0442\u0441\u044F \u043F\u0440\u043E\u0446\u0435\u043D\u0442\u043D\u0430\u044F \u0434\u043E\u043B\u044F \u043F\u043E\u043B\u0443\u0447\u0430\u0442\u0435\u043B\u044F \u043F\u043B\u0430\u0442\u0435\u0436\u0430 \u043E\u0442 \u043E\u0431\u0449\u0438\u0445 \u0440\u0430\u0441\u0445\u043E\u0434\u043E\u0432 \u0437\u0430 \u043F\u0435\u0440\u0438\u043E\u0434.\n\n\u041F\u0440\u0435\u0434\u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u044F: \u0443\u0447\u0438\u0442\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u043E\u0442\u0442\u043E\u043A\u0438 \u043F\u043E \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044F\u043C \u0440\u0430\u0441\u0445\u043E\u0434\u043E\u0432 \u2014 \u0434\u043E\u0445\u043E\u0434\u044B \u0438 \u043F\u0435\u0440\u0435\u0432\u043E\u0434\u044B \u0438\u0441\u043A\u043B\u044E\u0447\u0430\u044E\u0442\u0441\u044F. \u0418\u043C\u0435\u043D\u0430 \u043F\u043E\u043B\u0443\u0447\u0430\u0442\u0435\u043B\u0435\u0439 \u043F\u043B\u0430\u0442\u0435\u0436\u0430 \u0434\u043E\u043B\u0436\u043D\u044B \u0442\u043E\u0447\u043D\u043E \u0441\u043E\u0432\u043F\u0430\u0434\u0430\u0442\u044C; \u043D\u0435\u0431\u043E\u043B\u044C\u0448\u0438\u0435 \u0440\u0430\u0437\u043B\u0438\u0447\u0438\u044F \u0432 \u043D\u0430\u043F\u0438\u0441\u0430\u043D\u0438\u0438 \u0441\u043E\u0437\u0434\u0430\u044E\u0442 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u044B\u0435 \u0437\u0430\u043F\u0438\u0441\u0438.
