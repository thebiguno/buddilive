HELP_BUDGET_CATEGORY_NAME=\u042D\u0442\u043E \u043D\u0430\u0437\u0432\u0430\u043D\u0438\u0435 \u0433\u0440\u0443\u043F\u043F\u044B \u043E\u0431\u0449\u0438\u0445 \u0442\u0440\u0430\u043D\u0437\u0430\u043A\u0446\u0438\u0439.  \u041D\u0430\u043F\u0440\u0438\u043C\u0435\u0440, \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044F \u00AB\u041F\u0440\u043E\u0434\u0443\u043A\u0442\u044B\u00BB \u043C\u043E\u0436\u0435\u0442 \u043E\u0442\u0441\u043B\u0435\u0436\u0438\u0432\u0430\u0442\u044C \u043F\u043E\u043A\u0443\u043F\u043A\u0438 \u043F\u0440\u043E\u0434\u0443\u043A\u0442\u043E\u0432 \u043F\u0438\u0442\u0430\u043D\u0438\u044F; \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044F \u00AB\u0414\u043E\u043C\u043E\u0445\u043E\u0437\u044F\u0439\u0441\u0442\u0432\u043E\u00BB \u0434\u043B\u044F \u043E\u0442\u0441\u043B\u0435\u0436\u0438\u0432\u0430\u043D\u0438\u044F \u0440\u0430\u0437\u043B\u0438\u0447\u043D\u044B\u0445 \u0434\u043E\u043C\u0430\u0448\u043D\u0438\u0445 \u0440\u0430\u0441\u0445\u043E\u0434\u043E\u0432, \u0442\u0430\u043A\u0438\u0445 \u043A\u0430\u043A \u043C\u0435\u0431\u0435\u043B\u044C \u0438 \u043F\u0440\u043E\u0441\u0442\u043E\u0439 \u0440\u0435\u043C\u043E\u043D\u0442 \u0434\u043E\u043C\u0430; \u0430 \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044F \u043F\u043E\u0434 \u043D\u0430\u0437\u0432\u0430\u043D\u0438\u0435\u043C \u00AB\u0417\u0430\u0440\u043F\u043B\u0430\u0442\u0430\u00BB \u043C\u043E\u0436\u0435\u0442 \u043E\u0442\u0441\u043B\u0435\u0436\u0438\u0432\u0430\u0442\u044C \u0434\u043E\u0445\u043E\u0434 \u043E\u0442 \u0435\u0436\u0435\u043C\u0435\u0441\u044F\u0447\u043D\u043E\u0439 \u0437\u0430\u0440\u043F\u043B\u0430\u0442\u044B.<br/>\u0427\u0442\u043E\u0431\u044B \u0441\u0433\u0440\u0443\u043F\u043F\u0438\u0440\u043E\u0432\u0430\u0442\u044C \u043E\u0431\u0449\u0438\u0435 \u043D\u0430\u0431\u043E\u0440\u044B \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0439, \u0432\u043E\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0439\u0442\u0435\u0441\u044C \u0444\u0443\u043D\u043A\u0446\u0438\u0435\u0439 \u00AB\u0420\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u0441\u043A\u0430\u044F \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044F\u00BB \u043D\u0438\u0436\u0435.
HELP_BUDGET_CATEGORY_PARENT=\u0420\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u0441\u043A\u0443\u044E \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044E \u043C\u043E\u0436\u043D\u043E \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u0434\u043B\u044F \u0433\u0440\u0443\u043F\u043F\u0438\u0440\u043E\u0432\u043A\u0438 \u0441\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0445 \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0439 \u0431\u044E\u0434\u0436\u0435\u0442\u0430.  \u041D\u0430\u043F\u0440\u0438\u043C\u0435\u0440, \u043F\u0440\u0435\u0434\u043F\u043E\u043B\u043E\u0436\u0438\u043C, \u0447\u0442\u043E \u0435\u0441\u0442\u044C \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044F \u00AB\u0410\u0432\u0442\u043E\u043C\u043E\u0431\u0438\u043B\u044C\u043D\u044B\u0435 \u0440\u0430\u0441\u0445\u043E\u0434\u044B\u00BB.  \u0417\u0430\u0442\u0435\u043C \u043C\u043E\u0436\u043D\u043E \u0431\u044B\u043B\u043E \u0431\u044B \u0434\u043E\u0431\u0430\u0432\u0438\u0442\u044C \u0434\u0440\u0443\u0433\u0438\u0435 \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0438: \u00AB\u0422\u043E\u043F\u043B\u0438\u0432\u043E\u00BB, \u00AB\u0421\u0442\u0440\u0430\u0445\u043E\u0432\u0430\u043D\u0438\u0435 \u0430\u0432\u0442\u043E\u043C\u043E\u0431\u0438\u043B\u044F\u00BB \u0438 \u00AB\u0422\u0435\u0445\u043D\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u043E\u0431\u0441\u043B\u0443\u0436\u0438\u0432\u0430\u043D\u0438\u0435 \u0438 \u0440\u0435\u043C\u043E\u043D\u0442\u00BB, \u0432\u0441\u0435 \u0441 \u0440\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u0441\u043A\u043E\u0439 \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0435\u0439 \u00AB\u0410\u0432\u0442\u043E\u043C\u043E\u0431\u0438\u043B\u044C\u043D\u044B\u0435 \u0440\u0430\u0441\u0445\u043E\u0434\u044B\u00BB.  \u041F\u043E\u0441\u043B\u0435 \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043D\u0438\u044F \u044D\u0442\u0438 \u0442\u0440\u0438 \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0438 \u043F\u043E\u044F\u0432\u044F\u0442\u0441\u044F \u043F\u043E\u0434 \u0440\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u0441\u043A\u043E\u0439 \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0435\u0439 \u00AB\u0410\u0432\u0442\u043E\u043C\u043E\u0431\u0438\u043B\u044C\u043D\u044B\u0435 \u0440\u0430\u0441\u0445\u043E\u0434\u044B\u00BB.
HELP_BUDGET_CATEGORY_PERIOD_TYPE=\u0411\u044E\u0434\u0436\u0435\u0442\u043D\u044B\u0439 \u043F\u0435\u0440\u0438\u043E\u0434, \u043A\u043E\u0442\u043E\u0440\u044B\u0439 \u0431\u0443\u0434\u0435\u0442 \u043F\u0440\u0438\u0441\u0432\u043E\u0435\u043D \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0438 \u0431\u044E\u0434\u0436\u0435\u0442\u0430.  \u00AB\u0411\u044E\u0434\u0436\u0435\u0442\u043D\u044B\u0439 \u043F\u0435\u0440\u0438\u043E\u0434\u00BB \u2014 \u044D\u0442\u043E \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u044E\u0449\u0438\u0439\u0441\u044F \u0434\u0438\u0430\u043F\u0430\u0437\u043E\u043D \u0434\u0430\u0442, \u043D\u0430 \u043A\u043E\u0442\u043E\u0440\u044B\u0439 \u0432\u044B \u043D\u0430\u0437\u043D\u0430\u0447\u0430\u0435\u0442\u0435 \u0441\u0443\u043C\u043C\u0443 \u0432 \u0441\u0432\u043E\u0435\u043C \u0431\u044E\u0434\u0436\u0435\u0442\u0435; \u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440, \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0438 \u0431\u044E\u0434\u0436\u0435\u0442\u0430 \u0434\u043B\u044F \u043E\u0442\u0441\u043B\u0435\u0436\u0438\u0432\u0430\u043D\u0438\u044F \u0435\u0436\u0435\u043C\u0435\u0441\u044F\u0447\u043D\u044B\u0445 \u043D\u0430\u043B\u043E\u0433\u043E\u0432 \u043D\u0430 \u043D\u0435\u0434\u0432\u0438\u0436\u0438\u043C\u043E\u0441\u0442\u044C \u0441\u043B\u0435\u0434\u0443\u0435\u0442 \u043D\u0430\u0437\u043D\u0430\u0447\u0438\u0442\u044C \u0442\u0438\u043F \u043F\u0435\u0440\u0438\u043E\u0434\u0430 \u00AB\u041C\u0435\u0441\u044F\u0446\u00BB.
HELP_BUDGET_CATEGORY_TYPE=\u0423\u043A\u0430\u0436\u0438\u0442\u0435 \u044D\u0442\u043E \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0435 \u0432 \u0437\u0430\u0432\u0438\u0441\u0438\u043C\u043E\u0441\u0442\u0438 \u043E\u0442 \u0442\u043E\u0433\u043E, \u043F\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442 \u043B\u0438 \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044F \u0431\u044E\u0434\u0436\u0435\u0442\u0430 \u043F\u0440\u043E\u0432\u043E\u0434\u043A\u0438 \u0434\u043E\u0445\u043E\u0434\u043E\u0432 \u0438\u043B\u0438 \u0440\u0430\u0441\u0445\u043E\u0434\u043E\u0432.  \u041F\u0440\u0438\u043C\u0435\u0440\u044B \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0439 \u0434\u043E\u0445\u043E\u0434\u043E\u0432 \u043C\u043E\u0433\u0443\u0442 \u0432\u043A\u043B\u044E\u0447\u0430\u0442\u044C \u00AB\u0417\u0430\u0440\u0430\u0431\u043E\u0442\u043D\u0430\u044F \u043F\u043B\u0430\u0442\u0430\u00BB, \u00AB\u041F\u0440\u0435\u043C\u0438\u0438\u00BB, \u00AB\u041F\u043E\u043B\u0443\u0447\u0435\u043D\u043D\u044B\u0435 \u043F\u043E\u0434\u0430\u0440\u043A\u0438\u00BB \u0438 \u0442. \u0434. \u041F\u0440\u0438\u043C\u0435\u0440\u044B \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0439 \u0440\u0430\u0441\u0445\u043E\u0434\u043E\u0432 \u043C\u043E\u0433\u0443\u0442 \u0432\u043A\u043B\u044E\u0447\u0430\u0442\u044C \u00AB\u041F\u0440\u043E\u0434\u0443\u043A\u0442\u044B \u043F\u0438\u0442\u0430\u043D\u0438\u044F\u00BB, \u00AB\u0420\u0435\u043C\u043E\u043D\u0442 \u0430\u0432\u0442\u043E\u043C\u043E\u0431\u0438\u043B\u0435\u0439\u00BB, \u00AB\u0410\u0440\u0435\u043D\u0434\u0430\u00BB \u0438 \u0442. \u0434.
HELP_CLEAR_TRANSACTION=\u041E\u0447\u0438\u0449\u0430\u0435\u0442 \u0432\u0441\u0435 \u043F\u043E\u043B\u044F \u0432 \u0440\u0435\u0434\u0430\u043A\u0442\u043E\u0440\u0435 \u0442\u0440\u0430\u043D\u0437\u0430\u043A\u0446\u0438\u0439 \u0438 \u043E\u0442\u043C\u0435\u043D\u044F\u0435\u0442 \u0432\u044B\u0431\u043E\u0440 \u043B\u044E\u0431\u043E\u0439 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u0439 \u0442\u0440\u0430\u043D\u0437\u0430\u043A\u0446\u0438\u0438 (\u0435\u0441\u043B\u0438 \u043F\u0440\u0438\u043C\u0435\u043D\u0438\u043C\u043E).
