C1\u03B5\u03C9\u03C3\u03C4\u03B9\u03BA\u03BF\u03AF \u03BB\u03BF\u03B3\u03B1\u03C1\u03B9\u03B1\u03C3\u03BC\u03BF\u03AF (\u03B5\u03C0\u03B9\u03C4\u03B1\u03B3\u03AD\u03C2, \u03C4\u03B1\u03BC\u03B9\u03B5\u03C5\u03C4\u03AE\u03C1\u03B9\u03B1) \u03B5\u03AF\u03BD\u03B1\u03B9 \u03B8\u03B5\u03C4\u03B9\u03BA\u03BF\u03AF. \u03C0\u03B9\u03C3\u03C4\u03C9\u03C4\u03B9\u03BA\u03BF\u03AF \u03BB\u03BF\u03B3\u03B1\u03C1\u03B9\u03B1\u03C3\u03BC\u03BF\u03AF (\u03C0\u03B9\u03C3\u03C4\u03C9\u03C4\u03B9\u03BA\u03AD\u03C2 \u03BA\u03AC\u03C1\u03C4\u03B5\u03C2, \u03B4\u03AC\u03BD\u03B5\u03B9\u03B1) \u03BC\u03C0\u03BF\u03C1\u03B5\u03AF \u03BD\u03B1 \u03B5\u03AF\u03BD\u03B1\u03B9 \u03B1\u03C1\u03BD\u03B7\u03C4\u03B9\u03BA\u03BF\u03AF. \u03A0\u03B5\u03C1\u03B9\u03BB\u03B1\u03BC\u03B2\u03AC\u03BD\u03B5\u03C4\u03B1\u03B9 \u03C4\u03BF \u03B1\u03C1\u03C7\u03B9\u03BA\u03CC \u03C5\u03C0\u03CC\u03BB\u03BF\u03B9\u03C0\u03BF \u03B3\u03B9\u03B1 \u03BA\u03AC\u03B8\u03B5 \u03BB\u03BF\u03B3\u03B1\u03C1\u03B9\u03B1\u03C3\u03BC\u03CC.
