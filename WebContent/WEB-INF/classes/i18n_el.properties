REPORT_INFO_INFLOW_ACCOUNT_BODY=\u0395\u03BC\u03C6\u03B1\u03BD\u03AF\u03B6\u03B5\u03B9 \u03C4\u03BF \u03C3\u03CD\u03BD\u03BF\u03BB\u03BF \u03C4\u03C9\u03BD \u03C7\u03C1\u03B7\u03BC\u03AC\u03C4\u03C9\u03BD \u03C0\u03BF\u03C5 \u03B5\u03B9\u03C3\u03C1\u03AD\u03BF\u03C5\u03BD \u03C0\u03C1\u03BF\u03C2 \u03BA\u03B1\u03B9 \u03B1\u03C0\u03CC \u03BA\u03AC\u03B8\u03B5 \u03BB\u03BF\u03B3\u03B1\u03C1\u03B9\u03B1\u03C3\u03BC\u03CC \u03BA\u03B1\u03C4\u03AC \u03C4\u03B7\u03BD \u03B5\u03C0\u03B9\u03BB\u03B5\u03B3\u03BC\u03AD\u03BD\u03B7 \u03C0\u03B5\u03C1\u03AF\u03BF\u03B4\u03BF.\n\n\u03A5\u03C0\u03BF\u03BB\u03BF\u03B3\u03B9\u03C3\u03BC\u03CC\u03C2: \u0393\u03B9\u03B1 \u03BA\u03AC\u03B8\u03B5 \u03BB\u03BF\u03B3\u03B1\u03C1\u03B9\u03B1\u03C3\u03BC\u03CC, \u03CC\u03BB\u03B5\u03C2 \u03BF\u03B9 \u03B4\u03B9\u03B1\u03B9\u03C1\u03AD\u03C3\u03B5\u03B9\u03C2 \u03CC\u03C0\u03BF\u03C5 \u03B1\u03C5\u03C4\u03CC\u03C2 \u03BF \u03BB\u03BF\u03B3\u03B1\u03C1\u03B9\u03B1\u03C3\u03BC\u03CC\u03C2 \u03B5\u03AF\u03BD\u03B1\u03B9 \u03BF \u03C0\u03C1\u03BF\u03BF\u03C1\u03B9\u03C3\u03BC\u03CC\u03C2 \u03B1\u03B8\u03C1\u03BF\u03AF\u03B6\u03BF\u03BD\u03C4\u03B1\u03B9 \u03C9\u03C2 \u03B5\u03B9\u03C3\u03C1\u03BF\u03AD\u03C2. \u03CC\u03BB\u03B5\u03C2 \u03BF\u03B9 \u03B4\u03B9\u03B1\u03C3\u03C0\u03AC\u03C3\u03B5\u03B9\u03C2 \u03CC\u03C0\u03BF\u03C5 \u03B5\u03AF\u03BD\u03B1\u03B9 \u03B7 \u03C0\u03B7\u03B3\u03AE \u03B1\u03B8\u03C1\u03BF\u03AF\u03B6\u03BF\u03BD\u03C4\u03B1\u03B9 \u03C9\u03C2 \u03B5\u03BA\u03C1\u03BF\u03AD\u03C2.\n\n\u03A5\u03C0\u03BF\u03B8\u03AD\u03C3\u03B5\u03B9\u03C2: \u039F\u03B9 \u03BC\u03B5\u03C4\u03B1\u03C6\u03BF\u03C1\u03AD\u03C2 \u03BC\u03B5\u03C4\u03B1\u03BE\u03CD \u03C4\u03C9\u03BD \u03B4\u03B9\u03BA\u03CE\u03BD \u03C3\u03B1\u03C2 \u03BB\u03BF\u03B3\u03B1\u03C1\u03B9\u03B1\u03C3\u03BC\u03CE\u03BD \u03B5\u03BC\u03C6\u03B1\u03BD\u03AF\u03B6\u03BF\u03BD\u03C4\u03B1\u03B9 \u03C4\u03CC\u03C3\u03BF \u03C9\u03C2 \u03B5\u03B9\u03C3\u03C1\u03BF\u03AE \u03C3\u03B5 \u03AD\u03BD\u03B1\u03BD \u03BB\u03BF\u03B3\u03B1\u03C1\u03B9\u03B1\u03C3\u03BC\u03CC \u03CC\u03C3\u03BF \u03BA\u03B1\u03B9 \u03C9\u03C2 \u03B5\u03BA\u03C1\u03BF\u03AE \u03B1\u03C0\u03CC \u03AD\u03BD\u03B1\u03BD \u03AC\u03BB\u03BB\u03BF, \u03B5\u03C0\u03BF\u03BC\u03AD\u03BD\u03C9\u03C2 \u03B1\u03BA\u03C5\u03C1\u03CE\u03BD\u03BF\u03BD\u03C4\u03B1\u03B9 \u03C3\u03B5 \u03B5\u03C0\u03AF\u03C0\u03B5\u03B4\u03BF \u03BA\u03B1\u03B8\u03B1\u03C1\u03AE\u03C2 \u03B8\u03AD\u03C3\u03B7\u03C2.
