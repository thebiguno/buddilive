CONFIRM_CHANGE_EXISTING_TRANSACTION=Sie \u00E4ndern Kernattribute einer bestehenden Transaktion.  Sind Sie sicher, dass Sie dies tun m\u00F6chten?  Klicken Sie auf \u201EJa\u201C, um fortzufahren, oder auf \u201ENein\u201C, um abzubrechen.<br/><br/>Wenn Sie stattdessen eine neue Transaktion hinzuf\u00FCgen m\u00F6chten, klicken Sie bitte auf die Schaltfl\u00E4che \u201EL\u00F6schen\u201C, bevor Sie eine neue Transaktion hinzuf\u00FCgen.<br/>
CONFIRM_DATE_OUT_OF_RANGE_AFTER=Das angegebene Datum liegt mehr als einen Monat in der Zukunft.  Sind Sie sicher, dass das richtig ist?  Klicken Sie auf \u201EJa\u201C, um mit diesem Datum fortzufahren, oder auf \u201ENein\u201C, um den Vorgang abzubrechen.
CONFIRM_DATE_OUT_OF_RANGE_BEFORE=Das angegebene Datum liegt mehr als ein Jahr zur\u00FCck.  Sind Sie sicher, dass das richtig ist?  Klicken Sie auf \u201EJa\u201C, um mit diesem Datum fortzufahren, oder auf \u201ENein\u201C, um den Vorgang abzubrechen.
CONFIRM_DATE_OUT_OF_RANGE_TITLE=Datum au\u00DFerhalb des g\u00FCltigen Bereichs
CONFIRM_DELETE_ACCOUNT=Sind Sie sicher, dass Sie dieses Konto l\u00F6schen m\u00F6chten?<br/>Wenn damit Transaktionen verbunden sind, wird das Konto nur als gel\u00F6scht markiert (und kann bei Bedarf zu einem sp\u00E4teren Zeitpunkt wiederhergestellt werden).<br/>Wenn keine Transaktionen vorhanden sind, wird das Konto dauerhaft gel\u00F6scht.
CONFIRM_DELETE_CATEGORY=Sind Sie sicher, dass Sie diese Budgetkategorie l\u00F6schen m\u00F6chten?<br/>Wenn Transaktionen damit verkn\u00FCpft sind, wird die Kategorie nur als gel\u00F6scht markiert (und kann bei Bedarf zu einem sp\u00E4teren Zeitpunkt wiederhergestellt werden).<br/>Wenn keine Transaktionen vorhanden sind, wird die Kategorie dauerhaft gel\u00F6scht.
CONFIRM_DELETE_DATA=Das Kontrollk\u00E4stchen \u201EDaten l\u00F6schen\u201C ist aktiviert und alle vorhandenen Daten werden vor der Wiederherstellung des Backups gel\u00F6scht.  Es gibt keine M\u00F6glichkeit, diese Aktion r\u00FCckg\u00E4ngig zu machen.  Sind Sie sicher, dass Sie fortfahren m\u00F6chten?
CONFIRM_DELETE_SCHEDULED=Sind Sie sicher, dass Sie diese geplante Transaktion l\u00F6schen m\u00F6chten?  Nach dem L\u00F6schen werden Transaktionen nicht mehr automatisch erstellt.  Bestehende Transaktionen, die bereits hinzugef\u00FCgt wurden, bleiben bestehen.
CONFIRM_DELETE_TRANSACTION=Sind Sie sicher, dass Sie diese Transaktion l\u00F6schen m\u00F6chten?  Es gibt keine M\u00F6glichkeit, diese Aktion r\u00FCckg\u00E4ngig zu machen.
CONFIRM_DELETE_USER=Durch das L\u00F6schen Ihres Benutzerkontos k\u00F6nnen Sie sich nicht mehr bei Buddi Live anmelden und alle zuvor eingegebenen Daten gehen dauerhaft verloren.<br/><br/>Es wird dringend empfohlen, dass Sie eine Sicherungskopie Ihrer Daten herunterladen, bevor Sie Ihr Konto l\u00F6schen. Dadurch k\u00F6nnen Sie die Daten wiederherstellen, falls Sie ein neues Konto er\u00F6ffnen.<br/><br/>M\u00F6chten Sie Ihr Buddi Live-Benutzerkonto wirklich l\u00F6schen?  Klicken Sie auf \u201EJa\u201C, um das Konto dauerhaft zu l\u00F6schen, oder auf \u201ENein\u201C, um den Vorgang abzubrechen.<br/>
CONFIRM_DELETE_USER2=Sind Sie sicher, dass Sie Ihr Benutzerkonto und alle Daten aus dem System l\u00F6schen m\u00F6chten?  Diese Aktion kann nicht r\u00FCckg\u00E4ngig gemacht werden.<br/><br/>Klicken Sie auf \u201EJa\u201C, um Ihr Buddi Live-Benutzerkonto dauerhaft zu l\u00F6schen, oder klicken Sie auf \u201ENein\u201C, um den Vorgang abzubrechen.<br/>
COOKIES_USED_MESSAGE=Buddi Live verwendet Cookies, um Benutzern die Anmeldung zu erm\u00F6glichen. Daher sind f\u00FCr die Nutzung dieser Website Cookies erforderlich.<br/><br/>Wenn Sie auf \u201EJa\u201C klicken, stimmen Sie zu, dass diese Website Cookies in Ihrem Browser speichern kann.<br/><br/>Weitere Informationen finden Sie in den <a href='doc/termsandconditions.html'>Allgemeinen Gesch\u00E4ftsbedingungen</a>.
