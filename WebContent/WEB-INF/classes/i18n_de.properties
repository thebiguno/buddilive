HELP_ACCOUNT_EDITOR_ACCOUNT_TYPE=Die \u00FCbergeordnete Kategorisierung des Kontos.  Hierbei handelt es sich um eine Freiformbezeichnung, die die Gruppierung \u00E4hnlicher Konten erm\u00F6glicht.  Beispiele hierf\u00FCr sind \u201EScheck\u201C, \u201EErsparnisse\u201C, \u201EKreditkarten\u201C usw.
HELP_ACCOUNT_EDITOR_NAME=Der Name des Kontos.  Dies sollte ein beschreibender Name sein, der das Konto eindeutig identifiziert.  Beispiele f\u00FCr Kontonamen sind \u201EABC Savings\u201C, \u201EVisa Premium\u201C, \u201ECash in Wallet\u201C usw.
HELP_ACCOUNT_EDITOR_STARTING_BALANCE=Der Startsaldo ist der Geldbetrag, der sich bei der ersten Eingabe in Buddi auf dem Konto befindet.  Dieser Betrag sollte im Allgemeinen nach der Ersteinrichtung nicht mehr ge\u00E4ndert werden.
HELP_ACCOUNT_EDITOR_TYPE=Ob es sich bei diesem Konto um ein \u201EDebit\u201C- oder \u201EHaben\u201C-Konto handelt.  Debitkonten sind f\u00FCr Konten, auf denen Geld vorhanden ist: Dinge wie Ersparnisse, Schecks, Bargeld in der Brieftasche usw. Kreditkonten sind f\u00FCr Konten, auf denen Geld geschuldet ist: Dinge wie Kreditkarten, Kredite usw.
HELP_BUDGET_CATEGORY_NAME=Dies ist die Bezeichnung f\u00FCr eine Gruppe gemeinsamer Transaktionen.  Beispielsweise k\u00F6nnte eine Kategorie mit dem Namen \u201ELebensmittel\u201C Lebensmitteleink\u00E4ufe verfolgen; eine Kategorie namens \u201EHaushalt\u201C, um verschiedene Haushaltsausgaben wie M\u00F6bel und einfache Reparaturen zu Hause zu verfolgen; und eine Kategorie mit dem Namen \u201EGehalt\u201C k\u00F6nnte das Einkommen aus einem monatlichen Gehalt erfassen.<br/>Um allgemeine Gruppen von Kategorien zu gruppieren, sehen Sie sich bitte die Funktion \u201E\u00DCbergeordnete Kategorie\u201C unten an.
HELP_BUDGET_CATEGORY_PARENT=Mithilfe einer \u00FCbergeordneten Kategorie k\u00F6nnen zusammengeh\u00F6rige Budgetkategorien gruppiert werden.  Angenommen, es gibt eine Kategorie namens \u201EAutomobilausgaben\u201C.  Anschlie\u00DFend k\u00F6nnten weitere Kategorien hinzugef\u00FCgt werden: \u201EKraftstoff\u201C, \u201EKfz-Versicherung\u201C und \u201EWartung und Reparaturen\u201C, alle mit der \u00FCbergeordneten Kategorie \u201EKfz-Kosten\u201C.  Nach Abschluss werden diese drei Kategorien unterhalb der \u00FCbergeordneten Kategorie \u201EAutomobilausgaben\u201C angezeigt.
HELP_BUDGET_CATEGORY_PERIOD_TYPE=Der Budgetzeitraum, der der Budgetkategorie zugewiesen werden soll.  Ein \u201EBudgetzeitraum\u201C ist ein sich wiederholender Zeitraum von Daten, f\u00FCr den Sie in Ihrem Budget einen Betrag zuweisen. Beispielsweise sollte einer Budgetkategorie zur Verfolgung monatlicher Grundsteuern der Periodentyp \u201EMonat\u201C zugewiesen werden.
HELP_BUDGET_CATEGORY_TYPE=Geben Sie diesen Wert abh\u00E4ngig davon an, ob die Budgetkategorie Einnahmen- oder Ausgabentransaktionen darstellt.  Beispiele f\u00FCr Einkommenskategorien k\u00F6nnten \u201EGehalt\u201C, \u201EBonus\u201C, \u201EErhaltene Geschenke\u201C usw. sein. Beispiele f\u00FCr Ausgabenkategorien k\u00F6nnten \u201ELebensmittel\u201C, \u201EAutoreparatur\u201C, \u201EMiete\u201C usw. sein.
HELP_CLEAR_TRANSACTION=L\u00F6scht alle Felder im Transaktionseditor und hebt die Auswahl aller ausgew\u00E4hlten Transaktionen auf (falls zutreffend).
HELP_CURRENCY=Die f\u00FCr alle Transaktionen verwendete W\u00E4hrung.  Dies wird entsprechend dem angegebenen Gebietsschema angezeigt.
HELP_DATE_FORMAT=Dadurch kann das Standarddatumsformat f\u00FCr das ausgew\u00E4hlte Gebietsschema \u00FCberschrieben werden.  Belassen Sie diesen Wert auf \u201EStandardeinstellungen f\u00FCr Gebietsschema verwenden\u201C, um das Datumsformat f\u00FCr das angegebene Gebietsschema zu verwenden.
HELP_SHOW_DELETED=Geloeschte Konten und Budgetkategorien in Listen und Auswahllisten anzeigen.
HELP_DELETE_DATA=Wenn diese Option ausgew\u00E4hlt ist, werden alle vorhandenen Daten vor der Wiederherstellung gel\u00F6scht.  Es gibt keine M\u00F6glichkeit, diese Aktion r\u00FCckg\u00E4ngig zu machen.  Beachten Sie, dass bei der Wiederherstellung bestehender Daten nicht alles dupliziert wird \u2013 der Wiederherstellungsvorgang f\u00FCgt nur das hinzu, was in der Sicherungsdatei neu ist.
HELP_DELETE_TRANSACTION=L\u00F6scht die aktuell ausgew\u00E4hlte Transaktion
HELP_ENCRYPT_DATA_PASSWORD=Um die Verschluesselungseinstellungen zu aendern, geben Sie Ihr aktuelles Anmeldepasswort ein.
HELP_ENCRYPT_DATA=Diese Option legt fest, ob dieses Konto und sensible Daten verschluesselt werden. Wenn aktiviert, verschluesselt Buddi Live bestimmte Datenfelder, einschliesslich Konto- und Budgetnamen sowie Transaktionsbeschreibungen.<br/><br/>Bitte beachten Sie: Es gibt keine Hintertuer fuer diese Verschluesselung. Wenn die Verschluesselung aktiviert ist, ist kein Passwort-Reset moeglich; geht das Passwort verloren, sind die Daten unwiederbringlich verloren.<br/><br/>Weitere Details finden Sie auf der <a href='doc/encryption.html' target='_blank'>Buddi Live-Verschluesselungsseite</a>.
HELP_END_DATE=Wird mit der Intervallauswahl \u201EAndere\u201C verwendet.  Das Enddatum f\u00FCr das Berichtsintervall.
HELP_GETTING_STARTED_TITLE=Erste Schritte
HELP_GETTING_STARTED=<b>Willkommen bei Buddi Live!</b><br/><br/>Wenn Sie bereits ein Buddi-Desktop-Benutzer sind, k\u00F6nnen Sie Ihre Transaktionen exportieren, indem Sie auf Datei \u2192 Exportieren \u2192 Buddi Live-Daten exportieren klicken.  Sie k\u00F6nnen dies in Buddi Live importieren, indem Sie auf System \u2192 Wiederherstellen klicken und die .json-Datei ausw\u00E4hlen, die beim Export erstellt wurde.<br/><br/>Wenn Sie neu in der Buddi-Softwarepalette sind, k\u00F6nnen Sie <a href='doc/tutorial.html' target='_blank'>das Tutorial ansehen</a>, um Hilfe bei den ersten Schritten zu erhalten.<br/><br/>Um die Verschl\u00FCsselung zu aktivieren oder die Gebietsschema- und Formatdetails zu \u00E4ndern, klicken Sie auf System \u2192 Einstellungen.<br/><br/>Diese Meldung wird jedes Mal beim Start angezeigt, bis Sie mindestens ein Konto hinzugef\u00FCgt haben.  Sie k\u00F6nnen es erneut anzeigen, indem Sie auf System \u2192 Erste Schritte klicken.
HELP_INTERVAL_PICKER=Das f\u00FCr diesen Bericht zu verwendende Datumsintervall.  W\u00E4hlen Sie ein vordefiniertes Intervall oder geben Sie ein benutzerdefiniertes Start-/Enddatum ein.
HELP_LOCALE=Die Sprache/das Land, das f\u00FCr Lokalisierungen verwendet wird.  Zu den Lokalisierungen geh\u00F6ren die Sprache, die Formatierung des W\u00E4hrungssymbols, die Standardformatierung von Datum und Zahlen usw.
HELP_RECORD_UPDATE_TRANSACTION=Zeichnen Sie die aktuell ausgew\u00E4hlte Transaktion auf (oder aktualisieren Sie sie).  Dr\u00FCcken Sie Strg + Eingabetaste, wenn Sie die Transaktion als Verkn\u00FCpfung bearbeiten.
HELP_REGISTER_2=Bitte \u00FCberpr\u00FCfen Sie Ihre E-Mails auf einen Aktivierungsschl\u00FCssel.  Sobald es angekommen ist, kopieren Sie es hierher, w\u00E4hlen Sie ein Passwort und klicken Sie auf \u201EKonto erstellen\u201C.<br/><br/>Nachdem Sie das Konto erstellt haben, k\u00F6nnen Sie sich mit Ihrer E-Mail-Adresse und Ihrem Passwort anmelden.
HELP_REGISTER=Bitte geben Sie eine g\u00FCltige E-Mail-Adresse ein und klicken Sie auf \u201ESchl\u00FCssel generieren\u201C.
HELP_REPEATING_BIWEEKLY=Legen Sie fest, dass diese Transaktion alle zwei Wochen am angegebenen Wochentag wiederholt wird.
HELP_REPEATING_EVERY_X_DAYS=Legen Sie fest, dass diese Transaktion nach der angegebenen Anzahl von Tagen wiederholt wird.  Dieser Wert muss gr\u00F6\u00DFer als 0 sein.
HELP_REPEATING_MONTHLY_BY_DAY_OF_WEEK=Legen Sie fest, dass diese Transaktion jeden Monat am angegebenen Wochentag wiederholt wird.
HELP_REPEATING_MONTHLY=Legen Sie fest, dass diese Transaktion jeden Monat am angegebenen Tag des Monats wiederholt wird.  Bedenken Sie, dass nur einige Monate 31 Tage haben; Verwenden Sie \u201ELetzter Tag\u201C, um sich automatisch an k\u00FCrzere Monate anzupassen.
HELP_REPEATING_MULTIPLE_MONTHS_EVERY_YEAR=Legen Sie fest, dass diese Transaktion am angegebenen Tag des Monats und in den angegebenen Monaten des Jahres wiederholt wird.
HELP_REPEATING_MULTIPLE_WEEKS_EVERY_MONTH=Legen Sie fest, dass diese Transaktion am angegebenen Wochentag und in den angegebenen Wochen im Monat wiederholt wird.
HELP_REPEATING_WEEKLY=Legen Sie fest, dass diese Transaktion jede Woche am angegebenen Wochentag wiederholt wird.
HELP_RESET_PASSWORD_2=Sobald der Aktivierungsschl\u00FCssel in Ihrer E-Mail eintrifft, kopieren Sie ihn bitte hierher und w\u00E4hlen Sie ein neues Passwort.<br/><br/>Wenn Ihr Konto verschl\u00FCsselt ist, gibt es keine M\u00F6glichkeit, Ihr Passwort wiederherzustellen, und Sie erhalten den Aktivierungsschl\u00FCssel nicht.
HELP_RESET_PASSWORD=Geben Sie Ihre Login-E-Mail-Adresse ein, um einen tempor\u00E4ren Schl\u00FCssel zum Zur\u00FCcksetzen Ihres Passworts zu erhalten.<br/><br/>Sie k\u00F6nnen Ihr Passwort nur zur\u00FCcksetzen, wenn Sie die Verschl\u00FCsselung nicht aktiviert haben.  Wenn Ihr Konto verschl\u00FCsselt ist, gibt es keine M\u00F6glichkeit, Ihr Passwort wiederherzustellen, und Sie erhalten keinen Aktivierungsschl\u00FCssel.
HELP_RESTORE_FILE=Laden Sie eine Datei hoch, die zuvor von Buddi Live gespeichert wurde, oder eine Datei, die von der Desktop-Version von Buddi nach Buddi Live exportiert wurde.  Diese Datei hat im Allgemeinen die Erweiterung .json und hei\u00DFt, wenn sie von Buddi Live generiert wird, \u201Ebackup.json\u201C.
HELP_SCHEDULED_TRANSACTION_END_DATE=Der Tag, an dem diese geplante Transaktion enden soll.  Lassen Sie dieses Feld leer, um niemals ein Stoppdatum zu planen (dies kann bei Bedarf sp\u00E4ter ge\u00E4ndert werden).
HELP_SCHEDULED_TRANSACTION_MESSAGE=Eine Meldung, die angezeigt wird, wenn die geplante Transaktion ausgel\u00F6st wurde.  Die Meldung wird beim Anmelden angezeigt.  Lassen Sie dieses Feld leer, um nichts anzuzeigen.
HELP_SCHEDULED_TRANSACTION_NAME=Der Name der geplanten Transaktion.  Dies sollte aussagekr\u00E4ftig genug sein, um zu erkennen, was die geplante Transaktion bewirkt.  Einige Beispiele k\u00F6nnten \u201EMonatliche \u00DCberweisung auf Ersparnisse\u201C, \u201EPers\u00F6nlicher Zuschuss\u201C usw. sein.
HELP_SCHEDULED_TRANSACTION_REPEAT=W\u00E4hlen Sie eine H\u00E4ufigkeit aus, um diese geplante Transaktion zu wiederholen.  Abh\u00E4ngig vom gew\u00E4hlten Zeitplan k\u00F6nnen unten unterschiedliche Optionen angezeigt werden.
HELP_SCHEDULED_TRANSACTION_START_DATE=Der Tag, an dem diese geplante Transaktion beginnen soll.
HELP_SCHEDULED_TRANSACTION_TRANSACTION=Die Transaktion, die automatisch nach dem angegebenen Zeitplan hinzugef\u00FCgt wird.  Geben Sie mindestens die Beschreibung, den Betrag und die Herkunfts-/Zielquellen an.
HELP_START_DATE=Wird mit der Intervallauswahl \u201EAndere\u201C verwendet.  Das Startdatum f\u00FCr das Berichtsintervall.
HELP_STORE_EMAIL=Diese Option steuert, ob Buddi Live Ihre Anmelde-E-Mail in wiederherstellbarer Form fuer System-E-Mails speichert. Fuer maximale Privatsphaere deaktiviert lassen.
HELP_TIMEZONE=Die lokale Zeitzone.  Dies wird verwendet, um geplante Transaktionen um Mitternacht Ortszeit auszuf\u00FChren.  Wenn eine bestimmte Zeitzone die Sommerzeit unterst\u00FCtzen soll, w\u00E4hlen Sie den Eintrag \u201EDaylight\u201C anstelle des Eintrags \u201EStandard\u201C (z. B. wird \u201EMountain Daylight Time\u201C automatisch auf Sommerzeit umgestellt, w\u00E4hrend \u201EMountain Standard Time\u201C nicht auf Sommerzeit umgestellt wird).
HELP_USE_TWO_FACTOR=Verwenden Sie Zwei-Faktor-Authentifizierung. Nach der Einrichtung mit einer Authenticator-App muessen Sie beim Anmelden einen 6-stelligen Code eingeben.
HELP=Hilfe
INCOME=Einnahme
INCORRECT_PASSWORD=Falsches Kennwort. Versuchen Sie es erneut.
INCORRECT_PASSWORD_ENABLE_ENCRYPTION=Ung\u00FCltiges Passwort zum Aktivieren der Verschl\u00FCsselung
INCORRECT_PASSWORD_DISABLE_ENCRYPTION=Ung\u00FCltiges Passwort zum Deaktivieren der Verschl\u00FCsselung
INCORRECT_PASSWORD_DISABLE_TWO_FACTOR=Ung\u00FCltiges Passwort zum Deaktivieren der Zwei-Faktor-Authentifizierung
INFLOW=Zufluss
INFO_LOADING_DELETED_SOURCE_TITLE=Quelle in Von-/Bis-Feldern gel\u00F6scht
INFO_LOADING_DELETED_SOURCE=Offenbar haben Sie eine Transaktion geladen, die auf ein gel\u00F6schtes Konto/eine gel\u00F6schte Kategorie verweist.  Beachten Sie, dass Sie diese Transaktion nicht \u00E4ndern k\u00F6nnen, ohne zuvor die Quelle in eine nicht gel\u00F6schte Quelle zu \u00E4ndern.<br/><br/>Wenn Sie diese Transaktion \u00E4ndern m\u00F6chten, ohne die Von-/Nach-Quelle zu \u00E4ndern, aktivieren Sie bitte die Option \u201EGel\u00F6schte Konten und Budgetkategorien anzeigen\u201C unter System \u2192 Einstellungen.<br/>
INTERVAL_PICKER=Intervallauswahl
INTERVAL=Intervall
INVALID=Ung\u00FCltig
LOADING=Laden...
LOCALE=Lokalisierung
LOGIN_FAILED_MESSAGE=Falscher Benutzername/Passwort.
LOGIN_FAILED_TITLE=Fehler bei der Anmeldung
LOGOUT=Abmelden
MEMO=Memo
