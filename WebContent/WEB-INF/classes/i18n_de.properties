REPORT_INFO_AVG_INCOME_EXPENSES_BODY=Zeigt die durchschnittlichen monatlichen Einnahmen und Ausgaben pro Kategorie im ausgew\u00E4hlten Zeitraum an.\n\nBerechnung: Die gleichen Summen wie \u201EEinnahmen und Ausgaben nach Kategorie\u201C werden durch die Anzahl der Monate im ausgew\u00E4hlten Intervall dividiert, um einen monatlichen Durchschnitt zu erhalten.\n\nAnnahmen: Teilmonate am Anfang oder Ende des Intervalls werden als ganze Monate gez\u00E4hlt. N\u00FCtzlich, um Ihr typisches monatliches Ausgabenmuster zu ermitteln.
REPORT_INFO_AVG_INCOME_EXPENSES_TITLE=Durchschnittliche Einnahmen und Ausgaben nach Kategorie
REPORT_INFO_BALANCES_OVER_TIME_BODY=Stellt den laufenden Saldo jedes Kontos \u00FCber den ausgew\u00E4hlten Zeitraum als Liniendiagramm dar.\n\nBerechnung: Der Server spielt alle Transaktionen in Datumsreihenfolge ab und akkumuliert einen laufenden Saldo f\u00FCr jedes Konto. Pro Woche (oder an wichtigen Daten) wird ein Datenpunkt ausgegeben.\n\nAnnahmen: Salden werden als gespeichert angezeigt \u2013 Sollkonten (Schecks, Ersparnisse) sind positiv; Kreditkonten (Kreditkarten, Kredite) k\u00F6nnen negativ sein. Das Startguthaben f\u00FCr jedes Konto ist enthalten.
REPORT_INFO_BALANCES_OVER_TIME_TITLE=Kontost\u00E4nde im Zeitverlauf
REPORT_INFO_BUDGET_VS_ACTUAL_BODY=Vergleicht Ihren budgetierten Betrag mit den tats\u00E4chlichen Ausgaben f\u00FCr jede Ausgabenkategorie im ausgew\u00E4hlten Zeitraum.\n\nBerechnung: Budgetbetr\u00E4ge stammen aus den Kategoriebudgeteintr\u00E4gen f\u00FCr den Zeitraum. Die tats\u00E4chlichen Betr\u00E4ge sind die Summe aller Transaktionsaufteilungen, die jeder Kategorie zugeordnet sind. Beide werden als nebeneinander liegende Balken angezeigt.\n\nAnnahmen: Es werden nur Ausgabenkategorien mit einem Budgeteintrag oder tats\u00E4chlichen Transaktionen angezeigt. Einkommenskategorien sind ausgeschlossen. Wenn f\u00FCr eine Kategorie kein Budget festgelegt ist, ist der Budgetbalken Null.
REPORT_INFO_BUDGET_VS_ACTUAL_TITLE=Budget vs. Ist
REPORT_INFO_CATEGORY_DRILLDOWN_BODY=Zeigt den monatlichen Ausgabentrend f\u00FCr eine einzelne ausgew\u00E4hlte Kategorie \u00FCber das ausgew\u00E4hlte Intervall an.\n\nBerechnung: Alle der ausgew\u00E4hlten Kategorie (oder einer ihrer Unterkategorien) zugewiesenen Transaktionsaufteilungen werden pro Kalendermonat summiert und als Liniendiagramm dargestellt.\n\nAnnahmen: Unterkategorien sind in der Gesamtsumme enthalten. Es wird nur die ausgew\u00E4hlte Kategorie angezeigt. Verwenden Sie mehrere Registerkarten, um Kategorien nebeneinander zu vergleichen.
REPORT_INFO_CATEGORY_DRILLDOWN_TITLE=Kategorie-Drilldown
REPORT_INFO_DEBT_PAYDOWN_BODY=Verfolgt den Saldo Ihrer Kredit- und Kreditkonten im Laufe der Zeit, um den Fortschritt des Schuldenabbaus zu visualisieren.\n\nBerechnung: Alle Transaktionsaufteilungen mit Kreditkonten werden in Datumsreihenfolge wiedergegeben, um einen laufenden Saldo f\u00FCr jedes Kreditkonto zu erstellen. Pro Woche wird ein Datenpunkt ausgegeben.\n\nAnnahmen: Es werden nur Konten vom Typ Kredit (Kreditkarten, Kreditlinien, Darlehen) angezeigt. Salden werden als negative Zahlen angezeigt \u2013 eine Linie, die gegen Null tendiert, bedeutet, dass Schulden abbezahlt werden. Debitkonten (Scheck, Sparkonto) sind ausgeschlossen.
REPORT_INFO_DEBT_PAYDOWN_TITLE=Schuldentilgungs-Tracker
REPORT_INFO_INCOME_EXPENSES_BODY=Eine detaillierte Tabelle, in der die Gesamteinnahmen und -ausgaben f\u00FCr jede Kategorie im ausgew\u00E4hlten Zeitraum verglichen werden.\n\nBerechnung: Aufteilungen werden nach ihrer Kategorie gruppiert. Einkommenskategorien zeigen die gesamten Zufl\u00FCsse; In den Ausgabenkategorien werden die Gesamtabfl\u00FCsse angezeigt. Zeilen k\u00F6nnen erweitert werden, um einzelne Transaktionen anzuzeigen.\n\nAnnahmen: Es wird nur der aktuelle Zeitraum angezeigt. \u00DCberweisungen zwischen Konten werden nicht angezeigt.
REPORT_INFO_INCOME_EXPENSES_TITLE=Einnahmen und Ausgaben nach Kategorie
REPORT_INFO_INFLOW_ACCOUNT_BODY=Zeigt den gesamten Geldfluss an und aus jedem Konto im ausgew\u00E4hlten Zeitraum.\n\nBerechnung: F\u00FCr jedes Konto werden alle Aufteilungen, bei denen dieses Konto das Ziel ist, als Zufluss summiert; Alle Aufteilungen, bei denen es sich um die Quelle handelt, werden als Abfl\u00FCsse summiert.\n\nAnnahmen: \u00DCberweisungen zwischen Ihren eigenen Konten erscheinen sowohl als Zufluss zu einem Konto als auch als Abfluss von einem anderen, sodass sie sich auf der Nettoverm\u00F6gensebene aufheben.
REPORT_INFO_INFLOW_ACCOUNT_TITLE=Zu- und Abfl\u00FCsse nach Konto
REPORT_INFO_INFLOW_PAYEE_BODY=Ordnet Zahlungsempf\u00E4nger (Transaktionsbeschreibungen) nach ihrem gesamten Zu- und Abfluss im ausgew\u00E4hlten Zeitraum.\n\nBerechnung: Transaktionen werden nach Beschreibung (Name des Zahlungsempf\u00E4ngers) gruppiert. Alle Aufteilungen innerhalb jeder Transaktion werden je nach Vorzeichen als Zu- oder Abfluss summiert.\n\nAnnahmen: Die \u00DCbereinstimmung des Zahlungsempf\u00E4ngers ist exakt \u2013 derselbe Zahlungsempf\u00E4nger mit leicht unterschiedlicher Schreibweise wird als separate Eintr\u00E4ge angezeigt. Verschl\u00FCsselte Namen werden nur zur Anzeige entschl\u00FCsselt.
REPORT_INFO_INFLOW_PAYEE_TITLE=Zu- und Abfluss nach Zahlungsempf\u00E4nger
REPORT_INFO_MONTHLY_CASH_FLOW_BODY=Zeigt Gesamteinnahmen, Gesamtausgaben und Netto-Cashflow (Einnahmen minus Ausgaben) f\u00FCr jeden Monat im ausgew\u00E4hlten Zeitraum an.\n\nBerechnung: Aufteilungen werden nach Kalendermonat gruppiert. Einkommensaufteilungen (aus einer Einkommenstypkategorie) werden als Einkommen summiert; Aufteilungen von Ausgaben (in eine Kategorie vom Typ \u201EAusgaben\u201C) werden als Ausgaben summiert. Netto = Einnahmen \u2212 Ausgaben.\n\nAnnahmen: \u00DCberweisungen zwischen Konten sind ausgeschlossen. Ein positiver Nettobarwert bedeutet, dass Sie in diesem Monat weniger ausgegeben als verdient haben; Negativ bedeutet, dass Sie zu viel ausgegeben haben.
REPORT_INFO_MONTHLY_CASH_FLOW_TITLE=Monatlicher Cashflow
REPORT_INFO_NET_WORTH_BODY=Stellt Ihr Gesamtnettoverm\u00F6gen (Summe aller Kontost\u00E4nde) \u00FCber den ausgew\u00E4hlten Zeitraum als einzelne Linie dar.\n\nBerechnung: Wie Kontost\u00E4nde im Zeitverlauf, aber alle Kontost\u00E4nde werden an jedem w\u00F6chentlichen Datenpunkt zu einem einzigen Nettowertwert summiert.\n\nAnnahmen: Alle Konten sind enthalten \u2013 Verm\u00F6genswerte (Schecks, Ersparnisse, Investitionen) tragen zum Nettoverm\u00F6gen bei; Verbindlichkeiten (Kreditkarten, Kredite) abziehen. Konten ohne Transaktionen in diesem Zeitraum tragen weiterhin ihren Saldo bei.
REPORT_INFO_NET_WORTH_TITLE=Nettoverm\u00F6gen im Laufe der Zeit
REPORT_INFO_PIE_EXPENSES_BODY=Zeigt den Anteil der Gesamtausgaben an, die jeder Ausgabenkategorie der obersten Ebene im ausgew\u00E4hlten Zeitraum zugeordnet werden.\n\nBerechnung: Alle Transaktionsaufteilungen, bei denen das Ziel eine Ausgabenkategorie ist, werden summiert. Die Gesamtsumme jeder Kategorie wird als Prozentsatz der Gesamtausgaben ausgedr\u00FCckt. Unterkategorien werden in ihren \u00FCbergeordneten Kategorien zusammengefasst.\n\nAnnahmen: \u00DCbertragungen zwischen Konten sind ausgeschlossen. Es werden nur Teilungen mit einem Ziel vom Typ \u201EAusgabe\u201C gez\u00E4hlt.
REPORT_INFO_PIE_EXPENSES_TITLE=Ausgaben nach Kategorie (Pie)
REPORT_INFO_PIE_INCOME_BODY=Zeigt den Anteil der einzelnen Einkommenskategorien der obersten Ebene am Gesamteinkommen im ausgew\u00E4hlten Zeitraum an.\n\nBerechnung: Alle Transaktionsaufteilungen, bei denen die Quelle eine Einkommenskategorie ist, werden summiert. Die Gesamtsumme jeder Kategorie wird als Prozentsatz des Gesamteinkommens ausgedr\u00FCckt. Es werden nur Kategorien der obersten Ebene angezeigt. Unterkategorien werden in ihren \u00FCbergeordneten Kategorien zusammengefasst.\n\nAnnahmen: \u00DCbertragungen zwischen Konten sind ausgeschlossen. Es werden nur Aufteilungen mit einer Einkommensquelle gez\u00E4hlt.
REPORT_INFO_PIE_INCOME_TITLE=Einkommen nach Kategorie (Kuchen)
REPORT_INFO_PROJECTED_BALANCE_BODY=Prognostiziert, wie sich Ihr Kontostand in den n\u00E4chsten N Tagen \u00E4ndern wird, basierend auf Ihren bisherigen Ausgabemustern.\n\nBerechnung: Die Transaktionen der letzten 12 Monate werden analysiert, um eine durchschnittliche monatliche Nettover\u00E4nderung f\u00FCr jedes Konto zu berechnen. Ausgehend vom heutigen tats\u00E4chlichen Saldo wird dieser Durchschnitt am 1. jedes prognostizierten Monats angewendet. F\u00FCr jedes aktive Konto wird eine w\u00F6chentliche Momentaufnahme erstellt.\n\nAnnahmen: Es werden nur Konten mit einer durchschnittlichen monatlichen Ver\u00E4nderung von mehr als 1\u00A0$ angezeigt (statische Anlagekonten werden ausgeblendet). Die Prognose geht davon aus, dass die Zukunft wie der Durchschnitt der letzten 12 Monate aussehen wird \u2013 einmalige gro\u00DFe Transaktionen, saisonale Schwankungen oder \u00C4nderungen in den Ausgabegewohnheiten sind darin nicht ber\u00FCcksichtigt.
REPORT_INFO_PROJECTED_BALANCE_TITLE=Projizierter Saldo
REPORT_INFO_SAVINGS_RATE_BODY=Zeigt an, wie viel Prozent Ihres Einkommens Sie jeden Monat im ausgew\u00E4hlten Zeitraum gespart haben.\n\nBerechnung: Sparquote % = (Einnahmen \u2212 Ausgaben) / Einnahmen \u00D7 100, berechnet pro Kalendermonat. Darstellung als Liniendiagramm.\n\nAnnahmen: Monate ohne Einkommen werden \u00FCbersprungen, um eine Division durch Null zu vermeiden. Ein Zinssatz \u00FCber 0 % bedeutet, dass Sie Geld gespart haben; Unter 0 % bedeutet, dass Sie mehr ausgegeben als verdient haben. \u00DCberweisungen zwischen Konten sind ausgeschlossen.
REPORT_INFO_SAVINGS_RATE_TITLE=Sparquote
REPORT_INFO_TOP_PAYEES_BODY=Ordnet Ihre wichtigsten Zahlungsempf\u00E4nger (Transaktionsbeschreibungen) nach den Gesamtausgaben im ausgew\u00E4hlten Zeitraum, angezeigt als horizontales Balkendiagramm.\n\nBerechnung: Alle Ausgabenaufteilungen werden nach Transaktionsbeschreibung (Zahlungsempf\u00E4nger) gruppiert. Summen werden absteigend sortiert. Jeder Balken zeigt au\u00DFerdem den Prozentsatz des Zahlungsempf\u00E4ngers an den Gesamtausgaben f\u00FCr den Zeitraum an.\n\nAnnahmen: Es werden nur Abfl\u00FCsse in Ausgabentypkategorien gez\u00E4hlt \u2013 Einnahmen und Transfers sind ausgeschlossen. Die Namen der Zahlungsempf\u00E4nger m\u00FCssen genau \u00FCbereinstimmen. Leichte Unterschiede in der Schreibweise f\u00FChren zu separaten Eintr\u00E4gen.
REPORT_INFO_TOP_PAYEES_TITLE=Top-Zahlungsempf\u00E4nger nach Ausgaben
REPORT_INFO_YEAR_OVER_YEAR_BODY=Vergleicht Ausgaben und Einnahmen nach Kategorie zwischen zwei aufeinanderfolgenden Zeitr\u00E4umen gleicher L\u00E4nge (z. B. dieses Jahr vs. letztes Jahr).\n\nBerechnung: Das ausgew\u00E4hlte Intervall definiert den \u201Eaktuellen\u201C Zeitraum. Der Server berechnet automatisch den entsprechenden vorherigen Zeitraum derselben L\u00E4nge. Die Kategoriesummen beider Perioden werden als nebeneinander liegende Balken angezeigt.\n\nAnnahmen: Die vorherige Periode hat immer die gleiche Dauer wie die ausgew\u00E4hlte Periode, jedoch um genau eine Periodenl\u00E4nge nach hinten verschoben. Kategorien ohne Aktivit\u00E4t in einem der beiden Zeitr\u00E4ume sind ausgeschlossen.
REPORT_INFO_YEAR_OVER_YEAR_TITLE=Periodenvergleich nebeneinander
REPORT_MONTHLY_CASH_FLOW=Monatlicher Cashflow
REPORT_PROJECTED_BALANCE=Projizierter Saldo
REPORT_SAVINGS_RATE=Sparquote
