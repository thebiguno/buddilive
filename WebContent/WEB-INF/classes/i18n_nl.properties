HELP_ACCOUNT_EDITOR_ACCOUNT_TYPE=De hoofdindeling van de rekening. Dit is een vrij label waarmee vergelijkbare rekeningen gegroepeerd kunnen worden. Voorbeelden zijn "Betaalrekening", "Spaarrekening", "Creditcards", enz.
HELP_ACCOUNT_EDITOR_NAME=De naam van de rekening.  Dit moet een beschrijvende naam zijn die het account op unieke wijze identificeert.  Voorbeelden van rekeningnamen zijn "ABC Savings", "Visa Premium", "Cash in Wallet", enz.
HELP_ACCOUNT_EDITOR_STARTING_BALANCE=Het startsaldo is het geldbedrag dat op de rekening staat wanneer deze voor het eerst op Buddi wordt ingevoerd.  Dit bedrag mag in het algemeen niet worden gewijzigd na de eerste installatie.
HELP_ACCOUNT_EDITOR_TYPE=Of deze rekening een "Debet"- of "Credit"-rekening is. Debetrekeningen zijn rekeningen met geld, zoals spaarrekeningen, betaalrekeningen en contant geld. Creditrekeningen zijn rekeningen met schuld, zoals creditcards en leningen.
HELP_BUDGET_CATEGORY_NAME=Dit is de naam voor een groep veel voorkomende transacties.  Een categorie met de naam 'Boodschappen' kan bijvoorbeeld voedselaankopen volgen; een categorie met de naam 'Huishouden' om verschillende huishoudelijke uitgaven bij te houden, zoals meubels en eenvoudige huisreparaties; en een categorie met de naam 'Salaris' kan de inkomsten uit een maandsalaris bijhouden.<br/>Om gemeenschappelijke groepen categorieën te groeperen, raadpleegt u de functionaliteit 'Bovenliggende categorie' hieronder.
HELP_BUDGET_CATEGORY_PARENT=Een bovenliggende categorie kan worden gebruikt om gerelateerde budgetcategorieën te groeperen.  Stel dat er bijvoorbeeld een categorie is met de naam 'Auto-uitgaven'.  Er kunnen dan andere categorieën worden toegevoegd: 'Brandstof', 'Autoverzekering' en 'Onderhoud en reparaties', allemaal met als bovenliggende categorie 'Autokosten'.  Eenmaal voltooid, worden deze drie categorieën weergegeven onder de bovenliggende categorie 'Autokosten'.
HELP_BUDGET_CATEGORY_PERIOD_TYPE=De budgetperiode die aan de budgetcategorie moet worden toegewezen.  Een "budgetperiode" is een zich herhalend bereik van datums waarvoor u een bedrag in uw budget toewijst; Aan een budgetcategorie voor het bijhouden van de maandelijkse onroerendgoedbelasting moet bijvoorbeeld het periodetype 'Maand' worden toegewezen.
HELP_BUDGET_CATEGORY_TYPE=Geef deze waarde op, afhankelijk van of de budgetcategorie inkomsten- of uitgaventransacties vertegenwoordigt.  Voorbeelden van inkomenscategorieën kunnen zijn: 'Salaris', 'Bonus', 'Ontvangen cadeaus', enz. Voorbeelden van uitgavencategorieën kunnen zijn: 'Boodschappen', 'Autoreparatie', 'Huur', enzovoort.
HELP_CLEAR_TRANSACTION=Wist alle velden in de transactie-editor en deselecteert elke geselecteerde transactie (indien van toepassing).
HELP_CURRENCY=De valuta die voor alle transacties wordt gebruikt.  Dit wordt weergegeven volgens de opgegeven landinstelling.
HELP_DATE_FORMAT=Dit kan de standaard datumnotatie voor de geselecteerde landinstelling overschrijven.  Laat deze waarde staan ​​op "Gebruik standaardinstellingen voor landinstellingen" om de datumnotatie voor de opgegeven landinstelling te gebruiken.
HELP_SHOW_DELETED=Toon verwijderde rekeningen en budgetcategorieen in lijsten en selecties.
HELP_DELETE_DATA=Als dit wordt geselecteerd, worden alle bestaande gegevens vóór het herstel verwijderd.  Er is geen manier om deze actie ongedaan te maken.  Houd er rekening mee dat het herstellen van bestaande gegevens niet alles zal dupliceren; de herstelprocedure voegt alleen toe wat nieuw is in het back-upbestand.
HELP_DELETE_TRANSACTION=Verwijdert de momenteel geselecteerde transactie
HELP_ENCRYPT_DATA_PASSWORD=Voer je huidige inlogwachtwoord in om versleutelingsinstellingen te wijzigen.
HELP_ENCRYPT_DATA=Deze optie bepaalt of je accountgegevens versleuteld zijn. Als dit is ingeschakeld, versleutelt Buddi Live gevoelige velden zoals rekening- en budgetnamen en transactieomschrijvingen. Als je versleuteling inschakelt, is wachtwoordherstel niet beschikbaar en kunnen verloren wachtwoorden niet worden hersteld. Zie de Buddi Live versleutelingspagina voor details.
HELP_END_DATE=Wordt gebruikt met de intervalkiezer 'Overig'.  De einddatum voor het rapportinterval.
HELP_GETTING_STARTED_TITLE=Aan de slag
HELP_GETTING_STARTED=<b>Welkom bij Buddi Live!</b><br/><br/>Als u een bestaande Buddi-desktopgebruiker bent, kunt u uw transacties exporteren door te klikken op Bestand → Exporteren → Buddi Live-gegevens exporteren.  U kunt dit in Buddi Live importeren door op Systeem → Herstellen te klikken en het .json-bestand te selecteren dat bij de export is gemaakt.<br/><br/>Als u nieuw bent bij de Buddi-softwarereeks, kunt u <a href='doc/tutorial.html' target='_blank'>de tutorial bekijken</a> voor hulp bij het starten.<br/><br/>Om codering in te schakelen of om de landinstellingen en indelingsdetails te wijzigen, klikt u op Systeem → Voorkeuren.<br/><br/>Dit bericht wordt elke keer weergegeven bij het opstarten totdat u ten minste één account heeft toegevoegd.  U kunt het opnieuw bekijken door op Systeem → Aan de slag te klikken.
HELP_INTERVAL_PICKER=Het datuminterval dat voor dit rapport moet worden gebruikt.  Kies een vooraf gedefinieerd interval of voer een aangepaste start-/einddatum in.
HELP_LOCALE=De taal/het land dat wordt gebruikt voor lokalisaties.  Lokalisaties omvatten taal, de opmaak van het valutasymbool, standaarddatum- en getalopmaak, enz.
HELP_RECORD_UPDATE_TRANSACTION=Registreer (of update) de momenteel geselecteerde transactie.  Druk op Ctrl + Enter wanneer u de transactie als snelkoppeling bewerkt.
HELP_REGISTER_2=Controleer uw e-mail voor een activeringssleutel.  Zodra het binnenkomt, kopieert u het hier, selecteert u een wachtwoord en klikt u op 'Account aanmaken'.<br/><br/>Nadat u het account heeft aangemaakt, kunt u inloggen met uw e-mailadres en wachtwoord.
HELP_REGISTER=Voer een geldig e-mailadres in en klik op "Sleutel genereren".
HELP_REPEATING_BIWEEKLY=Stel deze transactie zo in dat deze om de week op de opgegeven dag van de week wordt herhaald.
HELP_REPEATING_EVERY_X_DAYS=Stel in dat deze transactie na het opgegeven aantal dagen wordt herhaald.  Deze waarde moet groter zijn dan 0.
HELP_REPEATING_MONTHLY_BY_DAY_OF_WEEK=Stel in dat deze transactie elke maand op de opgegeven dag van de week wordt herhaald.
HELP_REPEATING_MONTHLY=Stel in dat deze transactie elke maand op de opgegeven dag van de maand wordt herhaald.  Houd er rekening mee dat slechts enkele maanden 31 dagen hebben; gebruik "Laatste Dag" om automatisch aan te passen voor kortere maanden.
HELP_REPEATING_MULTIPLE_MONTHS_EVERY_YEAR=Stel in dat deze transactie wordt herhaald op de opgegeven dag van de maand, op de opgegeven maanden van het jaar.
HELP_REPEATING_MULTIPLE_WEEKS_EVERY_MONTH=Stel in dat deze transactie wordt herhaald op de opgegeven dag van de week, op de opgegeven weken van de maand.
HELP_REPEATING_WEEKLY=Stel in dat deze transactie elke week op de opgegeven dag van de week wordt herhaald.
HELP_RESET_PASSWORD_2=Zodra de activeringssleutel in uw e-mail is ontvangen, kopieert u deze hier en kiest u een nieuw wachtwoord.<br/><br/>Als uw account gecodeerd is, kunt u uw wachtwoord niet herstellen en ontvangt u de activeringssleutel niet.
HELP_RESET_PASSWORD=Voer uw e-mailadres voor aanmelding in om een ​​tijdelijke sleutel te ontvangen waarmee u uw wachtwoord opnieuw kunt instellen.<br/><br/>U kunt uw wachtwoord alleen opnieuw instellen als u de codering niet hebt ingeschakeld.  Als uw account gecodeerd is, kunt u uw wachtwoord niet herstellen en ontvangt u geen activeringssleutel.
HELP_RESTORE_FILE=Upload een bestand dat eerder door Buddi Live is opgeslagen, of een bestand dat vanaf de desktopversie van Buddi naar Buddi Live is geëxporteerd.  Dit bestand heeft doorgaans de extensie .json en wordt, indien gegenereerd vanuit Buddi Live, 'backup.json' genoemd.
HELP_SCHEDULED_TRANSACTION_END_DATE=De dag waarop deze geplande transactie moet stoppen.  Laat dit veld leeg als u nooit een stopdatum wilt plannen (dit kan desgewenst later worden gewijzigd).
HELP_SCHEDULED_TRANSACTION_MESSAGE=Een bericht dat aangeeft wanneer de geplande transactie is geactiveerd.  Het bericht wordt weergegeven bij het inloggen.  Laat dit veld leeg als u niets wilt weergeven.
HELP_SCHEDULED_TRANSACTION_NAME=De naam van de geplande transactie.  Dit moet beschrijvend genoeg zijn om te identificeren wat de geplande transactie doet.  Enkele voorbeelden kunnen zijn: "Maandelijkse overboeking naar spaargeld", "Persoonlijke toelage", enz.
HELP_SCHEDULED_TRANSACTION_REPEAT=Kies een frequentie om deze geplande transactie te herhalen.  Afhankelijk van het gekozen schema kunnen er hieronder verschillende opties worden weergegeven.
HELP_SCHEDULED_TRANSACTION_START_DATE=De dag waarop deze geplande transactie moet beginnen.
HELP_SCHEDULED_TRANSACTION_TRANSACTION=De transactie die automatisch wordt toegevoegd volgens het opgegeven schema.  Geef in ieder geval de omschrijving, het bedrag en de van/naar bronnen op.
HELP_START_DATE=Wordt gebruikt met de intervalkiezer 'Overig'.  De startdatum voor het rapportinterval.
HELP_STORE_EMAIL=Deze optie bepaalt of Buddi Live je inlog-e-mail in herstelbare vorm opslaat voor systeemberichten. Laat uitgeschakeld voor maximale privacy.
HELP_TIMEZONE=De lokale tijdzone.  Dit wordt gebruikt om geplande transacties om middernacht, lokale tijd, uit te voeren.  Als een bepaalde tijdzone zomertijd moet ondersteunen, kies dan de invoer "Daglicht" in plaats van de optie "Standaard" (bijv. "Mountain Daylight Time" schakelt automatisch over naar zomertijd, terwijl "Mountain Standard Time" niet verandert naar zomertijd).
HELP_USE_TWO_FACTOR=Gebruik tweefactorauthenticatie. Na configuratie met een authenticator-app moet je bij het inloggen een 6-cijferige code invoeren.
HELP=Hulp
INCOME=Inkommen
INCORRECT_PASSWORD_ENABLE_ENCRYPTION=Ongeldig wachtwoord voor het inschakelen van codering
INCORRECT_PASSWORD_DISABLE_ENCRYPTION=Ongeldig wachtwoord voor het uitschakelen van encryptie
INCORRECT_PASSWORD_DISABLE_TWO_FACTOR=Ongeldig wachtwoord voor het uitschakelen van tweefactorauthenticatie
INFLOW=Instroom
INFO_LOADING_DELETED_SOURCE_TITLE=Bron verwijderd in van / naar velden
INFO_LOADING_DELETED_SOURCE=Het lijkt erop dat u een transactie heeft geladen die verwijst naar een verwijderde account/categorie.  Houd er rekening mee dat u deze transactie niet kunt wijzigen zonder eerst de bron te wijzigen in een bron die niet is verwijderd.<br/><br/>Als u deze transactie wilt wijzigen zonder de van / naar bron te wijzigen, schakelt u de optie 'Verwijderde accounts en budgetcategorieën weergeven' in onder Systeem → Voorkeuren.<br/>
INTERVAL_PICKER=Intervalkiezer
INTERVAL=Interval
INVALID=Ongeldig
LOADING=Laden...
