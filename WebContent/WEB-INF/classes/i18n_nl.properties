CONFIRM_CHANGE_EXISTING_TRANSACTION_TITLE=Wijzig bestaande transactie
CONFIRM_CHANGE_EXISTING_TRANSACTION=U wijzigt de kernkenmerken van een bestaande transactie.  Weet je zeker dat je dit wilt doen?  Klik op 'Ja' om door te gaan, of klik op 'Nee' om te annuleren.<br/><br/>Als u in plaats daarvan een nieuwe transactie wilt toevoegen, klikt u op de knop 'Wissen' voordat u een nieuwe transactie toevoegt.<br/>
CONFIRM_DATE_OUT_OF_RANGE_AFTER=De opgegeven datum ligt meer dan een maand in de toekomst.  Weet je zeker dat dit klopt?  Klik op 'Ja' om door te gaan met deze datum, of klik op 'Nee' om te annuleren.
CONFIRM_DATE_OUT_OF_RANGE_BEFORE=De opgegeven datum is meer dan een jaar geleden.  Weet je zeker dat dit klopt?  Klik op 'Ja' om door te gaan met deze datum, of klik op 'Nee' om te annuleren.
CONFIRM_DATE_OUT_OF_RANGE_TITLE=Datum buiten bereik
CONFIRM_DELETE_ACCOUNT=Weet u zeker dat u dit account wilt verwijderen?<br/>Als er transacties aan zijn gekoppeld, wordt het account alleen als verwijderd gemarkeerd (en kan indien gewenst op een later tijdstip ongedaan worden gemaakt).<br/>Als er geen transacties zijn, wordt het account permanent verwijderd.
CONFIRM_DELETE_CATEGORY=Weet u zeker dat u deze budgetcategorie wilt verwijderen?<br/>Als er transacties aan zijn gekoppeld, wordt de categorie alleen als verwijderd gemarkeerd (en kan indien gewenst op een later tijdstip weer worden verwijderd).<br/>Als er geen transacties zijn, wordt de categorie permanent verwijderd.
CONFIRM_DELETE_DATA=Het selectievakje "Gegevens verwijderen" is ingeschakeld en alle bestaande gegevens worden verwijderd voordat de back-up wordt hersteld.  Er is geen manier om deze actie ongedaan te maken.  Weet u zeker dat u verder wilt gaan?
CONFIRM_DELETE_SCHEDULED=Weet u zeker dat u deze geplande transactie wilt verwijderen?  Eenmaal verwijderd, worden transacties niet langer automatisch aangemaakt.  Bestaande transacties die al zijn toegevoegd, blijven behouden.
CONFIRM_DELETE_TRANSACTION=Weet u zeker dat u deze transactie wilt verwijderen?  Er is geen manier om deze actie ongedaan te maken.
CONFIRM_DELETE_USER=Door uw gebruikersaccount te verwijderen, kunt u zich niet langer aanmelden bij Buddi Live en gaan alle gegevens die u eerder hebt ingevoerd definitief verloren.<br/><br/>Het wordt ten zeerste aanbevolen dat u een back-up van uw gegevens downloadt voordat u uw account verwijdert; Hiermee kunt u de gegevens herstellen als u een nieuw account opent.<br/><br/>Wilt u echt uw Buddi Live-gebruikersaccount verwijderen?  Klik op 'Ja' om het account definitief te verwijderen, of klik op 'Nee' om te annuleren.<br/>
CONFIRM_DELETE_USER2=Weet u zeker dat u uw gebruikersaccount en alle gegevens uit het systeem wilt verwijderen?  Deze actie kan niet ongedaan worden gemaakt.<br/><br/>Klik op 'Ja' om uw Buddi Live-gebruikersaccount definitief te verwijderen, of klik op 'Nee' om te annuleren.<br/>
COOKIES_USED_MESSAGE=Buddi Live maakt gebruik van cookies zodat gebruikers kunnen inloggen. Cookies zijn dus vereist om deze website te gebruiken.<br/><br/>Door op Ja te klikken, gaat u ermee akkoord dat deze website cookies in uw browser kan opslaan.<br/><br/>Voor meer informatie, zie <a href='doc/termsandconditions.html'>Algemene voorwaarden</a>.
