REPORT_INFO_AVG_INCOME_EXPENSES_BODY=Toont het gemiddelde maandelijkse bedrag aan inkomsten en uitgaven per categorie over de geselecteerde periode.\n\nBerekening: dezelfde totalen als Inkomsten en uitgaven per categorie worden gedeeld door het aantal maanden in het geselecteerde interval om een ​​gemiddelde per maand te verkrijgen.\n\nAannames: Gedeeltelijke maanden aan het begin of einde van het interval worden als volledige maanden geteld. Handig om uw typische maandelijkse bestedingspatroon te identificeren.
REPORT_INFO_AVG_INCOME_EXPENSES_TITLE=Gemiddelde inkomsten en uitgaven per categorie
REPORT_INFO_BALANCES_OVER_TIME_BODY=Geeft het lopende saldo van elke rekening over de geselecteerde periode weer als een lijndiagram.\n\nBerekening: de server herhaalt alle transacties in datumvolgorde, waarbij voor elke rekening een lopend saldo wordt verzameld. Er wordt één datapunt per week (of op belangrijke data) verzonden.\n\nAannames: saldi worden weergegeven als opgeslagen: debetrekeningen (cheques, spaarrekeningen) zijn positief; kredietrekeningen (creditcards, leningen) kunnen negatief zijn. Het startsaldo van elke rekening is inbegrepen.
REPORT_INFO_BALANCES_OVER_TIME_TITLE=Rekeningsaldi in de loop van de tijd
REPORT_INFO_BUDGET_VS_ACTUAL_BODY=Vergelijkt uw gebudgetteerde bedrag met de werkelijke uitgaven voor elke onkostencategorie gedurende de geselecteerde periode.\n\nBerekening: Budgetbedragen komen uit de categoriebudgetposten voor de periode. Werkelijke bedragen zijn de som van alle transactiesplitsingen die aan elke categorie zijn toegewezen. Beide worden weergegeven als balken naast elkaar.\n\nAannames: alleen onkostencategorieën met een budgetinvoer of daadwerkelijke transacties worden weergegeven. Inkomenscategorieën zijn uitgesloten. Als voor een categorie geen budget is ingesteld, is de gebudgetteerde balk nul.
REPORT_INFO_BUDGET_VS_ACTUAL_TITLE=Budget versus Werkelijk
REPORT_INFO_CATEGORY_DRILLDOWN_BODY=Toont de uitgaventrend van maand tot maand voor een enkele geselecteerde categorie gedurende het gekozen interval.\n\nBerekening: alle transactiesplitsingen die zijn toegewezen aan de geselecteerde categorie (of een van de subcategorieën ervan) worden per kalendermaand opgeteld en uitgezet als een lijndiagram.\n\nAannames: subcategorieën zijn opgenomen in het totaal. Alleen de geselecteerde categorie wordt getoond. Gebruik meerdere tabbladen om categorieën naast elkaar te vergelijken.
REPORT_INFO_CATEGORY_DRILLDOWN_TITLE=Categorie-inzoomen
REPORT_INFO_DEBT_PAYDOWN_BODY=Houdt het saldo van uw krediet- en leningrekeningen in de loop van de tijd bij om de voortgang van de schuldreductie te visualiseren.\n\nBerekening: alle transactiesplitsingen waarbij rekeningen van het type Krediet betrokken zijn, worden in datumvolgorde herhaald om een ​​lopend saldo voor elke kredietrekening te verkrijgen. Er wordt één gegevenspunt per week verzonden.\n\nAannames: alleen rekeningen van het type Krediet (creditcards, kredietlijnen, leningen) worden weergegeven. Saldi worden weergegeven als negatieve getallen; een lijn die naar nul neigt, betekent dat de schulden worden afbetaald. Debetrekeningen (chequen, sparen) zijn uitgesloten.
REPORT_INFO_DEBT_PAYDOWN_TITLE=Schuldbetalingstracker
REPORT_INFO_INCOME_EXPENSES_BODY=Een gedetailleerde tabel waarin de totalen van inkomsten en uitgaven voor elke categorie over de geselecteerde periode worden vergeleken.\n\nBerekening: splitsingen worden gegroepeerd op categorie. Inkomenscategorieën geven de totale instroom weer; uitgavencategorieën tonen de totale uitstroom. Rijen kunnen worden uitgevouwen om individuele transacties weer te geven.\n\nAannames: alleen de huidige periode wordt weergegeven. Overboekingen tussen accounts verschijnen niet.
REPORT_INFO_INCOME_EXPENSES_TITLE=Inkomsten en uitgaven per categorie
REPORT_INFO_INFLOW_ACCOUNT_BODY=Toont het totale geld dat in en uit elke rekening stroomt gedurende de geselecteerde periode.\n\nBerekening: voor elke rekening worden alle splitsingen waarbij die rekening de bestemming is, opgeteld als instroom; alle splitsingen waar dit de bron is, worden opgeteld als uitstroom.\n\nAannames: Overboekingen tussen uw eigen rekeningen verschijnen als zowel een instroom naar de ene rekening als een uitstroom naar een andere, en worden dus gecompenseerd op het nettowaardeniveau.
REPORT_INFO_INFLOW_ACCOUNT_TITLE=Instroom en uitstroom per rekening
REPORT_INFO_INFLOW_PAYEE_BODY=Rangschikt begunstigden (transactiebeschrijvingen) op basis van hun totale instroom en uitstroom over de geselecteerde periode.\n\nBerekening: Transacties worden gegroepeerd op beschrijving (naam begunstigde). Alle splitsingen binnen elke transactie worden opgeteld als instroom of uitstroom, afhankelijk van het teken.\n\nAannames: de matching van de begunstigde is exact: dezelfde begunstigde met een iets andere spelling zal als afzonderlijke vermeldingen verschijnen. Gecodeerde namen worden alleen gedecodeerd voor weergave.
REPORT_INFO_INFLOW_PAYEE_TITLE=Instroom en uitstroom door begunstigde
REPORT_INFO_MONTHLY_CASH_FLOW_BODY=Toont de totale inkomsten, totale uitgaven en netto cashflow (inkomsten minus uitgaven) voor elke maand in de geselecteerde periode.\n\nBerekening: splitsingen worden gegroepeerd op kalendermaand. Inkomenssplitsingen (uit een categorie inkomenssoort) worden opgeteld als inkomen; uitgavensplitsingen (naar een categorie van het uitgaventype) worden opgeteld als uitgaven. Netto = Inkomen − Uitgaven.\n\nAannames: overdrachten tussen accounts zijn uitgesloten. Een positieve nettobalk betekent dat u die maand minder heeft uitgegeven dan u heeft verdiend; negatief betekent dat u te veel heeft uitgegeven.
REPORT_INFO_MONTHLY_CASH_FLOW_TITLE=Maandelijkse cashflow
REPORT_INFO_NET_WORTH_BODY=Geeft uw totale nettowaarde (som van alle rekeningsaldi) over de geselecteerde periode weer als één lijn.\n\nBerekening: hetzelfde als rekeningsaldi in de loop van de tijd, maar alle rekeningsaldi worden bij elk wekelijks gegevenspunt opgeteld tot één enkele nettowaarde.\n\nAannames: alle rekeningen zijn inbegrepen: activa (cheques, spaargeld, beleggingen) dragen bij aan de nettowaarde; passiva (creditcards, leningen) aftrekken. Rekeningen zonder transacties in de periode dragen nog steeds hun saldo bij.
REPORT_INFO_NET_WORTH_TITLE=Nettowaarde in de loop van de tijd
REPORT_INFO_PIE_EXPENSES_BODY=Toont het aandeel van de totale uitgaven dat is toegeschreven aan elke onkostencategorie op het hoogste niveau gedurende de geselecteerde periode.\n\nBerekening: alle transactiesplitsingen waarbij de bestemming een onkostencategorie is, worden opgeteld. Het totaal van elke categorie wordt uitgedrukt als een percentage van de totale uitgaven. Subcategorieën worden samengevat in hun bovenliggende categorieën.\n\nAannames: overdrachten tussen accounts zijn uitgesloten. Alleen splitsingen met een bestemming van het type Onkosten worden meegeteld.
REPORT_INFO_PIE_EXPENSES_TITLE=Uitgaven per categorie (taart)
REPORT_INFO_PIE_INCOME_BODY=Toont het aandeel van het totale inkomen dat door elke inkomenscategorie op het hoogste niveau is bijgedragen gedurende de geselecteerde periode.\n\nBerekening: alle transactiesplitsingen waarbij de bron een inkomenscategorie is, worden opgeteld. Het totaal van elke categorie wordt uitgedrukt als een percentage van het totale inkomen. Alleen categorieën op het hoogste niveau worden weergegeven; subcategorieën worden samengevat in hun bovenliggende categorieën.\n\nAannames: overdrachten tussen accounts zijn uitgesloten. Alleen splitsingen met een inkomensbron worden meegeteld.
REPORT_INFO_PIE_INCOME_TITLE=Inkomen per categorie (taart)
REPORT_INFO_PROJECTED_BALANCE_BODY=Voorspelt hoe uw rekeningsaldi de komende N dagen zullen veranderen op basis van uw historische bestedingspatronen.\n\nBerekening: de transacties van de afgelopen twaalf maanden worden geanalyseerd om een ​​gemiddelde maandelijkse nettoverandering voor elke rekening te berekenen. Vanaf het werkelijke saldo van vandaag wordt dat gemiddelde toegepast op de 1e van elke geprojecteerde maand. Voor elke actieve rekening wordt een wekelijkse momentopname weergegeven.\n\nAannames: alleen rekeningen met een gemiddelde maandelijkse wijziging van meer dan $ 1 worden weergegeven (statische beleggingsrekeningen zijn verborgen). De projectie gaat ervan uit dat de toekomst eruit zal zien als het gemiddelde over de afgelopen twaalf maanden; er wordt geen rekening gehouden met eenmalige grote transacties, seizoensvariaties of veranderingen in het bestedingspatroon.
REPORT_INFO_PROJECTED_BALANCE_TITLE=Geprojecteerd saldo
REPORT_INFO_SAVINGS_RATE_BODY=Toont welk percentage van uw inkomen u elke maand gedurende de geselecteerde periode heeft gespaard.\n\nBerekening: Spaarpercentage % = (Inkomsten − Uitgaven) / Inkomen × 100, berekend per kalendermaand. Uitgezet als lijndiagram.\n\nAannames: maanden met een inkomen van nul worden overgeslagen om deling door nul te voorkomen. Een tarief boven 0% betekent dat u geld heeft bespaard; onder de 0% betekent dat u meer heeft uitgegeven dan u heeft verdiend. Overboekingen tussen accounts zijn uitgesloten.
REPORT_INFO_SAVINGS_RATE_TITLE=Spaarrente
REPORT_INFO_TOP_PAYEES_BODY=Rangschikt uw belangrijkste begunstigden (transactiebeschrijvingen) op basis van de totale uitgaven gedurende de geselecteerde periode, weergegeven als een horizontaal staafdiagram.\n\nBerekening: alle uitgavenverdelingen worden gegroepeerd op transactiebeschrijving (begunstigde). Totalen worden aflopend gesorteerd. Elke balk toont ook het percentage van de totale uitgaven van de begunstigde voor de periode.\n\nAannames: alleen uitstromen naar categorieën van het uitgaventype worden meegeteld; inkomsten en overdrachten zijn uitgesloten. De namen van de begunstigden moeten exact overeenkomen; kleine spellingsverschillen zorgen voor afzonderlijke vermeldingen.
REPORT_INFO_TOP_PAYEES_TITLE=Topbegunstigden op basis van uitgaven
REPORT_INFO_YEAR_OVER_YEAR_BODY=Vergelijkt uitgaven en inkomsten per categorie tussen twee opeenvolgende perioden van dezelfde lengte (bijvoorbeeld dit jaar versus vorig jaar).\n\nBerekening: het geselecteerde interval definieert de "huidige" periode. De server berekent automatisch de equivalente voorgaande periode van dezelfde lengte. De categorietotalen van beide perioden worden weergegeven als staven naast elkaar.\n\nAannames: de voorafgaande periode heeft altijd dezelfde duur als de geselecteerde periode, precies één periode teruggeschoven. Categorieën zonder activiteit in beide periodes zijn uitgesloten.
REPORT_INFO_YEAR_OVER_YEAR_TITLE=Vergelijking van periodes naast elkaar
