HELP_ACCOUNT_EDITOR_ACCOUNT_TYPE=Den h\u00F6ga kategoriseringen av kontot.  Detta \u00E4r en friformsetikett som till\u00E5ter gruppering av liknande konton tillsammans.  Exempel inkluderar "Checking", "Sparar", "Kreditkort" etc.
HELP_ACCOUNT_EDITOR_NAME=Namnet p\u00E5 kontot.  Detta b\u00F6r vara ett beskrivande namn som unikt identifierar kontot.  Exempel p\u00E5 kontonamn \u00E4r "ABC Savings", "Visa Premium", "Cash in Wallet" etc.
HELP_ACCOUNT_EDITOR_STARTING_BALANCE=Startsaldot \u00E4r summan pengar p\u00E5 kontot n\u00E4r det f\u00F6rst l\u00E4ggs in p\u00E5 Buddi.  Detta belopp b\u00F6r i allm\u00E4nhet inte \u00E4ndras efter den f\u00F6rsta inst\u00E4llningen.
HELP_ACCOUNT_EDITOR_TYPE=Om det h\u00E4r kontot \u00E4r ett "Debet"- eller "Kredit"-konto.  Debetkonton \u00E4r f\u00F6r konton som har pengar: saker som sparande, checkar, kontanter i pl\u00E5nbok, etc. Kreditkonton \u00E4r f\u00F6r konton som \u00E4r skyldiga pengar: saker som kreditkort, l\u00E5n etc.
HELP_BUDGET_CATEGORY_NAME=Detta \u00E4r namnet p\u00E5 en grupp vanliga transaktioner.  Till exempel kan en kategori som heter "Groceries" sp\u00E5ra matink\u00F6p; en kategori som heter "Hush\u00E5ll" f\u00F6r att sp\u00E5ra olika hush\u00E5llsutgifter som m\u00F6bler och enkla hemreparationer; och en kategori som heter "L\u00F6n" kan sp\u00E5ra inkomster fr\u00E5n en m\u00E5nadsl\u00F6n.<br/>F\u00F6r att gruppera vanliga upps\u00E4ttningar av kategorier, se funktionen "Moderkategori" nedan.
HELP_BUDGET_CATEGORY_PARENT=En \u00F6verordnad kategori kan anv\u00E4ndas f\u00F6r att gruppera relaterade budgetkategorier.  Anta till exempel att det finns en kategori som heter "Bilkostnader".  Andra kategorier kan sedan l\u00E4ggas till: "Br\u00E4nsle", "Bilf\u00F6rs\u00E4kring" och "Underh\u00E5ll & Reparationer", alla med moderkategorin "Bilkostnader".  N\u00E4r de \u00E4r klara skulle dessa tre kategorier visas under den \u00F6verordnade kategorin "Bilkostnader".
HELP_BUDGET_CATEGORY_PERIOD_TYPE=Budgetperioden som ska tilldelas till budgetkategorin.  En "budgetperiod" \u00E4r ett \u00E5terkommande intervall av datum f\u00F6r vilka du tilldelar ett belopp i din budget; till exempel b\u00F6r en budgetkategori f\u00F6r att sp\u00E5ra m\u00E5natliga fastighetsskatter tilldelas periodtypen "M\u00E5nad".
HELP_BUDGET_CATEGORY_TYPE=Ange detta v\u00E4rde beroende p\u00E5 om budgetkategorin representerar inkomst- eller kostnadstransaktioner.  Exempel p\u00E5 inkomstkategorier kan vara "L\u00F6n", "Bonus", "Mottagna g\u00E5vor" etc. Exempel p\u00E5 utgiftskategorier kan vara "Matvaror", "Bilreparationer", "Hyra" osv.
HELP_CLEAR_TRANSACTION=Rensar alla f\u00E4lt i transaktionsredigeraren och avmarkerar alla valda transaktioner (om till\u00E4mpligt).
HELP_CURRENCY=Valutan som anv\u00E4nds f\u00F6r alla transaktioner.  Detta kommer att visas enligt den angivna lokalen.
HELP_DATE_FORMAT=Detta kan \u00E5sidos\u00E4tta standarddatumformatet f\u00F6r den valda lokalen.  L\u00E4mna det h\u00E4r v\u00E4rdet som "Use Locale Defaults" f\u00F6r att anv\u00E4nda datumformatet f\u00F6r den angivna lokalen.
HELP_SHOW_DELETED=Visa borttagna konton och budgetkategorier i listor och valjare.
HELP_DELETE_DATA=Om detta v\u00E4ljs kommer all befintlig data att raderas f\u00F6re \u00E5terst\u00E4llningen.  Det finns inget s\u00E4tt att \u00E5ngra den h\u00E4r \u00E5tg\u00E4rden.  Observera att \u00E5terst\u00E4llning \u00F6ver befintliga data inte kommer att duplicera allt - \u00E5terst\u00E4llningsproceduren l\u00E4gger bara till det som \u00E4r nytt i s\u00E4kerhetskopian.
HELP_DELETE_TRANSACTION=Tar bort den f\u00F6r n\u00E4rvarande valda transaktionen
HELP_ENCRYPT_DATA_PASSWORD=Ange ditt aktuella inloggningslosenord for att andra krypteringsinstallningar.
HELP_ENCRYPT_DATA=Detta val styr om dina kontodata ar krypterade. Om aktiverat krypterar Buddi Live kansliga falt som konto- och budgetnamn samt transaktionsbeskrivningar. Om du aktiverar kryptering ar losenordsaterstallning inte tillganglig och forlorade losenord kan inte aterhamtas. Se Buddi Lives krypteringssida for mer information.
HELP_END_DATE=Anv\u00E4nds med intervallv\u00E4ljaren '\u00D6vrigt'.  Slutdatumet f\u00F6r rapportintervallet.
HELP_GETTING_STARTED_TITLE=Komma ig\u00E5ng
HELP_GETTING_STARTED=<b>V\u00E4lkommen till Buddi Live!</b><br/><br/>Om du \u00E4r en befintlig Buddi-skrivbordsanv\u00E4ndare kan du exportera dina transaktioner genom att klicka p\u00E5 Arkiv \u2192 Exportera \u2192 Exportera Buddi Live-data.  Du kan importera detta till Buddi Live genom att klicka p\u00E5 System \u2192 \u00C5terst\u00E4ll och v\u00E4lja .json-filen som skapades i exporten.<br/><br/>Om du \u00E4r ny p\u00E5 Buddi-programvaran kan du <a href='doc/tutorial.html' target='_blank'>visa handledningen</a> f\u00F6r att f\u00E5 hj\u00E4lp med att komma ig\u00E5ng.<br/><br/>Klicka p\u00E5 lokal kryptering och \u2192 f\u00F6r att \u00E4ndra systemformat, eller f\u00F6r att aktivera detaljerad information. Inst\u00E4llningar.<br/><br/>Det h\u00E4r meddelandet kommer att visas vid start varje g\u00E5ng tills du har lagt till minst ett konto.  Du kan se den igen genom att klicka p\u00E5 System \u2192 Komma ig\u00E5ng.
HELP_INTERVAL_PICKER=Datumintervallet som ska anv\u00E4ndas f\u00F6r denna rapport.  V\u00E4lj ett f\u00F6rdefinierat intervall eller ange ett anpassat start-/slutdatum.
HELP_LOCALE=Spr\u00E5ket/landet som anv\u00E4nds f\u00F6r lokaliseringar.  Lokaliseringar inkluderar spr\u00E5k, formateringen av valutasymbolen, standardformatering av datum och nummer, etc.
HELP_RECORD_UPDATE_TRANSACTION=Spela in (eller uppdatera) den f\u00F6r n\u00E4rvarande valda transaktionen.  Tryck p\u00E5 Ctrl + Enter n\u00E4r du redigerar transaktionen som en genv\u00E4g.
HELP_REGISTER_2=Kontrollera din e-post f\u00F6r en aktiveringsnyckel.  N\u00E4r det kommer, kopiera det h\u00E4r, v\u00E4lj ett l\u00F6senord och klicka p\u00E5 "Skapa konto".<br/><br/>N\u00E4r du har skapat kontot kan du logga in med din e-postadress och ditt l\u00F6senord.
HELP_REGISTER=Ange en giltig e-postadress och klicka p\u00E5 "Generera nyckel".
HELP_REPEATING_BIWEEKLY=St\u00E4ll in denna transaktion s\u00E5 att den upprepas varannan vecka p\u00E5 den angivna veckodagen.
HELP_REPEATING_EVERY_X_DAYS=St\u00E4ll in denna transaktion s\u00E5 att den upprepas efter det angivna antalet dagar.  Detta v\u00E4rde m\u00E5ste vara mer \u00E4n 0.
HELP_REPEATING_MONTHLY_BY_DAY_OF_WEEK=St\u00E4ll in denna transaktion s\u00E5 att den upprepas varje m\u00E5nad p\u00E5 den angivna veckodagen.
HELP_REPEATING_MONTHLY=St\u00E4ll in denna transaktion s\u00E5 att den upprepas varje m\u00E5nad p\u00E5 den angivna dagen i m\u00E5naden.  T\u00E4nk p\u00E5 att bara vissa m\u00E5nader har 31 dagar; anv\u00E4nd "Sista dagen" f\u00F6r att justera automatiskt f\u00F6r kortare m\u00E5nader.
HELP_REPEATING_MULTIPLE_MONTHS_EVERY_YEAR=St\u00E4ll in denna transaktion s\u00E5 att den upprepas p\u00E5 den angivna dagen i m\u00E5naden, p\u00E5 de angivna m\u00E5naderna p\u00E5 \u00E5ret.
HELP_REPEATING_MULTIPLE_WEEKS_EVERY_MONTH=St\u00E4ll in den h\u00E4r transaktionen s\u00E5 att den upprepas p\u00E5 den angivna veckodagen, p\u00E5 de angivna veckorna i m\u00E5naden.
HELP_REPEATING_WEEKLY=St\u00E4ll in denna transaktion s\u00E5 att den upprepas varje vecka p\u00E5 den angivna veckodagen.
HELP_RESET_PASSWORD_2=N\u00E4r aktiveringsnyckeln kommer till din e-post, kopiera den h\u00E4r och v\u00E4lj ett nytt l\u00F6senord.<br/><br/>Om ditt konto \u00E4r krypterat finns det inget s\u00E4tt att \u00E5terst\u00E4lla ditt l\u00F6senord, och du kommer inte att f\u00E5 aktiveringsnyckeln.
HELP_RESET_PASSWORD=Ange din e-postadress f\u00F6r inloggning f\u00F6r att f\u00E5 en tillf\u00E4llig nyckel f\u00F6r att \u00E5terst\u00E4lla ditt l\u00F6senord.<br/><br/>Du kan bara \u00E5terst\u00E4lla ditt l\u00F6senord om du inte har aktiverat kryptering.  Om ditt konto \u00E4r krypterat finns det inget s\u00E4tt att \u00E5terst\u00E4lla ditt l\u00F6senord, och du kommer inte att f\u00E5 aktiveringsnyckeln.
HELP_RESTORE_FILE=Ladda upp en fil som tidigare sparats av Buddi Live, eller en fil som exporterats till Buddi Live fr\u00E5n skrivbordsversionen av Buddi.  Den h\u00E4r filen har vanligtvis filtill\u00E4gget .json, och om den genereras fr\u00E5n Buddi Live kommer den att kallas 'backup.json'.
HELP_SCHEDULED_TRANSACTION_END_DATE=Dagen d\u00E5 denna schemalagda transaktion ska sluta.  L\u00E4mna detta tomt f\u00F6r att aldrig schemal\u00E4gga ett stoppdatum (detta kan \u00E4ndras senare om s\u00E5 \u00F6nskas).
HELP_SCHEDULED_TRANSACTION_MESSAGE=Ett meddelande som visar n\u00E4r den schemalagda transaktionen har utl\u00F6sts.  Meddelandet visas vid inloggning.  L\u00E4mna detta tomt f\u00F6r att inte visa n\u00E5got.
HELP_SCHEDULED_TRANSACTION_NAME=Namnet p\u00E5 den schemalagda transaktionen.  Detta b\u00F6r vara tillr\u00E4ckligt beskrivande f\u00F6r att identifiera vad den schemalagda transaktionen g\u00F6r.  N\u00E5gra exempel kan vara "M\u00E5natlig \u00F6verf\u00F6ring till sparande", "Personlig ers\u00E4ttning" etc.
HELP_SCHEDULED_TRANSACTION_REPEAT=V\u00E4lj en frekvens f\u00F6r att upprepa denna schemalagda transaktion.  Beroende p\u00E5 vilket schema som valts kan det finnas olika alternativ som visas nedan.
HELP_SCHEDULED_TRANSACTION_START_DATE=Dagen d\u00E5 denna planerade transaktion ska b\u00F6rja.
HELP_SCHEDULED_TRANSACTION_TRANSACTION=Transaktionen som automatiskt l\u00E4ggs till enligt det angivna schemat.  Ange \u00E5tminstone beskrivning, m\u00E4ngd och fr\u00E5n/till k\u00E4llor.
HELP_START_DATE=Anv\u00E4nds med intervallv\u00E4ljaren '\u00D6vrigt'.  Startdatumet f\u00F6r rapportintervallet.
HELP_STORE_EMAIL=Detta val styr om Buddi Live sparar din inloggnings-e-post i aterhamtningsbar form for systemmejl. Lamna avstangt for maximal integritet.
HELP_TIMEZONE=Den lokala tidszonen.  Detta anv\u00E4nds f\u00F6r att k\u00F6ra schemalagda transaktioner vid midnatt, lokal tid.  Om en given tidszon ska st\u00F6dja sommartid, v\u00E4lj "Sommartid" i st\u00E4llet f\u00F6r "Standard" (t.ex. "Mountain Daylight Time" \u00E4ndrar automatiskt sommartid, medan "Mountain Standard Time" inte \u00E4ndras f\u00F6r sommartid).
HELP_USE_TWO_FACTOR=Anvand tvafaktorsautentisering. Efter installation med en autentiseringsapp maste du ange en 6-siffrig kod nar du loggar in.
