CONFIRM_CHANGE_EXISTING_TRANSACTION=Du \u00E4ndrar k\u00E4rnattribut f\u00F6r en befintlig transaktion.  \u00C4r du s\u00E4ker p\u00E5 att du vill g\u00F6ra det h\u00E4r?  Klicka p\u00E5 "Ja" f\u00F6r att forts\u00E4tta, eller klicka p\u00E5 "Nej" f\u00F6r att avbryta.<br/><br/>Om du ist\u00E4llet vill l\u00E4gga till en ny transaktion, klicka p\u00E5 knappen "Rensa" innan du l\u00E4gger till en ny transaktion.<br/>
CONFIRM_DATE_OUT_OF_RANGE_AFTER=Det angivna datumet ligger mer \u00E4n en m\u00E5nad fram\u00E5t i tiden.  \u00C4r du s\u00E4ker p\u00E5 att detta \u00E4r korrekt?  Klicka p\u00E5 "Ja" f\u00F6r att forts\u00E4tta med detta datum, eller klicka p\u00E5 "Nej" f\u00F6r att avbryta.
CONFIRM_DATE_OUT_OF_RANGE_BEFORE=Det angivna datumet \u00E4r mer \u00E4n ett \u00E5r sedan.  \u00C4r du s\u00E4ker p\u00E5 att detta \u00E4r korrekt?  Klicka p\u00E5 "Ja" f\u00F6r att forts\u00E4tta med detta datum, eller klicka p\u00E5 "Nej" f\u00F6r att avbryta.
CONFIRM_DATE_OUT_OF_RANGE_TITLE=Datum utanf\u00F6r intervallet
CONFIRM_DELETE_ACCOUNT=\u00C4r du s\u00E4ker p\u00E5 att du vill ta bort det h\u00E4r kontot?<br/>Om det finns n\u00E5gra transaktioner kopplade till det kommer kontot bara att markeras som borttaget (och kan \u00E5terst\u00E4llas vid ett senare tillf\u00E4lle om s\u00E5 \u00F6nskas).<br/>Om det inte finns n\u00E5gra transaktioner kommer kontot att raderas permanent.
CONFIRM_DELETE_CATEGORY=\u00C4r du s\u00E4ker p\u00E5 att du vill ta bort den h\u00E4r budgetkategorin?<br/>Om det finns n\u00E5gra transaktioner kopplade till den kommer kategorin bara att markeras som borttagen (och kan \u00E5terst\u00E4llas vid ett senare tillf\u00E4lle om s\u00E5 \u00F6nskas).<br/>Om det inte finns n\u00E5gra transaktioner kommer kategorin att tas bort permanent.
CONFIRM_DELETE_DATA=Kryssrutan "Radera data" \u00E4r markerad, och alla befintliga data kommer att raderas innan s\u00E4kerhetskopian \u00E5terst\u00E4lls.  Det finns inget s\u00E4tt att \u00E5ngra den h\u00E4r \u00E5tg\u00E4rden.  \u00C4r du s\u00E4ker p\u00E5 att du vill forts\u00E4tta?
CONFIRM_DELETE_SCHEDULED=\u00C4r du s\u00E4ker p\u00E5 att du vill ta bort den h\u00E4r schemalagda transaktionen?  N\u00E4r de har raderats kommer transaktioner inte l\u00E4ngre att skapas automatiskt.  Befintliga transaktioner som redan har lagts till kommer att finnas kvar.
CONFIRM_DELETE_TRANSACTION=\u00C4r du s\u00E4ker p\u00E5 att du vill ta bort den h\u00E4r transaktionen?  Det finns inget s\u00E4tt att \u00E5ngra den h\u00E4r \u00E5tg\u00E4rden.
CONFIRM_DELETE_USER=Genom att radera ditt anv\u00E4ndarkonto kommer du inte l\u00E4ngre att kunna logga in p\u00E5 Buddi Live, och all data som tidigare har angetts kommer att g\u00E5 f\u00F6rlorad permanent.<br/><br/>Det rekommenderas starkt att du laddar ner en s\u00E4kerhetskopia av dina data innan du tar bort ditt konto; detta l\u00E5ter dig \u00E5terst\u00E4lla data i h\u00E4ndelse av att du \u00F6ppnar ett nytt konto.<br/><br/>Vill du verkligen ta bort ditt Buddi Live-anv\u00E4ndarkonto?  Klicka p\u00E5 "Ja" f\u00F6r att ta bort kontot permanent, eller klicka p\u00E5 "Nej" f\u00F6r att avsluta.<br/>
CONFIRM_DELETE_USER2=\u00C4r du s\u00E4ker p\u00E5 att du vill ta bort ditt anv\u00E4ndarkonto och all data fr\u00E5n systemet?  Den h\u00E4r \u00E5tg\u00E4rden kan inte \u00E5ngras.<br/><br/>Klicka p\u00E5 "Ja" f\u00F6r att permanent radera ditt Buddi Live-anv\u00E4ndarkonto, eller klicka p\u00E5 "Nej" f\u00F6r att avbryta.<br/>
COOKIES_USED_MESSAGE=Buddi Live anv\u00E4nder cookies f\u00F6r att till\u00E5ta anv\u00E4ndare att logga in. S\u00E5ledes kr\u00E4vs cookies f\u00F6r att anv\u00E4nda denna webbplats.<br/><br/>Genom att klicka p\u00E5 Ja godk\u00E4nner du att denna webbplats kan spara cookies i din webbl\u00E4sare.<br/><br/>F\u00F6r mer information, se <a href='doc/termsandconditions.html'>Villkor och villkor</a>.
