REPORT_INFO_AVG_INCOME_EXPENSES_BODY=Visar den genomsnittliga m\u00E5natliga inkomsten och utgiftsbeloppet per kategori under den valda perioden.\n\nBer\u00E4kning: Samma summor som Inkomster och kostnader per kategori divideras med antalet m\u00E5nader i det valda intervallet f\u00F6r att producera ett genomsnitt per m\u00E5nad.\n\nAntaganden: Delm\u00E5nader i b\u00F6rjan eller slutet av intervallet r\u00E4knas som hela m\u00E5nader. Anv\u00E4ndbart f\u00F6r att identifiera ditt typiska m\u00E5natliga utgiftsm\u00F6nster.
REPORT_INFO_AVG_INCOME_EXPENSES_TITLE=Genomsnittliga inkomster och kostnader per kategori
REPORT_INFO_BALANCES_OVER_TIME_BODY=Ritar l\u00F6pande saldo f\u00F6r varje konto \u00F6ver den valda perioden som ett linjediagram.\n\nBer\u00E4kning: Servern spelar upp alla transaktioner i datumordning och samlar ett l\u00F6pande saldo f\u00F6r varje konto. En datapunkt s\u00E4nds ut per vecka (eller p\u00E5 betydande datum).\n\nAntaganden: Saldon visas som lagrade \u2014 debetkonton (checkning, besparingar) \u00E4r positiva; kreditkonton (kreditkort, l\u00E5n) kan vara negativa. Startsaldot f\u00F6r varje konto ing\u00E5r.
REPORT_INFO_BALANCES_OVER_TIME_TITLE=Kontosaldon \u00F6ver tid
REPORT_INFO_BUDGET_VS_ACTUAL_BODY=J\u00E4mf\u00F6r ditt budgeterade belopp med faktiska utgifter f\u00F6r varje utgiftskategori under den valda perioden.\n\nBer\u00E4kning: Budgetbeloppen kommer fr\u00E5n kategoribudgetposterna f\u00F6r perioden. Faktiska belopp \u00E4r summan av alla transaktionsdelningar som tilldelats varje kategori. B\u00E5da visas som staplar sida vid sida.\n\nAntaganden: Endast utgiftskategorier med en budgetpost eller faktiska transaktioner visas. Inkomstkategorier \u00E4r exkluderade. Om en kategori inte har n\u00E5gon budget inst\u00E4lld kommer dess budgeterade stapel att vara noll.
REPORT_INFO_BUDGET_VS_ACTUAL_TITLE=Budget kontra faktisk
REPORT_INFO_CATEGORY_DRILLDOWN_BODY=Visar utgiftstrend m\u00E5nad f\u00F6r m\u00E5nad f\u00F6r en enskild vald kategori \u00F6ver det valda intervallet.\n\nBer\u00E4kning: Alla transaktionsdelningar som tilldelats den valda kategorin (eller n\u00E5gon av dess underkategorier) summeras per kalenderm\u00E5nad och ritas som ett linjediagram.\n\nAntaganden: Underkategorier ing\u00E5r i summan. Endast den valda kategorin visas \u2014 anv\u00E4nd flera flikar f\u00F6r att j\u00E4mf\u00F6ra kategorier sida vid sida.
REPORT_INFO_CATEGORY_DRILLDOWN_TITLE=Kategori Drill-Down
REPORT_INFO_DEBT_PAYDOWN_BODY=Sp\u00E5rar saldot p\u00E5 dina kredit- och l\u00E5nekonton \u00F6ver tid f\u00F6r att visualisera framstegen i skuldminskningen.\n\nBer\u00E4kning: Alla transaktionsdelningar som involverar konton av kredittyp spelas om i datum f\u00F6r att skapa ett l\u00F6pande saldo f\u00F6r varje kreditkonto. En datapunkt s\u00E4nds ut per vecka.\n\nAntaganden: Endast konton av kredittyp (kreditkort, kreditlinjer, l\u00E5n) visas. Saldon visas som negativa tal - en linje som trendar mot noll betyder att skulden betalas ner. Debetkonton (checkning, sparande) \u00E4r undantagna.
REPORT_INFO_DEBT_PAYDOWN_TITLE=Skuldavbetalningssp\u00E5rare
REPORT_INFO_INCOME_EXPENSES_BODY=En detaljerad tabell som j\u00E4mf\u00F6r inkomst- och kostnadssummor f\u00F6r varje kategori under den valda perioden.\n\nBer\u00E4kning: Uppdelningar grupperas efter deras kategori. Inkomstkategorier visar totala infl\u00F6den; utgiftskategorier visar totala utfl\u00F6den. Rader kan ut\u00F6kas f\u00F6r att visa enskilda transaktioner.\n\nAntaganden: Endast den aktuella perioden visas. \u00D6verf\u00F6ringar mellan konton visas inte.
REPORT_INFO_INCOME_EXPENSES_TITLE=Inkomster och kostnader per kategori
REPORT_INFO_INFLOW_ACCOUNT_BODY=Visar totala pengar som fl\u00F6dar in och ut fr\u00E5n varje konto under den valda perioden.\n\nBer\u00E4kning: F\u00F6r varje konto summeras alla uppdelningar d\u00E4r det kontot \u00E4r destinationen som infl\u00F6de; alla uppdelningar d\u00E4r det \u00E4r k\u00E4llan summeras som utfl\u00F6de.\n\nAntaganden: \u00D6verf\u00F6ringar mellan dina egna konton visas b\u00E5de som ett infl\u00F6de till ett konto och ett utfl\u00F6de fr\u00E5n ett annat, s\u00E5 de avbryts p\u00E5 nettof\u00F6rm\u00F6genhetsniv\u00E5n.
REPORT_INFO_INFLOW_ACCOUNT_TITLE=Infl\u00F6de och utfl\u00F6de per konto
REPORT_INFO_INFLOW_PAYEE_BODY=Rangordnar betalningsmottagare (transaktionsbeskrivningar) efter deras totala in- och utfl\u00F6de under den valda perioden.\n\nBer\u00E4kning: Transaktioner grupperas efter beskrivning (betalningsmottagarens namn). Alla uppdelningar inom varje transaktion summeras som infl\u00F6de eller utfl\u00F6de beroende p\u00E5 tecken.\n\nAntaganden: Betalningsmottagarens matchning \u00E4r exakt \u2014 samma betalningsmottagare med n\u00E5got annorlunda stavning kommer att visas som separata poster. Krypterade namn dekrypteras endast f\u00F6r visning.
REPORT_INFO_INFLOW_PAYEE_TITLE=Infl\u00F6de och utfl\u00F6de av betalningsmottagare
REPORT_INFO_MONTHLY_CASH_FLOW_BODY=Visar totala int\u00E4kter, totala kostnader och nettokassafl\u00F6de (int\u00E4kter minus kostnader) f\u00F6r varje m\u00E5nad under den valda perioden.\n\nBer\u00E4kning: Uppdelningar grupperas efter kalenderm\u00E5nad. Inkomstdelning (fr\u00E5n en inkomsttyp) summeras som inkomst; utgiftsf\u00F6rdelningar (till en utgiftstyp) summeras som utgifter. Netto = Inkomst \u2212 Kostnader.\n\nAntaganden: \u00D6verf\u00F6ringar mellan konton \u00E4r exkluderade. En positiv nettostapel betyder att du spenderade mindre \u00E4n du tj\u00E4nade den m\u00E5naden; negativ betyder att du har spenderat f\u00F6r mycket.
REPORT_INFO_MONTHLY_CASH_FLOW_TITLE=M\u00E5natligt kassafl\u00F6de
REPORT_INFO_NET_WORTH_BODY=Ritar ditt totala nettov\u00E4rde (summan av alla kontosaldon) \u00F6ver den valda perioden som en enda rad.\n\nBer\u00E4kning: Samma som kontosaldon \u00F6ver tid, men alla kontosaldon summeras till ett enda nettov\u00E4rde vid varje veckodatapunkt.\n\nAntaganden: Alla konton ing\u00E5r \u2014 tillg\u00E5ngar (checkning, besparingar, investeringar) l\u00E4gg till nettof\u00F6rm\u00F6genhet. skulder (kreditkort, l\u00E5n) dras av. Konton utan transaktioner under perioden bidrar fortfarande med sitt saldo.
REPORT_INFO_NET_WORTH_TITLE=Nettov\u00E4rde \u00F6ver tid
REPORT_INFO_PIE_EXPENSES_BODY=Visar andelen av de totala utgifterna som tillskrivs varje utgiftskategori p\u00E5 toppniv\u00E5 under den valda perioden.\n\nBer\u00E4kning: Alla transaktionsdelningar d\u00E4r destinationen \u00E4r en utgiftskategori summeras. Varje kategoris totalsumma uttrycks som en procentandel av de totala utgifterna. Underkategorier rullas upp till sina \u00F6verordnade.\n\nAntaganden: \u00D6verf\u00F6ringar mellan konton \u00E4r exkluderade. Endast delningar med en destination av utgiftstyp r\u00E4knas.
REPORT_INFO_PIE_EXPENSES_TITLE=Utgifter per kategori (paj)
REPORT_INFO_PIE_INCOME_BODY=Visar andelen av den totala inkomsten bidragit med av varje inkomstkategori p\u00E5 h\u00F6gsta niv\u00E5 under den valda perioden.\n\nBer\u00E4kning: Alla transaktionsdelningar d\u00E4r k\u00E4llan \u00E4r en inkomstkategori summeras. Varje kategoris totalsumma uttrycks i procent av den totala inkomsten. Endast kategorier p\u00E5 toppniv\u00E5 visas; underkategorier rullas upp till sina \u00F6verordnade.\n\nAntaganden: \u00D6verf\u00F6ringar mellan konton \u00E4r exkluderade. Endast uppdelningar med en inkomstk\u00E4lla r\u00E4knas.
REPORT_INFO_PIE_INCOME_TITLE=Inkomst per kategori (paj)
REPORT_INFO_PROJECTED_BALANCE_BODY=Prognoser hur ditt kontosaldo kommer att f\u00F6r\u00E4ndras under de kommande N dagarna baserat p\u00E5 dina historiska utgiftsm\u00F6nster.\n\nBer\u00E4kning: De senaste 12 m\u00E5nadernas transaktioner analyseras f\u00F6r att ber\u00E4kna en genomsnittlig m\u00E5natlig nettof\u00F6r\u00E4ndring f\u00F6r varje konto. Med utg\u00E5ngspunkt fr\u00E5n dagens faktiska saldo till\u00E4mpas detta genomsnitt den 1:a i varje ber\u00E4knad m\u00E5nad. En veckovisa \u00F6gonblicksbild plottas f\u00F6r varje aktivt konto.\n\nAntaganden: Endast konton med en genomsnittlig m\u00E5nadsf\u00F6r\u00E4ndring st\u00F6rre \u00E4n $1 visas (statiska investeringskonton \u00E4r dolda). Prognosen f\u00F6ruts\u00E4tter att framtiden kommer att se ut som det senaste 12-m\u00E5nadersgenomsnittet - den tar inte h\u00E4nsyn till stora eng\u00E5ngstransaktioner, s\u00E4songsvariationer eller f\u00F6r\u00E4ndringar i utgiftsvanor.
REPORT_INFO_PROJECTED_BALANCE_TITLE=Ber\u00E4knad balans
REPORT_INFO_SAVINGS_RATE_BODY=Visar vilken procentandel av din inkomst du sparat varje m\u00E5nad under den valda perioden.\n\nBer\u00E4kning: Sparr\u00E4nta % = (Inkomst \u2212 Kostnader) / Inkomst \u00D7 100, ber\u00E4knat per kalenderm\u00E5nad. Plottet som ett linjediagram.\n\nAntaganden: M\u00E5nader med noll inkomst hoppas \u00F6ver f\u00F6r att undvika division med noll. En kurs \u00F6ver 0 % betyder att du sparat pengar; under 0 % betyder att du spenderade mer \u00E4n du tj\u00E4nade. \u00D6verf\u00F6ringar mellan konton \u00E4r undantagna.
REPORT_INFO_SAVINGS_RATE_TITLE=Besparingsgrad
REPORT_INFO_TOP_PAYEES_BODY=Rangordnar dina b\u00E4sta betalningsmottagare (transaktionsbeskrivningar) efter totala utgifter under den valda perioden, visat som ett horisontellt stapeldiagram.\n\nBer\u00E4kning: Alla utgiftsf\u00F6rdelningar \u00E4r grupperade efter transaktionsbeskrivning (betalningsmottagare). Summorna sorteras fallande. Varje stapel visar ocks\u00E5 betalningsmottagarens procentandel av totala utgifter f\u00F6r perioden.\n\nAntaganden: Endast utfl\u00F6den till kategorier av utgiftstyp r\u00E4knas \u2013 inkomster och \u00F6verf\u00F6ringar \u00E4r exkluderade. Betalningsmottagarens namn m\u00E5ste matcha exakt; sm\u00E5 stavningsskillnader skapar separata poster.
REPORT_INFO_TOP_PAYEES_TITLE=B\u00E4sta betalningsmottagare efter utgifter
REPORT_INFO_YEAR_OVER_YEAR_BODY=J\u00E4mf\u00F6r utgifter och inkomst efter kategori mellan tv\u00E5 p\u00E5 varandra f\u00F6ljande perioder av samma l\u00E4ngd (t.ex. i \u00E5r j\u00E4mf\u00F6rt med f\u00F6rra \u00E5ret).\n\nBer\u00E4kning: Det valda intervallet definierar den "aktuella" perioden. Servern ber\u00E4knar automatiskt motsvarande f\u00F6reg\u00E5ende period av samma l\u00E4ngd. B\u00E5da periodernas kategorisummor visas som staplar sida vid sida.\n\nAntaganden: Den f\u00F6reg\u00E5ende perioden har alltid samma varaktighet som den valda perioden, f\u00F6rskjuten tillbaka med exakt en periodl\u00E4ngd. Kategorier utan aktivitet under n\u00E5gon av perioderna exkluderas.
REPORT_INFO_YEAR_OVER_YEAR_TITLE=J\u00E4mf\u00F6relse av perioder sida vid sida
