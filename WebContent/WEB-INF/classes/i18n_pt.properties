CONFIRM_CHANGE_EXISTING_TRANSACTION_TITLE=Alterar transação existente
CONFIRM_CHANGE_EXISTING_TRANSACTION=Você está alterando os principais atributos de uma transação existente.  Tem certeza de que deseja fazer isso?  Clique em 'Sim' para continuar ou clique em 'Não' para cancelar.<br/><br/>Se você quiser adicionar uma nova transação, clique no botão 'Limpar' antes de adicionar uma nova transação.<br/>
CONFIRM_DATE_OUT_OF_RANGE_AFTER=A data especificada é mais de um mês no futuro.  Tem certeza de que isso está correto?  Clique em 'Sim' para continuar com esta data ou clique em 'Não' para cancelar.
CONFIRM_DATE_OUT_OF_RANGE_BEFORE=A data especificada é há mais de um ano.  Tem certeza de que isso está correto?  Clique em 'Sim' para continuar com esta data ou clique em 'Não' para cancelar.
CONFIRM_DATE_OUT_OF_RANGE_TITLE=Data fora do intervalo
CONFIRM_DELETE_ACCOUNT=Tem certeza de que deseja excluir esta conta?<br/>Se houver alguma transação associada a ela, a conta será marcada apenas como excluída (e poderá ser cancelada posteriormente, se desejar).<br/>Se não houver transações, a conta será excluída permanentemente.
CONFIRM_DELETE_CATEGORY=Tem certeza de que deseja excluir esta categoria de orçamento?<br/>Se houver alguma transação associada a ela, a categoria só será marcada como excluída (e poderá ser cancelada posteriormente, se desejar).<br/>Se não houver transações, a categoria será excluída permanentemente.
CONFIRM_DELETE_DATA=A caixa de seleção "Excluir dados" está marcada e todos os dados existentes serão excluídos antes da restauração do backup.  Não há como desfazer esta ação.  Tem certeza de que deseja prosseguir?
CONFIRM_DELETE_SCHEDULED=Tem certeza de que deseja excluir esta transação agendada?  Depois de excluídas, as transações não serão mais criadas automaticamente.  As transações existentes que já foram adicionadas permanecerão.
CONFIRM_DELETE_TRANSACTION=Tem certeza de que deseja excluir esta transação?  Não há como desfazer esta ação.
CONFIRM_DELETE_USER=Ao excluir sua conta de usuário, você não poderá mais entrar no Buddi Live e todos os dados inseridos anteriormente serão perdidos permanentemente.<br/><br/>É altamente recomendável que você baixe um backup de seus dados antes de excluir sua conta; isso permitirá que você restaure os dados caso abra uma nova conta.<br/><br/>Você realmente deseja excluir sua conta de usuário Buddi Live?  Clique em 'Sim' para excluir permanentemente a conta ou clique em 'Não' para cancelar.<br/>
CONFIRM_DELETE_USER2=Tem certeza de que deseja excluir sua conta de usuário e todos os dados do sistema?  Esta ação não pode ser desfeita.<br/><br/>Clique em 'Sim' para excluir permanentemente sua conta de usuário Buddi Live ou clique em 'Não' para cancelar.<br/>
COOKIES_USED_MESSAGE=Buddi Live usa cookies para permitir que os usuários façam login. Portanto, os cookies são necessários para usar este site.<br/><br/>Ao clicar em Sim, você concorda que este site pode salvar cookies em seu navegador.<br/><br/>Para obter mais informações, consulte os <a href='doc/termsandconditions.html'>Termos e Condições</a>.
