REPORT_INFO_AVG_INCOME_EXPENSES_BODY=Mostra o valor médio mensal de receitas e despesas por categoria durante o período selecionado.\n\nCálculo: os mesmos totais de Receitas e despesas por categoria são divididos pelo número de meses no intervalo selecionado para produzir uma média por mês.\n\nPressuposições: meses parciais no início ou no final do intervalo são contados como meses completos. Útil para identificar seu padrão típico de gastos mensais.
REPORT_INFO_AVG_INCOME_EXPENSES_TITLE=Receitas e despesas médias por categoria
REPORT_INFO_BALANCES_OVER_TIME_BODY=Representa o saldo corrente de cada conta durante o período selecionado como um gráfico de linhas.\n\nCálculo: O servidor reproduz todas as transações em ordem de data, acumulando um saldo corrente para cada conta. Um ponto de dados é emitido por semana (ou em datas significativas).\n\nPressuposições: Os saldos são apresentados como armazenados — contas de débito (correntes, poupanças) são positivas; contas de crédito (cartões de crédito, empréstimos) podem estar negativas. O saldo inicial de cada conta está incluído.
REPORT_INFO_BALANCES_OVER_TIME_TITLE=Saldos de contas ao longo do tempo
REPORT_INFO_BUDGET_VS_ACTUAL_BODY=Compara o valor orçado com os gastos reais de cada categoria de despesas durante o período selecionado.\n\nCálculo: os valores do orçamento vêm das entradas de orçamento da categoria para o período. Os valores reais são a soma de todas as divisões de transação atribuídas a cada categoria. Ambos são mostrados como barras lado a lado.\n\nSuposições: somente categorias de despesas com entrada de orçamento ou transações reais são mostradas. As categorias de renda estão excluídas. Se uma categoria não tiver orçamento definido, sua barra orçada será zero.
REPORT_INFO_BUDGET_VS_ACTUAL_TITLE=Orçamento vs Real
REPORT_INFO_CATEGORY_DRILLDOWN_BODY=Mostra a tendência de gastos mês a mês para uma única categoria selecionada durante o intervalo escolhido.\n\nCálculo: todas as divisões de transação atribuídas à categoria selecionada (ou qualquer uma de suas subcategorias) são somadas por mês e plotadas como um gráfico de linhas.\n\nPressuposições: as subcategorias são incluídas no total. Apenas a categoria selecionada é mostrada — use várias guias para comparar as categorias lado a lado.
REPORT_INFO_CATEGORY_DRILLDOWN_TITLE=Detalhamento da categoria
REPORT_INFO_DEBT_PAYDOWN_BODY=Rastreia o saldo de suas contas de crédito e empréstimo ao longo do tempo para visualizar o progresso da redução da dívida.\n\nCálculo: todas as divisões de transações envolvendo contas do tipo crédito são repetidas em ordem de data para produzir um saldo corrente para cada conta de crédito. Um ponto de dados é emitido por semana.\n\nSuposições: somente contas do tipo crédito (cartões de crédito, linhas de crédito, empréstimos) são mostradas. Os saldos são mostrados como números negativos – uma linha tendendo para zero significa que a dívida está sendo paga. Excluem-se contas de débito (corrente, poupança).
REPORT_INFO_DEBT_PAYDOWN_TITLE=Rastreador de pagamento de dívidas
REPORT_INFO_INCOME_EXPENSES_BODY=Uma tabela detalhada comparando os totais de receitas e despesas de cada categoria no período selecionado.\n\nCálculo: as divisões são agrupadas por categoria. As categorias de rendimento mostram as entradas totais; as categorias de despesas mostram as saídas totais. As linhas podem ser expandidas para mostrar transações individuais.\n\nSuposições: somente o período atual é mostrado. As transferências entre contas não aparecem.
REPORT_INFO_INCOME_EXPENSES_TITLE=Receitas e despesas por categoria
REPORT_INFO_INFLOW_ACCOUNT_BODY=Mostra o total de dinheiro que entra e sai de cada conta durante o período selecionado.\n\nCálculo: para cada conta, todas as parcelas em que essa conta é o destino são somadas como entrada; todas as divisões onde ela é a origem são somadas como saída.\n\nPressuposições: As transferências entre suas próprias contas aparecem como uma entrada para uma conta e uma saída de outra, portanto, são canceladas no nível do patrimônio líquido.
REPORT_INFO_INFLOW_ACCOUNT_TITLE=Entrada e saída por conta
REPORT_INFO_INFLOW_PAYEE_BODY=Classifica os beneficiários (descrições das transações) pelo total de entrada e saída durante o período selecionado.\n\nCálculo: as transações são agrupadas por descrição (nome do beneficiário). Todas as divisões em cada transação são somadas como entrada ou saída, dependendo do sinal.\n\nSuposições: a correspondência do beneficiário é exata – o mesmo beneficiário com grafia ligeiramente diferente aparecerá como entradas separadas. Os nomes criptografados são descriptografados apenas para exibição.
REPORT_INFO_INFLOW_PAYEE_TITLE=Entrada e saída por beneficiário
REPORT_INFO_MONTHLY_CASH_FLOW_BODY=Mostra a receita total, o total de despesas e o fluxo de caixa líquido (receita menos despesas) para cada mês do período selecionado.\n\nCálculo: as divisões são agrupadas por mês civil. As divisões de rendimento (de uma categoria do tipo Rendimento) são somadas como rendimento; as divisões de despesas (para uma categoria do tipo Despesa) são somadas como despesas. Líquido = Receita − Despesas.\n\nPressuposições: As transferências entre contas estão excluídas. Uma barra líquida positiva significa que você gastou menos do que ganhou naquele mês; negativo significa que você gastou demais.
REPORT_INFO_MONTHLY_CASH_FLOW_TITLE=Fluxo de caixa mensal
REPORT_INFO_NET_WORTH_BODY=Representa seu patrimônio líquido total (soma de todos os saldos de contas) durante o período selecionado como uma única linha.\n\nCálculo: igual aos saldos de contas ao longo do tempo, mas todos os saldos de contas são somados em um único valor de patrimônio líquido em cada ponto de dados semanal.\n\nPressuposições: todas as contas estão incluídas — ativos (contas correntes, poupanças, investimentos) são adicionados ao patrimônio líquido; subtrair passivos (cartões de crédito, empréstimos). Contas sem movimentações no período ainda contribuem com seu saldo.
REPORT_INFO_NET_WORTH_TITLE=Patrimônio líquido ao longo do tempo
REPORT_INFO_PIE_EXPENSES_BODY=Mostra a proporção do gasto total atribuído a cada categoria de despesa de nível superior durante o período selecionado.\n\nCálculo: todas as divisões de transação cujo destino é uma categoria de despesa são somadas. O total de cada categoria é expresso como uma percentagem da despesa global. As subcategorias são acumuladas em suas principais.\n\nPressuposições: as transferências entre contas são excluídas. Somente parcelas com destino do tipo Despesa são contabilizadas.
REPORT_INFO_PIE_EXPENSES_TITLE=Despesas por categoria (torta)
REPORT_INFO_PIE_INCOME_BODY=Mostra a proporção da renda total contribuída por cada categoria de renda de nível superior durante o período selecionado.\n\nCálculo: todas as divisões de transação em que a fonte é uma categoria de renda são somadas. O total de cada categoria é expresso como uma percentagem do rendimento global. Somente categorias de nível superior são mostradas; as subcategorias são acumuladas em suas principais.\n\nSuposições: as transferências entre contas são excluídas. Apenas são contabilizadas as divisões com origem do tipo Renda.
REPORT_INFO_PIE_INCOME_TITLE=Renda por categoria (torta)
REPORT_INFO_PROJECTED_BALANCE_BODY=Prevê como os saldos de suas contas mudarão nos próximos N dias com base em seus padrões históricos de gastos.\n\nCálculo: os últimos 12 meses de transações são analisados ​​para calcular uma variação líquida média mensal para cada conta. A partir do saldo real de hoje, essa média é aplicada no primeiro dia de cada mês projetado. Um instantâneo semanal é traçado para cada conta ativa.\n\nSuposições: somente as contas com uma variação média mensal superior a US$ 1 são mostradas (as contas de investimento estáticas ficam ocultas). A projeção pressupõe que o futuro será semelhante à média dos últimos 12 meses — não tem em conta grandes transações pontuais, variações sazonais ou mudanças nos hábitos de consumo.
REPORT_INFO_PROJECTED_BALANCE_TITLE=Saldo projetado
REPORT_INFO_SAVINGS_RATE_BODY=Mostra qual porcentagem de sua renda você economizou a cada mês durante o período selecionado.\n\nCálculo: Taxa de poupança % = (Renda − Despesas) / Renda × 100, calculada por mês civil. Plotado como um gráfico de linhas.\n\nPremissas: meses com renda zero são ignorados para evitar a divisão por zero. Uma taxa acima de 0% significa que você economizou dinheiro; abaixo de 0% significa que você gastou mais do que ganhou. As transferências entre contas estão excluídas.
REPORT_INFO_SAVINGS_RATE_TITLE=Taxa de poupança
REPORT_INFO_TOP_PAYEES_BODY=Classifica os principais beneficiários (descrições das transações) pelo gasto total no período selecionado, mostrado como um gráfico de barras horizontais.\n\nCálculo: todas as divisões de despesas são agrupadas por descrição da transação (beneficiário). Os totais são classificados em ordem decrescente. Cada barra também mostra a porcentagem do gasto total do beneficiário no período.\n\nPressuposições: somente as saídas para categorias de tipo de despesa são contadas — receitas e transferências são excluídas. Os nomes dos beneficiários devem corresponder exatamente; pequenas diferenças ortográficas criam entradas separadas.
REPORT_INFO_TOP_PAYEES_TITLE=Principais beneficiários por gastos
REPORT_INFO_YEAR_OVER_YEAR_BODY=Compara gastos e receitas por categoria entre dois períodos consecutivos de mesma duração (por exemplo, este ano versus ano passado).\n\nCálculo: o intervalo selecionado define o período "atual". O servidor calcula automaticamente o período anterior equivalente com a mesma duração. Os totais das categorias de ambos os períodos são mostrados como barras lado a lado.\n\nPressuposições: o período anterior tem sempre a mesma duração que o período selecionado, deslocado exatamente uma duração de período. Excluem-se as categorias sem atividade em nenhum dos períodos.
REPORT_INFO_YEAR_OVER_YEAR_TITLE=Comparação de períodos lado a lado
