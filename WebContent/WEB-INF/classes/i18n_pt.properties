HELP_ACCOUNT_EDITOR_ACCOUNT_TYPE=A categorização de alto nível da conta.  Este é um rótulo de formato livre que permite agrupar contas semelhantes.  Os exemplos incluem "Cheque", "Poupança", "Cartões de Crédito", etc.
HELP_ACCOUNT_EDITOR_NAME=O nome da conta.  Este deve ser um nome descritivo que identifique exclusivamente a conta.  Exemplos de nomes de contas são “ABC Poupança”, “Visa Premium”, “Cash in Wallet”, etc.
HELP_ACCOUNT_EDITOR_STARTING_BALANCE=O saldo inicial é a quantia em dinheiro na conta quando ela é inserida pela primeira vez no Buddi.  Geralmente, esse valor não deve ser alterado após a configuração inicial.
HELP_ACCOUNT_EDITOR_TYPE=Se esta conta é uma conta de “Débito” ou “Crédito”.  As contas de débito são para contas que têm dinheiro: coisas como poupança, cheque, dinheiro na carteira, etc. As contas de crédito são para contas que devem dinheiro: coisas como cartões de crédito, empréstimos, etc.
HELP_BUDGET_CATEGORY_NAME=Este e o nome de um grupo de transacoes comuns. Por exemplo, uma categoria chamada "Supermercado" pode rastrear compras de alimentos; uma categoria chamada "Casa" pode rastrear despesas domesticas como moveis e pequenos reparos; e uma categoria chamada "Salario" pode rastrear renda de salario mensal.<br/>Para agrupar conjuntos de categorias, consulte a funcionalidade "Categoria Pai" abaixo.
HELP_BUDGET_CATEGORY_PARENT=Uma categoria pai pode ser usada para agrupar categorias de orçamento relacionadas.  Por exemplo, suponha que exista uma categoria chamada “Despesas com automóveis”.  Outras categorias poderiam então ser adicionadas: “Combustível”, “Seguro Automóvel” e “Manutenção e Reparos”, todas com a categoria pai “Despesas Automóvel”.  Depois de concluídas, essas três categorias seriam exibidas abaixo da categoria principal “Despesas com automóveis”.
HELP_BUDGET_CATEGORY_PERIOD_TYPE=O período orçamentário a ser atribuído à categoria de orçamento.  Um “período orçamentário” é um intervalo repetido de datas para o qual você atribui um valor em seu orçamento; por exemplo, uma categoria de orçamento para monitorar impostos mensais sobre a propriedade deve receber um tipo de período "Mês".
HELP_BUDGET_CATEGORY_TYPE=Especifique este valor dependendo se a categoria de orcamento representa transacoes de receita ou despesa. Exemplos de categorias de receita incluem "Salario", "Bonus", "Presentes recebidos" etc. Exemplos de categorias de despesa incluem "Supermercado", "Conserto de carro", "Aluguel" etc.
HELP_CLEAR_TRANSACTION=Limpa todos os campos do editor de transações e desmarca qualquer transação selecionada (se aplicável).
HELP_CURRENCY=A moeda usada para todas as transações.  Isso será exibido de acordo com o local especificado.
HELP_DATE_FORMAT=Isso pode substituir o formato de data padrão da localidade selecionada.  Deixe esse valor como "Usar padrões de localidade" para usar o formato de data para a localidade especificada.
HELP_SHOW_DELETED=Mostrar contas e categorias de orcamento excluidas em listas e seletores.
HELP_DELETE_DATA=Se esta opção for selecionada, todos os dados existentes serão excluídos antes da restauração.  Não há como desfazer esta ação.  Observe que a restauração dos dados existentes não duplicará tudo - o procedimento de restauração apenas adiciona o que há de novo no arquivo de backup.
HELP_DELETE_TRANSACTION=Exclui a transação atualmente selecionada
HELP_ENCRYPT_DATA_PASSWORD=Para alterar as configuracoes de criptografia, informe sua senha atual de login.
HELP_ENCRYPT_DATA=Esta opcao controla se os dados da sua conta sao criptografados. Se ativada, o Buddi Live criptografa campos sensiveis como nomes de contas e orcamentos e descricoes de transacoes. Se voce ativar a criptografia, a redefinicao de senha nao estara disponivel e senhas perdidas nao poderao ser recuperadas. Veja a pagina de criptografia do Buddi Live para detalhes.
HELP_END_DATE=Usado com o seletor de intervalo 'Outro'.  A data final do intervalo do relatório.
HELP_GETTING_STARTED_TITLE=Começando
HELP_GETTING_STARTED=<b>Bem-vindo ao Buddi Live!</b><br/><br/>Se voce ja usa o Buddi Desktop, pode exportar suas transacoes em Arquivo &rarr; Exportar &rarr; Exportar dados do Buddi Live. Voce pode importar no Buddi Live em Sistema &rarr; Restaurar, selecionando o arquivo .json criado na exportacao.<br/><br/>Se voce e novo no Buddi, pode <a href='doc/tutorial.html' target='_blank'>ver o tutorial</a> para comecar.<br/><br/>Para ativar criptografia, ou alterar idioma e formato, clique em Sistema &rarr; Preferencias.<br/><br/>Esta mensagem aparecera na inicializacao ate que voce adicione pelo menos uma conta. Voce pode ve-la novamente em Sistema &rarr; Primeiros passos.
HELP_INTERVAL_PICKER=O intervalo de datas a ser usado para este relatório.  Escolha um intervalo predefinido ou insira uma data de início/término personalizada.
HELP_LOCALE=O idioma/país usado para localizações.  As localizações incluem o idioma, a formatação do símbolo da moeda, a data padrão e a formatação do número, etc.
HELP_RECORD_UPDATE_TRANSACTION=Registre (ou atualize) a transação atualmente selecionada.  Pressione Ctrl + Enter ao editar a transação como um atalho.
HELP_REGISTER_2=Verifique seu e-mail para obter uma chave de ativação.  Assim que chegar, copie-o aqui, selecione uma senha e clique em "Criar conta".<br/><br/>Depois de criar a conta, você pode fazer login com seu endereço de e-mail e senha.
HELP_REGISTER=Insira um endereço de e-mail válido e clique em "Gerar chave".
HELP_REPEATING_BIWEEKLY=Defina esta transação para ser repetida a cada duas semanas no dia da semana especificado.
HELP_REPEATING_EVERY_X_DAYS=Defina esta transação para repetir após o número especificado de dias.  Este valor deve ser maior que 0.
HELP_REPEATING_MONTHLY_BY_DAY_OF_WEEK=Defina esta transação para ser repetida todos os meses no dia da semana especificado.
HELP_REPEATING_MONTHLY=Defina esta transação para repetir todos os meses no dia especificado do mês.  Lembre-se de que apenas alguns meses têm 31 dias; use "Último dia" para ajustar automaticamente para meses mais curtos.
HELP_REPEATING_MULTIPLE_MONTHS_EVERY_YEAR=Defina esta transação para repetir no dia especificado do mês, nos meses especificados do ano.
HELP_REPEATING_MULTIPLE_WEEKS_EVERY_MONTH=Defina esta transação para ser repetida no dia da semana especificado, nas semanas especificadas do mês.
HELP_REPEATING_WEEKLY=Defina esta transação para ser repetida todas as semanas no dia da semana especificado.
HELP_RESET_PASSWORD_2=Assim que a chave de ativação chegar em seu e-mail, copie-a aqui e escolha uma nova senha.<br/><br/>Se sua conta estiver criptografada, não há como recuperar sua senha e você não receberá a chave de ativação.
HELP_RESET_PASSWORD=Digite seu endereço de e-mail de login para receber uma chave temporária para redefinir sua senha.<br/><br/>Você só poderá redefinir sua senha se não tiver habilitado a criptografia.  Se sua conta estiver criptografada, não há como recuperar sua senha e você não receberá a chave de ativação.
HELP_RESTORE_FILE=Carregue um arquivo salvo anteriormente pelo Buddi Live ou um arquivo exportado para o Buddi Live a partir da versão desktop do Buddi.  Este arquivo geralmente tem uma extensão .json e, se gerado a partir do Buddi Live, será chamado de 'backup.json'.
HELP_SCHEDULED_TRANSACTION_END_DATE=O dia em que esta transação agendada deve terminar.  Deixe em branco para nunca agendar uma data de parada (isso pode ser alterado posteriormente, se desejado).
HELP_SCHEDULED_TRANSACTION_MESSAGE=Uma mensagem para mostrar quando a transação agendada foi acionada.  A mensagem aparece no login.  Deixe em branco para não mostrar nada.
HELP_SCHEDULED_TRANSACTION_NAME=O nome da transação agendada.  Isto deve ser descritivo o suficiente para identificar o que a transação agendada faz.  Alguns exemplos podem incluir “Transferência Mensal para Poupança”, “Subsídio Pessoal”, etc.
HELP_SCHEDULED_TRANSACTION_REPEAT=Escolha uma frequência para repetir esta transação agendada.  Dependendo da programação escolhida, pode haver diferentes opções mostradas abaixo.
HELP_SCHEDULED_TRANSACTION_START_DATE=O dia em que esta transação agendada deve começar.
HELP_SCHEDULED_TRANSACTION_TRANSACTION=A transação que será adicionada automaticamente na programação especificada.  No mínimo, especifique a descrição, o valor e as fontes de/para.
HELP_START_DATE=Usado com o seletor de intervalo 'Outro'.  A data de início do intervalo do relatório.
HELP_STORE_EMAIL=Esta opcao controla se o Buddi Live armazena seu email de login em formato recuperavel para emails do sistema. Deixe desativado para privacidade maxima.
HELP_TIMEZONE=O fuso horário local.  Isso é usado para executar transações agendadas à meia-noite, horário local.  Se um determinado fuso horário suportar o horário de verão, escolha a entrada "Luz do dia" em vez de "Padrão" (por exemplo, "Horário de verão das montanhas" mudará automaticamente para o horário de verão, enquanto "Horário padrão das montanhas" não mudará para o horário de verão).
HELP_USE_TWO_FACTOR=Use a autenticacao de dois fatores. Apos configurar um aplicativo autenticador, voce precisara informar um codigo de 6 digitos ao entrar.
