REPORT_INFO_AVG_INCOME_EXPENSES_BODY=Muestra el monto promedio de ingresos y gastos mensuales por categoría durante el período seleccionado.\n\nCálculo: los mismos totales que Ingresos y gastos por categoría se dividen por la cantidad de meses en el intervalo seleccionado para producir un promedio mensual.\n\nSupuestos: Los meses parciales al inicio o al final del intervalo se cuentan como meses completos. Útil para identificar su patrón de gasto mensual típico.
REPORT_INFO_AVG_INCOME_EXPENSES_TITLE=Ingresos y gastos promedio por categoría
REPORT_INFO_BALANCES_OVER_TIME_BODY=Traza el saldo corriente de cada cuenta durante el período seleccionado como un gráfico de líneas.\n\nCálculo: el servidor reproduce todas las transacciones en orden de fecha, acumulando un saldo corriente para cada cuenta. Se emite un punto de datos por semana (o en fechas significativas).\n\nSupuestos: los saldos se muestran como almacenados: las cuentas de débito (corrientes, ahorros) son positivas; Las cuentas de crédito (tarjetas de crédito, préstamos) pueden ser negativas. Se incluye el saldo inicial de cada cuenta.
REPORT_INFO_BALANCES_OVER_TIME_TITLE=Saldos de cuentas a lo largo del tiempo
REPORT_INFO_BUDGET_VS_ACTUAL_BODY=Compara el monto presupuestado con el gasto real para cada categoría de gastos durante el período seleccionado.\n\nCálculo: los montos del presupuesto provienen de las entradas del presupuesto de la categoría para el período. Los montos reales son la suma de todas las divisiones de transacciones asignadas a cada categoría. Ambos se muestran como barras una al lado de la otra.\n\nSupuestos: solo se muestran las categorías de gastos con una entrada presupuestaria o transacciones reales. Se excluyen las categorías de ingresos. Si una categoría no tiene un presupuesto establecido, su barra de presupuesto será cero.
REPORT_INFO_BUDGET_VS_ACTUAL_TITLE=Presupuesto versus real
REPORT_INFO_CATEGORY_DRILLDOWN_BODY=Muestra la tendencia de gasto mes a mes para una sola categoría seleccionada durante el intervalo elegido.\n\nCálculo: todas las divisiones de transacciones asignadas a la categoría seleccionada (o cualquiera de sus subcategorías) se suman por mes calendario y se trazan como un gráfico de líneas.\n\nSupuestos: las subcategorías se incluyen en el total. Solo se muestra la categoría seleccionada: utilice varias pestañas para comparar las categorías una al lado de la otra.
REPORT_INFO_CATEGORY_DRILLDOWN_TITLE=Desglose de categoría
REPORT_INFO_DEBT_PAYDOWN_BODY=Realiza un seguimiento del saldo de sus cuentas de crédito y préstamos a lo largo del tiempo para visualizar el progreso de la reducción de la deuda.\n\nCálculo: todas las divisiones de transacciones que involucran cuentas de tipo crédito se reproducen en orden de fecha para producir un saldo corriente para cada cuenta de crédito. Se emite un punto de datos por semana.\n\nSupuestos: solo se muestran cuentas de tipo crédito (tarjetas de crédito, líneas de crédito, préstamos). Los saldos se muestran como números negativos: una línea con tendencia a cero significa que la deuda se está pagando. Se excluyen las cuentas de débito (corrientes, ahorros).
REPORT_INFO_DEBT_PAYDOWN_TITLE=Rastreador de pago de deuda
REPORT_INFO_INCOME_EXPENSES_BODY=Una tabla detallada que compara los totales de ingresos y gastos para cada categoría durante el período seleccionado.\n\nCálculo: las divisiones se agrupan por categoría. Las categorías de ingresos muestran las entradas totales; Las categorías de gastos muestran las salidas totales. Las filas se pueden expandir para mostrar transacciones individuales.\n\nSupuestos: solo se muestra el período actual. No aparecen transferencias entre cuentas.
REPORT_INFO_INCOME_EXPENSES_TITLE=Ingresos y gastos por categoría
REPORT_INFO_INFLOW_ACCOUNT_BODY=Muestra el dinero total que entra y sale de cada cuenta durante el período seleccionado.\n\nCálculo: para cada cuenta, todas las divisiones donde esa cuenta es el destino se suman como entradas; todas las divisiones donde es la fuente se suman como salida.\n\nSupuestos: Las transferencias entre sus propias cuentas aparecen como una entrada a una cuenta y una salida de otra, por lo que se cancelan en el nivel del patrimonio neto.
REPORT_INFO_INFLOW_ACCOUNT_TITLE=Entradas y salidas por cuenta
REPORT_INFO_INFLOW_PAYEE_BODY=Clasifica a los beneficiarios (descripciones de transacciones) según su entrada y salida total durante el período seleccionado.\n\nCálculo: las transacciones se agrupan por descripción (nombre del beneficiario). Todas las divisiones dentro de cada transacción se suman como entradas o salidas según el signo.\n\nSupuestos: la coincidencia del beneficiario es exacta: el mismo beneficiario con una ortografía ligeramente diferente aparecerá como entradas separadas. Los nombres cifrados se descifran únicamente para su visualización.
REPORT_INFO_INFLOW_PAYEE_TITLE=Entradas y salidas por beneficiario
REPORT_INFO_MONTHLY_CASH_FLOW_BODY=Muestra los ingresos totales, los gastos totales y el flujo de caja neto (ingresos menos gastos) para cada mes en el período seleccionado.\n\nCálculo: las divisiones se agrupan por mes calendario. Las divisiones de ingresos (de una categoría de tipo de ingreso) se suman como ingresos; las divisiones de gastos (a una categoría de tipo de gasto) se suman como gastos. Neto = Ingresos − Gastos.\n\nSupuestos: Se excluyen las transferencias entre cuentas. Una barra neta positiva significa que gastó menos de lo que ganó ese mes; negativo significa que gastó de más.
REPORT_INFO_MONTHLY_CASH_FLOW_TITLE=Flujo de caja mensual
REPORT_INFO_NET_WORTH_BODY=Traza su patrimonio neto total (suma de todos los saldos de las cuentas) durante el período seleccionado como una sola línea.\n\nCálculo: igual que los saldos de las cuentas a lo largo del tiempo, pero todos los saldos de las cuentas se suman en un único valor del patrimonio neto en cada punto de datos semanal.\n\nSupuestos: se incluyen todas las cuentas: los activos (cuentas corrientes, ahorros, inversiones) se suman al patrimonio neto; se restan los pasivos (tarjetas de crédito, préstamos). Las cuentas sin transacciones en el período aún aportan su saldo.
REPORT_INFO_NET_WORTH_TITLE=Valor neto a lo largo del tiempo
REPORT_INFO_PIE_EXPENSES_BODY=Muestra la proporción del gasto total atribuido a cada categoría de gastos de nivel superior durante el período seleccionado.\n\nCálculo: se suman todas las divisiones de transacciones donde el destino es una categoría de gastos. El total de cada categoría se expresa como porcentaje del gasto total. Las subcategorías se agrupan en sus principales.\n\nSupuestos: se excluyen las transferencias entre cuentas. Sólo se cuentan las divisiones con un destino de tipo Gasto.
REPORT_INFO_PIE_EXPENSES_TITLE=Gastos por categoría (pastel)
REPORT_INFO_PIE_INCOME_BODY=Muestra la proporción del ingreso total aportado por cada categoría de ingreso de nivel superior durante el período seleccionado.\n\nCálculo: se suman todas las divisiones de transacciones donde la fuente es una categoría de ingreso. El total de cada categoría se expresa como un porcentaje del ingreso total. Sólo se muestran las categorías de nivel superior; las subcategorías se agrupan en sus principales.\n\nSupuestos: se excluyen las transferencias entre cuentas. Sólo se contabilizan los fraccionamientos con fuente tipo Ingreso.
REPORT_INFO_PIE_INCOME_TITLE=Ingresos por categoría (pastel)
REPORT_INFO_PROJECTED_BALANCE_BODY=Pronostica cómo cambiarán los saldos de sus cuentas durante los próximos N días según sus patrones de gasto históricos.\n\nCálculo: las transacciones de los últimos 12 meses se analizan para calcular un cambio neto mensual promedio para cada cuenta. A partir del saldo real de hoy, ese promedio se aplica el día 1 de cada mes proyectado. Se traza una instantánea semanal para cada cuenta activa.\n\nSupuestos: solo se muestran las cuentas con un cambio mensual promedio superior a $1 (las cuentas de inversión estáticas están ocultas). La proyección supone que el futuro será similar al promedio de los últimos 12 meses: no tiene en cuenta grandes transacciones únicas, variaciones estacionales ni cambios en los hábitos de gasto.
REPORT_INFO_PROJECTED_BALANCE_TITLE=Saldo proyectado
REPORT_INFO_SAVINGS_RATE_BODY=Muestra qué porcentaje de sus ingresos ahorró cada mes durante el período seleccionado.\n\nCálculo: Tasa de ahorro % = (Ingresos − Gastos) / Ingresos × 100, calculado por mes calendario. Trazado como un gráfico de líneas.\n\nSupuestos: los meses con ingresos cero se omiten para evitar la división por cero. Una tasa superior al 0% significa que ahorró dinero; por debajo del 0% significa que gastó más de lo que ganó. Se excluyen las transferencias entre cuentas.
REPORT_INFO_SAVINGS_RATE_TITLE=Tasa de Ahorro
REPORT_INFO_TOP_PAYEES_BODY=Clasifica a sus principales beneficiarios (descripciones de transacciones) según el gasto total durante el período seleccionado, que se muestra como un gráfico de barras horizontales.\n\nCálculo: todas las divisiones de gastos se agrupan por descripción de la transacción (beneficiario). Los totales están ordenados de forma descendente. Cada barra también muestra el porcentaje del gasto total del beneficiario durante el período.\n\nSupuestos: solo se cuentan las salidas a categorías de tipo de gastos; se excluyen los ingresos y las transferencias. Los nombres de los beneficiarios deben coincidir exactamente; ligeras diferencias ortográficas crean entradas separadas.
REPORT_INFO_TOP_PAYEES_TITLE=Principales beneficiarios por gasto
REPORT_INFO_YEAR_OVER_YEAR_BODY=Compara gastos e ingresos por categoría entre dos períodos consecutivos de la misma duración (por ejemplo, este año frente al año pasado).\n\nCálculo: el intervalo seleccionado define el período "actual". El servidor calcula automáticamente el período anterior equivalente de la misma duración. Los totales de las categorías de ambos períodos se muestran como barras una al lado de la otra.\n\nSupuestos: el período anterior siempre tiene la misma duración que el período seleccionado, retrocedido exactamente un período. Se excluyen las categorías sin actividad en ninguno de los dos períodos.
REPORT_INFO_YEAR_OVER_YEAR_TITLE=Comparación de períodos lado a lado
