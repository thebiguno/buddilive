HELP_ACCOUNT_EDITOR_ACCOUNT_TYPE=La categorización de alto nivel de la cuenta.  Esta es una etiqueta de forma libre que permite agrupar cuentas similares.  Los ejemplos incluyen "Cheques", "Ahorros", "Tarjetas de crédito", etc.
HELP_ACCOUNT_EDITOR_NAME=El nombre de la cuenta.  Debe ser un nombre descriptivo que identifique de forma única la cuenta.  Ejemplos de nombres de cuentas son "ABC Savings", "Visa Premium", "Cash in Wallet", etc.
HELP_ACCOUNT_EDITOR_STARTING_BALANCE=El saldo inicial es la cantidad de dinero que hay en la cuenta cuando se ingresa por primera vez en Buddi.  Por lo general, esta cantidad no debe cambiarse después de la configuración inicial.
HELP_ACCOUNT_EDITOR_TYPE=Si esta cuenta es una cuenta de "débito" o de "crédito".  Las cuentas de débito son para cuentas que tienen dinero: cosas como ahorros, cuentas corrientes, efectivo en billetera, etc. Las cuentas de crédito son para cuentas que deben dinero: cosas como tarjetas de crédito, préstamos, etc.
HELP_BUDGET_CATEGORY_NAME=Este es el nombre de un grupo de transacciones comunes.  Por ejemplo, una categoría denominada "Comestibles" podría realizar un seguimiento de las compras de alimentos; una categoría denominada "Hogar" para realizar un seguimiento de diversos gastos del hogar, como muebles y reparaciones sencillas del hogar; y una categoría denominada "Salario" podría realizar un seguimiento de los ingresos de un salario mensual.<br/>Para agrupar conjuntos comunes de categorías, consulte la funcionalidad "Categoría principal" a continuación.
HELP_BUDGET_CATEGORY_PARENT=Se puede utilizar una categoría principal para agrupar categorías presupuestarias relacionadas.  Por ejemplo, supongamos que hay una categoría denominada "Gastos de automóvil".  Luego se podrían agregar otras categorías: "Combustible", "Seguro de automóvil" y "Mantenimiento y reparaciones", todas con la categoría principal de "Gastos de automóvil".  Una vez completadas, estas tres categorías se mostrarán debajo de la categoría principal "Gastos de automóvil".
HELP_BUDGET_CATEGORY_PERIOD_TYPE=El período presupuestario que se asignará a la categoría de presupuesto.  Un "período presupuestario" es un rango repetido de fechas para el cual usted asigna un monto en su presupuesto; por ejemplo, a una categoría de presupuesto para realizar un seguimiento de los impuestos mensuales a la propiedad se le debe asignar un tipo de período "Mes".
HELP_BUDGET_CATEGORY_TYPE=Especifique este valor dependiendo de si la categoría de presupuesto representa transacciones de ingresos o gastos.  Ejemplos de categorías de ingresos podrían incluir "Salario", "Bonificación", "Regalos recibidos", etc. Ejemplos de categorías de gastos podrían incluir "Comestibles", "Reparación de automóviles", "Alquiler", etc.
HELP_CLEAR_TRANSACTION=Borra todos los campos en el editor de transacciones y anula la selección de cualquier transacción seleccionada (si corresponde).
HELP_CURRENCY=La moneda utilizada para todas las transacciones.  Esto se mostrará según la configuración regional especificada.
HELP_DATE_FORMAT=Esto puede anular el formato de fecha predeterminado para la configuración regional seleccionada.  Deje este valor como "Usar valores predeterminados de configuración regional" para usar el formato de fecha para la configuración regional especificada.
HELP_SHOW_DELETED=Mostrar cuentas y categorias de presupuesto eliminadas en listas y selectores.
HELP_DELETE_DATA=Si se selecciona esta opción, todos los datos existentes se eliminarán antes de la restauración.  No hay forma de deshacer esta acción.  Tenga en cuenta que restaurar datos existentes no duplicará todo: el procedimiento de restauración solo agrega lo nuevo en el archivo de respaldo.
HELP_DELETE_TRANSACTION=Elimina la transacción actualmente seleccionada
HELP_ENCRYPT_DATA_PASSWORD=Para cambiar la configuracion de cifrado, ingrese su contrasena actual de inicio de sesion.
HELP_ENCRYPT_DATA=Esta opcion controla si los datos de su cuenta estan cifrados. Si se habilita, Buddi Live cifra campos sensibles como nombres de cuentas y presupuestos y descripciones de transacciones. Si habilita el cifrado, el restablecimiento de contrasena no estara disponible y las contrasenas perdidas no se podran recuperar. Consulte la pagina de cifrado de Buddi Live para mas detalles.
HELP_END_DATE=Se utiliza con el selector de intervalos "Otro".  La fecha de finalización del intervalo del informe.
HELP_GETTING_STARTED_TITLE=Primeros pasos
HELP_GETTING_STARTED=<b>Bienvenido a Buddi Live.</b><br/><br/>Si ya usa Buddi de escritorio, puede exportar sus transacciones en Archivo &rarr; Exportar &rarr; Exportar datos de Buddi Live. Puede importar ese archivo en Buddi Live en Sistema &rarr; Restaurar, y seleccionando el archivo .json generado.<br/><br/>Si es nuevo en Buddi, puede <a href='doc/tutorial.html' target='_blank'>ver el tutorial</a> para empezar.<br/><br/>Para habilitar el cifrado o cambiar idioma y formato, haga clic en Sistema &rarr; Preferencias.<br/><br/>Este mensaje se mostrara al iniciar hasta que agregue al menos una cuenta. Puede verlo de nuevo en Sistema &rarr; Primeros pasos.
HELP_INTERVAL_PICKER=El intervalo de fechas que se utilizará para este informe.  Elija un intervalo predefinido o ingrese una fecha de inicio/finalización personalizada.
HELP_LOCALE=El idioma/país que se utiliza para las localizaciones.  Las localizaciones incluyen el idioma, el formato del símbolo de moneda, el formato predeterminado de fecha y número, etc.
HELP_RECORD_UPDATE_TRANSACTION=Registre (o actualice) la transacción actualmente seleccionada.  Presione Ctrl + Enter al editar la transacción como acceso directo.
HELP_REGISTER_2=Por favor revise su correo electrónico para obtener una clave de activación.  Una vez que llegue, cópielo aquí, seleccione una contraseña y haga clic en "Crear cuenta".<br/><br/>Después de crear la cuenta, puede iniciar sesión con su dirección de correo electrónico y contraseña.
HELP_REGISTER=Ingrese una dirección de correo electrónico válida y haga clic en "Generar clave".
HELP_REPEATING_BIWEEKLY=Configure esta transacción para que se repita cada dos semanas en el día de la semana especificado.
HELP_REPEATING_EVERY_X_DAYS=Configure esta transacción para que se repita después del número de días especificado.  Este valor debe ser mayor que 0.
HELP_REPEATING_MONTHLY_BY_DAY_OF_WEEK=Configure esta transacción para que se repita todos los meses en el día de la semana especificado.
HELP_REPEATING_MONTHLY=Configure esta transacción para que se repita todos los meses en el día especificado del mes.  Tenga en cuenta que sólo algunos meses tienen 31 días; utilice "Último día" para ajustar automáticamente los meses más cortos.
HELP_REPEATING_MULTIPLE_MONTHS_EVERY_YEAR=Configure esta transacción para que se repita el día especificado del mes, en los meses especificados del año.
HELP_REPEATING_MULTIPLE_WEEKS_EVERY_MONTH=Configure esta transacción para que se repita el día de la semana especificado, en las semanas especificadas del mes.
HELP_REPEATING_WEEKLY=Configure esta transacción para que se repita todas las semanas en el día especificado de la semana.
HELP_RESET_PASSWORD_2=Una vez que la clave de activación llegue a su correo electrónico, cópiela aquí y elija una nueva contraseña.<br/><br/>Si su cuenta está cifrada, no hay forma de recuperar su contraseña y no recibirá la clave de activación.
HELP_RESET_PASSWORD=Ingrese su dirección de correo electrónico de inicio de sesión para recibir una clave temporal para restablecer su contraseña.<br/><br/>Solo puede restablecer su contraseña si no ha habilitado el cifrado.  Si su cuenta está cifrada, no hay forma de recuperar su contraseña y no recibirá la clave de activación.
HELP_RESTORE_FILE=Cargue un archivo guardado previamente por Buddi Live, o un archivo exportado a Buddi Live desde la versión de escritorio de Buddi.  Este archivo generalmente tiene una extensión .json y, si se genera desde Buddi Live, se llamará 'backup.json'.
HELP_SCHEDULED_TRANSACTION_END_DATE=El día en el que debe finalizar esta transacción programada.  Deje este espacio en blanco para no programar nunca una fecha de finalización (esto se puede cambiar más adelante si lo desea).
HELP_SCHEDULED_TRANSACTION_MESSAGE=Un mensaje para mostrar cuándo se ha activado la transacción programada.  El mensaje se muestra al iniciar sesión.  Deje esto en blanco para no mostrar nada.
HELP_SCHEDULED_TRANSACTION_NAME=El nombre de la transacción programada.  Esto debería ser lo suficientemente descriptivo para identificar qué hace la transacción programada.  Algunos ejemplos podrían incluir "Transferencia mensual a ahorros", "Asignación personal", etc.
HELP_SCHEDULED_TRANSACTION_REPEAT=Elija una frecuencia para repetir esta transacción programada.  Dependiendo del horario elegido, pueden haber diferentes opciones que se muestran a continuación.
HELP_SCHEDULED_TRANSACTION_START_DATE=El día en el que debe comenzar esta transacción programada.
HELP_SCHEDULED_TRANSACTION_TRANSACTION=La transacción que se agregará automáticamente según el cronograma especificado.  Como mínimo, especifique la descripción, el monto y las fuentes desde/hacia.
HELP_START_DATE=Se utiliza con el selector de intervalos "Otro".  La fecha de inicio del intervalo del informe.
HELP_STORE_EMAIL=Esta opcion controla si Buddi Live guarda su correo de inicio de sesion en formato recuperable para correos del sistema. Dejelo desactivado para maxima privacidad.
HELP_TIMEZONE=La zona horaria local.  Esto se utiliza para ejecutar transacciones programadas a la medianoche, hora local.  Si una zona horaria determinada va a admitir el horario de verano, elija la entrada "Hora de verano" en lugar de la "Estándar" (por ejemplo, "Hora de verano de montaña" cambiará automáticamente el horario de verano, mientras que "Hora estándar de montaña" no cambiará para el horario de verano).
HELP_USE_TWO_FACTOR=Use la autenticacion de dos factores. Despues de configurar una app autenticadora, debera ingresar un codigo de 6 digitos al iniciar sesion.
