CONFIRM_CHANGE_EXISTING_TRANSACTION_TITLE=Cambiar transacción existente
CONFIRM_CHANGE_EXISTING_TRANSACTION=Está cambiando los atributos principales de una transacción existente.  ¿Estás seguro de que quieres hacer esto?  Haga clic en "Sí" para continuar o haga clic en "No" para cancelar.<br/><br/>Si en lugar de eso desea agregar una nueva transacción, haga clic en el botón "Borrar" antes de agregar una nueva transacción.<br/>
CONFIRM_DATE_OUT_OF_RANGE_AFTER=La fecha especificada es más de un mes en el futuro.  ¿Estás seguro de que esto es correcto?  Haga clic en "Sí" para continuar con esta fecha o haga clic en "No" para cancelar.
CONFIRM_DATE_OUT_OF_RANGE_BEFORE=La fecha especificada es hace más de un año.  ¿Estás seguro de que esto es correcto?  Haga clic en "Sí" para continuar con esta fecha o haga clic en "No" para cancelar.
CONFIRM_DATE_OUT_OF_RANGE_TITLE=Fecha fuera de rango
CONFIRM_DELETE_ACCOUNT=¿Está seguro de que desea eliminar esta cuenta?<br/>Si hay transacciones asociadas con ella, la cuenta solo se marcará como eliminada (y se puede recuperar en una fecha posterior si lo desea).<br/>Si no hay transacciones, la cuenta se eliminará permanentemente.
CONFIRM_DELETE_CATEGORY=¿Está seguro de que desea eliminar esta categoría de presupuesto?<br/>Si hay transacciones asociadas con ella, la categoría solo se marcará como eliminada (y se puede recuperar en una fecha posterior si lo desea).<br/>Si no hay transacciones, la categoría se eliminará permanentemente.
CONFIRM_DELETE_DATA=La casilla de verificación "Eliminar datos" está seleccionada y todos los datos existentes se eliminarán antes de restaurar la copia de seguridad.  No hay forma de deshacer esta acción.  ¿Estás seguro de que quieres continuar?
CONFIRM_DELETE_SCHEDULED=¿Está seguro de que desea eliminar esta transacción programada?  Una vez eliminadas, las transacciones ya no se crearán automáticamente.  Las transacciones existentes que ya se hayan agregado se mantendrán.
CONFIRM_DELETE_TRANSACTION=¿Está seguro de que desea eliminar esta transacción?  No hay forma de deshacer esta acción.
CONFIRM_DELETE_USER=Al eliminar su cuenta de usuario, ya no podrá iniciar sesión en Buddi Live y todos los datos que haya ingresado previamente se perderán permanentemente.<br/><br/>Se recomienda encarecidamente que descargue una copia de seguridad de sus datos antes de eliminar su cuenta; esto le permitirá restaurar los datos en caso de que abra una nueva cuenta.<br/><br/>¿Realmente desea eliminar su cuenta de usuario de Buddi Live?  Haga clic en "Sí" para eliminar permanentemente la cuenta o haga clic en "No" para cancelarla.<br/>
CONFIRM_DELETE_USER2=¿Está seguro de que desea eliminar su cuenta de usuario y todos los datos del sistema?  Esta acción no se puede deshacer.<br/><br/>Haga clic en "Sí" para eliminar permanentemente su cuenta de usuario de Buddi Live, o haga clic en "No" para cancelar.<br/>
COOKIES_USED_MESSAGE=Buddi Live utiliza cookies para permitir a los usuarios iniciar sesión. Por lo tanto, se requieren cookies para utilizar este sitio web.<br/><br/>Al hacer clic en Sí, acepta que este sitio web pueda guardar cookies en su navegador.<br/><br/>Para obtener más información, consulte los <a href='doc/termsandconditions.html'>Términos y condiciones</a>.
