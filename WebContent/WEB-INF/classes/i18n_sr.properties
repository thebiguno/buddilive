REPORT_INFO_NET_WORTH_BODY=\u0418\u0441\u0446\u0440\u0442\u0430\u0432\u0430 \u0432\u0430\u0448\u0443 \u0443\u043A\u0443\u043F\u043D\u0443 \u043D\u0435\u0442\u043E \u0432\u0440\u0435\u0434\u043D\u043E\u0441\u0442 (\u0437\u0431\u0438\u0440 \u0441\u0432\u0438\u0445 \u0441\u0442\u0430\u045A\u0430 \u043D\u0430 \u0440\u0430\u0447\u0443\u043D\u0443) \u0442\u043E\u043A\u043E\u043C \u0438\u0437\u0430\u0431\u0440\u0430\u043D\u043E\u0433 \u043F\u0435\u0440\u0438\u043E\u0434\u0430 \u043A\u0430\u043E \u0458\u0435\u0434\u043D\u0443 \u043B\u0438\u043D\u0438\u0458\u0443.\\u043D\\u043D\u041E\u0431\u0440\u0430\u0447\u0443\u043D: \u0418\u0441\u0442\u043E \u043A\u0430\u043E \u0438 \u0441\u0442\u0430\u045A\u0435 \u043D\u0430 \u0440\u0430\u0447\u0443\u043D\u0443 \u0442\u043E\u043A\u043E\u043C \u0432\u0440\u0435\u043C\u0435\u043D\u0430, \u0430\u043B\u0438 \u0441\u0432\u0430 \u0441\u0442\u0430\u045A\u0430 \u043D\u0430 \u0440\u0430\u0447\u0443\u043D\u0443 \u0441\u0435 \u0441\u0430\u0431\u0438\u0440\u0430\u0458\u0443 \u0443 \u0458\u0435\u0434\u043D\u0443 \u043D\u0435\u0442\u043E \u0432\u0440\u0435\u0434\u043D\u043E\u0441\u0442 \u0443 \u0441\u0432\u0430\u043A\u043E\u0458 \u0442\u0430\u0447\u043A\u0438 \u043D\u0435\u0434\u0435\u0459\u043D\u0438\u0445 \u043F\u043E\u0434\u0430\u0442\u0430\u043A\u0430.\\u043D\\u043D\u041F\u0440\u0435\u0442\u043F\u043E\u0441\u0442\u0430\u0432\u043A\u0435: \u0421\u0432\u0438 \u0440\u0430\u0447\u0443\u043D\u0438 \u0441\u0443 \u0443\u043A\u0459\u0443\u0447\u0435\u043D\u0438 \u2014 \u0441\u0440\u0435\u0434\u0441\u0442\u0432\u0430 (\u0447\u0435\u043A\u043E\u0432\u0438, \u0448\u0442\u0435\u0434\u045A\u0430, \u0432\u0440\u0435\u0434\u043D\u043E\u0441\u0442 \u0443\u043B\u0430\u0433\u0430\u045A\u0430) \u0434\u043E\u0434\u0430\u0458\u0443 \u0441\u0435 \u043D\u0430 \u043D\u0435\u0442\u043E \u0432\u0440\u0435\u0434\u043D\u043E\u0441\u0442 \u0443\u043B\u0430\u0433\u0430\u045A\u0430; \u043E\u0431\u0430\u0432\u0435\u0437\u0435 (\u043A\u0440\u0435\u0434\u0438\u0442\u043D\u0435 \u043A\u0430\u0440\u0442\u0438\u0446\u0435, \u043A\u0440\u0435\u0434\u0438\u0442\u0438) \u043E\u0434\u0443\u0437\u0435\u0442\u0438. \u0420\u0430\u0447\u0443\u043D\u0438 \u0431\u0435\u0437 \u0442\u0440\u0430\u043D\u0441\u0430\u043A\u0446\u0438\u0458\u0430 \u0443 \u043F\u0435\u0440\u0438\u043E\u0434\u0443 \u0438 \u0434\u0430\u0459\u0435 \u0434\u043E\u043F\u0440\u0438\u043D\u043E\u0441\u0435 \u0441\u0432\u043E\u043C \u0441\u0442\u0430\u045A\u0443.
