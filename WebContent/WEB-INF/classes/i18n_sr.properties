REPORT_INFO_PIE_EXPENSES_BODY=\u041F\u0440\u0438\u043A\u0430\u0437\u0443\u0458\u0435 \u0443\u0434\u0435\u043E \u0443\u043A\u0443\u043F\u043D\u0435 \u043F\u043E\u0442\u0440\u043E\u0448\u045A\u0435 \u043F\u0440\u0438\u043F\u0438\u0441\u0430\u043D \u0441\u0432\u0430\u043A\u043E\u0458 \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0458\u0438 \u0442\u0440\u043E\u0448\u043A\u043E\u0432\u0430 \u043D\u0430\u0458\u0432\u0438\u0448\u0435\u0433 \u043D\u0438\u0432\u043E\u0430 \u0442\u043E\u043A\u043E\u043C \u0438\u0437\u0430\u0431\u0440\u0430\u043D\u043E\u0433 \u043F\u0435\u0440\u0438\u043E\u0434\u0430.\\u043D\\u043D\u041E\u0431\u0440\u0430\u0447\u0443\u043D: \u0441\u0443\u043C\u0438\u0440\u0430\u0458\u0443 \u0441\u0435 \u0441\u0432\u0435 \u043F\u043E\u0434\u0435\u043B\u0435 \u0442\u0440\u0430\u043D\u0441\u0430\u043A\u0446\u0438\u0458\u0430 \u0433\u0434\u0435 \u0458\u0435 \u043E\u0434\u0440\u0435\u0434\u0438\u0448\u0442\u0435 \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0458\u0430 \u0442\u0440\u043E\u0448\u043A\u043E\u0432\u0430. \u0423\u043A\u0443\u043F\u043D\u0438 \u0438\u0437\u043D\u043E\u0441 \u0441\u0432\u0430\u043A\u0435 \u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0458\u0435 \u0458\u0435 \u0438\u0437\u0440\u0430\u0436\u0435\u043D \u043A\u0430\u043E \u043F\u0440\u043E\u0446\u0435\u043D\u0430\u0442 \u0443\u043A\u0443\u043F\u043D\u0435 \u043F\u043E\u0442\u0440\u043E\u0448\u045A\u0435. \u041F\u043E\u0442\u043A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u0458\u0435 \u0441\u0435 \u0443\u0431\u0440\u0430\u0458\u0430\u0458\u0443 \u0443 \u0441\u0432\u043E\u0458\u0435 \u043D\u0430\u0434\u0440\u0435\u0452\u0435\u043D\u0435.\\u043D\\u043D\u041F\u0440\u0435\u0442\u043F\u043E\u0441\u0442\u0430\u0432\u043A\u0435: \u0422\u0440\u0430\u043D\u0441\u0444\u0435\u0440\u0438 \u0438\u0437\u043C\u0435\u0452\u0443 \u043D\u0430\u043B\u043E\u0433\u0430 \u0441\u0443 \u0438\u0441\u043A\u0459\u0443\u0447\u0435\u043D\u0438. \u0420\u0430\u0447\u0443\u043D\u0430\u0458\u0443 \u0441\u0435 \u0441\u0430\u043C\u043E \u043F\u043E\u0434\u0435\u043B\u0435 \u0441\u0430 \u043E\u0434\u0440\u0435\u0434\u0438\u0448\u0442\u0435\u043C \u0442\u0438\u043F\u0430 \u0415\u043A\u043F\u0435\u043D\u0441\u0435.
