REPORT_GROUP_ACCOUNTS_CASH_FLOW=REGNSKAP & KONTANTSTRØM
REPORT_GROUP_BUDGET_SPENDING=BUDSJETT OG UTGIFTER
REPORT_GROUP_COMPARISON=SAMMENLIGNING
REPORT_INFO_AVG_INCOME_EXPENSES_BODY=Viser gjennomsnittlig månedlig inntekt og utgiftsbeløp per kategori over den valgte perioden.\n\nBeregning: De samme summene som Inntekter og utgifter etter kategori er delt på antall måneder i det valgte intervallet for å produsere et gjennomsnitt per måned.\n\nForutsetninger: Delmåneder ved starten eller slutten av intervallet regnes som hele måneder. Nyttig for å identifisere ditt typiske månedlige forbruksmønster.
REPORT_INFO_AVG_INCOME_EXPENSES_TITLE=Gjennomsnittlig inntekt og utgifter etter kategori
REPORT_INFO_BALANCES_OVER_TIME_BODY=Plott den løpende saldoen for hver konto over den valgte perioden som et linjediagram.\n\nBeregning: Serveren spiller av alle transaksjoner på nytt i datorekkefølge, og akkumulerer en løpende saldo for hver konto. Ett datapunkt sendes ut per uke (eller på viktige datoer).\n\nForutsetninger: Saldoene vises som lagret — debetkontoer (sjekking, sparing) er positive; kredittkontoer (kredittkort, lån) kan være negative. Startsaldoen for hver konto er inkludert.
REPORT_INFO_BALANCES_OVER_TIME_TITLE=Kontosaldo over tid
REPORT_INFO_BUDGET_VS_ACTUAL_BODY=Sammenligner det budsjetterte beløpet ditt med faktiske utgifter for hver utgiftskategori over den valgte perioden.\n\nBeregning: Budsjettbeløp kommer fra kategoriens budsjettoppføringer for perioden. Faktiske beløp er summen av alle transaksjonsdelinger som er tilordnet hver kategori. Begge vises som søyler side ved side.\n\nForutsetninger: Kun utgiftskategorier med budsjettoppføring eller faktiske transaksjoner vises. Inntektskategorier er ekskludert. Hvis en kategori ikke har noe budsjett satt, vil dens budsjetterte søyle være null.
REPORT_INFO_BUDGET_VS_ACTUAL_TITLE=Budsjett kontra faktisk
REPORT_INFO_CATEGORY_DRILLDOWN_BODY=Viser månedlig utgiftstrend for en enkelt valgt kategori over det valgte intervallet.\n\nBeregning: Alle transaksjonsdelinger tilordnet den valgte kategorien (eller noen av dens underkategorier) summeres per kalendermåned og plottes som et linjediagram.\n\nForutsetninger: Underkategorier er inkludert i totalen. Bare den valgte kategorien vises – bruk flere faner for å sammenligne kategorier side ved side.
REPORT_INFO_CATEGORY_DRILLDOWN_TITLE=Kategori Drill-Down
REPORT_INFO_DEBT_PAYDOWN_BODY=Sporer saldoen på kreditt- og lånekontoene dine over tid for å visualisere fremdriften for gjeldsreduksjon.\n\nBeregning: Alle transaksjonsdelinger som involverer kredittkontoer spilles på nytt i dato for å produsere en løpende saldo for hver kredittkonto. Ett datapunkt sendes ut per uke.\n\nForutsetninger: Kun kredittkontoer (kredittkort, kredittlinjer, lån) vises. Saldoer vises som negative tall - en linje som trender mot null betyr at gjelden blir nedbetalt. Debetkontoer (sjekking, sparing) er ekskludert.
REPORT_INFO_DEBT_PAYDOWN_TITLE=Gjeld Nedbetalingssporer
REPORT_INFO_INCOME_EXPENSES_BODY=En detaljert tabell som sammenligner inntekter og utgifter for hver kategori over den valgte perioden.\n\nBeregning: Oppdelingene er gruppert etter deres kategori. Inntektskategorier viser totale tilsig; utgiftskategorier viser totale utbetalinger. Rader kan utvides for å vise individuelle transaksjoner.\n\nForutsetninger: Bare gjeldende periode vises. Overføringer mellom kontoer vises ikke.
REPORT_INFO_INCOME_EXPENSES_TITLE=Inntekter og utgifter etter kategori
REPORT_INFO_INFLOW_ACCOUNT_BODY=Viser totale penger som strømmer inn og ut av hver konto i løpet av den valgte perioden.\n\nBeregning: For hver konto summeres alle deler der den kontoen er destinasjonen som tilsig; alle splitter der det er kilden summeres som utstrømning.\n\nForutsetninger: Overføringer mellom dine egne kontoer vises både som en innstrømning til en konto og en utstrømning fra en annen, så de kansellerer ut på nettoformuen.
REPORT_INFO_INFLOW_ACCOUNT_TITLE=Tilgang og utgang etter konto
REPORT_INFO_INFLOW_PAYEE_BODY=Rangerer betalingsmottakere (transaksjonsbeskrivelser) etter deres totale inn- og utstrømning over den valgte perioden.\n\nBeregning: Transaksjoner er gruppert etter beskrivelse (navn på betalingsmottaker). Alle oppdelinger innenfor hver transaksjon summeres som innstrømning eller utstrømning avhengig av fortegn.\n\nForutsetninger: Mottakermatching er nøyaktig – samme betalingsmottaker med litt forskjellig stavemåte vil vises som separate oppføringer. Krypterte navn dekrypteres kun for visning.
REPORT_INFO_INFLOW_PAYEE_TITLE=Innstrømning og utbetaling av betalingsmottaker
REPORT_INFO_MONTHLY_CASH_FLOW_BODY=Viser total inntekt, totale utgifter og netto kontantstrom (inntekt minus utgifter) for hver maned i valgt periode.\n\nBeregning: Splitt summeres per kalendermaned. Inntektssplitt summeres som inntekt, og utgiftssplitt summeres som utgifter. Netto = Inntekt - Utgifter.\n\nForutsetninger: Overforinger mellom kontoer er ekskludert. En positiv nettoverdi betyr at du brukte mindre enn du tjente den maneden; negativ betyr at du brukte mer enn du tjente.
REPORT_INFO_MONTHLY_CASH_FLOW_TITLE=Månedlig kontantstrøm
REPORT_INFO_NET_WORTH_BODY=Plott din totale nettoverdi (summen av alle kontosaldoer) over den valgte perioden som en enkelt linje.\n\nBeregning: Samme som kontosaldo over tid, men alle kontosaldoer summeres til en enkelt nettoverdi ved hvert ukentlig datapunkt.\n\nForutsetninger: Alle kontoer er inkludert – eiendeler (sjekking, sparing, investeringer) legges til nettoverdien. gjeld (kredittkort, lån) trekkes fra. Kontoer uten transaksjoner i perioden bidrar fortsatt med sin saldo.
REPORT_INFO_NET_WORTH_TITLE=Nettoverdi over tid
REPORT_INFO_PIE_EXPENSES_BODY=Viser andelen av det totale forbruket som tilskrives hver utgiftskategori på toppnivå over den valgte perioden.\n\nBeregning: Alle transaksjonsdelinger der destinasjonen er en utgiftskategori summeres. Summen av hver kategori er uttrykt som en prosentandel av det totale forbruket. Underkategorier er samlet inn i overordnet.\n\nForutsetninger: Overføringer mellom kontoer er ekskludert. Bare splittelser med en destinasjon av utgiftstype telles.
REPORT_INFO_PIE_EXPENSES_TITLE=Utgifter etter kategori (pai)
REPORT_INFO_PIE_INCOME_BODY=Viser andelen av den totale inntekten som hver inntektskategori på toppnivå har bidratt med over den valgte perioden.\n\nBeregning: Alle transaksjonsdelinger der kilden er en inntektskategori summeres. Hver kategoris totalsum er uttrykt som en prosentandel av samlet inntekt. Bare kategorier på toppnivå vises; underkategorier rulles opp til sine overordnede.\n\nForutsetninger: Overføringer mellom kontoer er ekskludert. Bare splitter med en inntektskilde telles.
REPORT_INFO_PIE_INCOME_TITLE=Inntekt etter kategori (kake)
REPORT_INFO_PROJECTED_BALANCE_BODY=Prognoser hvordan kontosaldoene dine vil endre seg i løpet av de neste N dagene basert på dine historiske forbruksmønstre.\n\nBeregning: De siste 12 månedene med transaksjoner analyseres for å beregne en gjennomsnittlig månedlig nettoendring for hver konto. Med utgangspunkt i dagens faktiske saldo, brukes dette gjennomsnittet den 1. i hver anslått måned. Et ukentlig øyeblikksbilde plottes for hver aktive konto.\n\nForutsetninger: Bare kontoer med en gjennomsnittlig månedlig endring større enn $1 vises (statiske investeringskontoer er skjult). Fremskrivningen forutsetter at fremtiden vil se ut som siste 12-måneders gjennomsnitt - den tar ikke hensyn til engangs store transaksjoner, sesongvariasjoner eller endringer i forbruksvaner.
REPORT_INFO_PROJECTED_BALANCE_TITLE=Anslått balanse
REPORT_INFO_SAVINGS_RATE_BODY=Viser hvor mange prosent av inntekten du har spart hver måned over den valgte perioden.\n\nBeregning: Sparesats % = (Inntekt − Utgifter) / Inntekt × 100, beregnet per kalendermåned. Plottet som et linjediagram.\n\nForutsetninger: Måneder med null inntekt hoppes over for å unngå deling med null. En rate over 0 % betyr at du har spart penger; under 0 % betyr at du brukte mer enn du tjente. Overføringer mellom kontoer er ekskludert.
REPORT_INFO_SAVINGS_RATE_TITLE=Sparesats
REPORT_INFO_TOP_PAYEES_BODY=Rangerer de beste betalingsmottakerne (transaksjonsbeskrivelser) etter totalt forbruk over den valgte perioden, vist som et horisontalt søylediagram.\n\nBeregning: Alle utgiftsfordelinger er gruppert etter transaksjonsbeskrivelse (betalingsmottaker). Totaler er sortert synkende. Hver stolpe viser også betalingsmottakerens prosentandel av det totale forbruket for perioden.\n\nForutsetninger: Bare utbetalinger til utgiftskategorier telles – inntekter og overføringer er ekskludert. Utbetalingsmottakers navn må samsvare nøyaktig; små staveforskjeller skaper separate oppføringer.
REPORT_INFO_TOP_PAYEES_TITLE=Beste betalingsmottakere etter forbruk
REPORT_INFO_YEAR_OVER_YEAR_BODY=Sammenligner forbruk og inntekt etter kategori mellom to påfølgende perioder av samme lengde (f.eks. i år kontra i fjor).\n\nBeregning: Det valgte intervallet definerer den "gjeldende" perioden. Serveren beregner automatisk tilsvarende tidligere periode av samme lengde. Begge periodenes kategoritotaler vises som søyler side ved side.\n\nForutsetninger: Den forrige perioden har alltid samme varighet som den valgte perioden, flyttet tilbake med nøyaktig én periodelengde. Kategorier uten aktivitet i noen av periodene er ekskludert.
REPORT_INFO_YEAR_OVER_YEAR_TITLE=Sammenligning av periode side om side
