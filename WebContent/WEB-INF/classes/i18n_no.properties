HELP_ACCOUNT_EDITOR_ACCOUNT_TYPE=Den overordnede kategoriseringen av kontoen. Dette er en fritekstetikett som lar deg gruppere lignende kontoer. Eksempler er "Brukskonto", "Sparekonto", "Kredittkort", osv.
HELP_ACCOUNT_EDITOR_NAME=Navnet på kontoen.  Dette skal være et beskrivende navn som unikt identifiserer kontoen.  Eksempler på kontonavn er «ABC Savings», «Visa Premium», «Cash in Wallet», etc.
HELP_ACCOUNT_EDITOR_STARTING_BALANCE=Startsaldoen er beløpet på kontoen når det først legges inn i Buddi.  Denne mengden bør vanligvis ikke endres etter første oppsett.
HELP_ACCOUNT_EDITOR_TYPE=Om denne kontoen er en "Debet"- eller "Kreditt"-konto. Debetkontoer er kontoer med penger, som sparekonto, brukskonto og kontanter. Kredittkontoer er kontoer med gjeld, som kredittkort og lan.
HELP_BUDGET_CATEGORY_NAME=Dette er navnet på en gruppe vanlige transaksjoner.  For eksempel kan en kategori kalt "Groceries" spore matkjøp; en kategori kalt "Husholdning" for å spore ulike husholdningsutgifter som møbler og enkle hjemmereparasjoner; og en kategori kalt "Lønn" kan spore inntekt fra en månedslønn.<br/>For å gruppere vanlige sett med kategorier, se funksjonaliteten "Overordnet kategori" nedenfor.
HELP_BUDGET_CATEGORY_PARENT=En overordnet kategori kan brukes til å gruppere relaterte budsjettkategorier.  Anta for eksempel at det er en kategori som heter "Bilutgifter".  Andre kategorier kan deretter legges til: "Drivstoff", "Bilforsikring" og "Vedlikehold og reparasjoner", alle med hovedkategorien "Bilutgifter".  Når de er fullført, vil disse tre kategoriene vises under hovedkategorien "Bilutgifter".
HELP_BUDGET_CATEGORY_PERIOD_TYPE=Budsjettperioden som skal tilordnes til budsjettkategorien.  En "budsjettperiode" er et gjentatt tidsintervall som du tilordner et beløp for i budsjettet. for eksempel bør en budsjettkategori for sporing av månedlige eiendomsskatter tilordnes en periodetype "Måned".
HELP_BUDGET_CATEGORY_TYPE=Angi denne verdien avhengig av om budsjettkategorien representerer inntekts- eller utgiftstransaksjoner.  Eksempler på inntektskategorier kan være «Lønn», «Bonus», «Mottatte gaver» osv. Eksempler på utgiftskategorier kan være «Dagligvarer», «Bilreparasjon», «Leie» osv.
HELP_CLEAR_TRANSACTION=Tømmer alle felt i transaksjonsredigeringsprogrammet, og fjerner markeringen av enhver valgt transaksjon (hvis aktuelt).
HELP_CURRENCY=Valutaen som brukes for alle transaksjoner.  Dette vil vises i henhold til lokaliteten som er spesifisert.
HELP_DATE_FORMAT=Dette kan overstyre standard datoformat for den valgte lokaliteten.  La denne verdien være "Bruk standardinnstillinger for lokalitet" for å bruke datoformatet for den angitte lokaliteten.
HELP_SHOW_DELETED=Vis slettede kontoer og budsjettkategorier i lister og velgere.
HELP_DELETE_DATA=Hvis dette velges, vil alle eksisterende data bli slettet før gjenopprettingen.  Det er ingen måte å angre denne handlingen på.  Merk at gjenoppretting over eksisterende data ikke vil duplisere alt - gjenopprettingsprosedyren legger bare til det som er nytt i sikkerhetskopifilen.
HELP_DELETE_TRANSACTION=Sletter den valgte transaksjonen
HELP_ENCRYPT_DATA_PASSWORD=For a endre krypteringsinnstillinger, skriv inn gjeldende innloggingspassord.
HELP_ENCRYPT_DATA=Dette valget styrer om kontodataene dine er kryptert. Hvis aktivert, krypterer Buddi Live sensitive felt som konto- og budsjettnavn og transaksjonsbeskrivelser. Hvis du aktiverer kryptering, er passordtilbakestilling ikke tilgjengelig og tapte passord kan ikke gjenopprettes. Se Buddi Live-krypteringssiden for detaljer.
HELP_END_DATE=Brukes med 'Annet' intervallvelger.  Sluttdatoen for rapportintervallet.
HELP_GETTING_STARTED_TITLE=Komme i gang
HELP_GETTING_STARTED=<b>Velkommen til Buddi Live!</b><br/><br/>Hvis du allerede bruker Buddi Desktop, kan du eksportere transaksjonene dine via Fil &rarr; Export &rarr; Export Buddi Live data. Du kan importere dette i Buddi Live ved aa klikke System &rarr; Gjenopprett og velge .json-filen som ble laget ved eksporten.<br/><br/>Hvis du er ny i Buddi, kan du <a href='doc/tutorial.html' target='_blank'>se veiledningen</a> for aa komme i gang.<br/><br/>For aa aktivere kryptering eller endre locale- og formatdetaljer, klikk System &rarr; Innstillinger.<br/><br/>Denne meldingen vises ved oppstart hver gang til du har lagt til minst en konto. Du kan vise den igjen ved aa klikke System &rarr; Komme i gang.
HELP_INTERVAL_PICKER=Datointervallet som skal brukes for denne rapporten.  Velg et forhåndsdefinert intervall, eller skriv inn en egendefinert start-/sluttdato.
HELP_LOCALE=Språket/landet som brukes for lokaliseringer.  Lokaliseringer inkluderer språk, formateringen av valutasymbolet, standard dato- og tallformatering, etc.
HELP_RECORD_UPDATE_TRANSACTION=Registrer (eller oppdater) den valgte transaksjonen.  Trykk Ctrl + Enter når du redigerer transaksjonen som en snarvei.
HELP_REGISTER_2=Vennligst sjekk e-posten din for en aktiveringsnøkkel.  Når den kommer, kopierer du den her, velger et passord og klikker på "Opprett konto".<br/><br/>Etter å ha opprettet kontoen kan du logge på med e-postadressen og passordet.
HELP_REGISTER=Vennligst skriv inn en gyldig e-postadresse og klikk "Generer nøkkel".
HELP_REPEATING_BIWEEKLY=Angi at denne transaksjonen skal gjentas annenhver uke på den angitte ukedagen.
HELP_REPEATING_EVERY_X_DAYS=Angi at denne transaksjonen skal gjentas etter det angitte antallet dager.  Denne verdien må være mer enn 0.
HELP_REPEATING_MONTHLY_BY_DAY_OF_WEEK=Angi at denne transaksjonen skal gjentas hver måned på den angitte ukedagen.
HELP_REPEATING_MONTHLY=Angi at denne transaksjonen skal gjentas hver måned på den angitte dagen i måneden.  Husk at bare noen måneder har 31 dager; bruk «Siste dag» for å justere automatisk for kortere måneder.
HELP_REPEATING_MULTIPLE_MONTHS_EVERY_YEAR=Angi at denne transaksjonen skal gjentas på den angitte dagen i måneden, på de angitte månedene i året.
HELP_REPEATING_MULTIPLE_WEEKS_EVERY_MONTH=Angi at denne transaksjonen skal gjentas på den angitte ukedagen, på de angitte ukene i måneden.
HELP_REPEATING_WEEKLY=Angi at denne transaksjonen skal gjentas hver uke på den angitte ukedagen.
HELP_RESET_PASSWORD_2=Når aktiveringsnøkkelen kommer i e-posten din, vennligst kopier den her og velg et nytt passord.<br/><br/>Hvis kontoen din er kryptert, er det ingen måte å gjenopprette passordet på, og du vil ikke motta aktiveringsnøkkelen.
HELP_RESET_PASSWORD=Skriv inn e-postadressen for pålogging for å motta en midlertidig nøkkel for å tilbakestille passordet ditt.<br/><br/>Du kan bare tilbakestille passordet hvis du ikke har aktivert kryptering.  Hvis kontoen din er kryptert, er det ingen måte å gjenopprette passordet ditt på, og du vil ikke motta aktiveringsnøkkelen.
HELP_RESTORE_FILE=Last opp en fil lagret tidligere av Buddi Live, eller en fil eksportert til Buddi Live fra skrivebordsversjonen av Buddi.  Denne filen har vanligvis en .json-utvidelse, og hvis den genereres fra Buddi Live vil den bli kalt 'backup.json'.
HELP_SCHEDULED_TRANSACTION_END_DATE=Dagen da denne planlagte transaksjonen skal stoppe.  La dette stå tomt for aldri å planlegge en stoppdato (dette kan endres senere hvis ønskelig).
HELP_SCHEDULED_TRANSACTION_MESSAGE=En melding som viser når den planlagte transaksjonen er utløst.  Meldingen vises ved pålogging.  La dette stå tomt for ikke å vise noe.
HELP_SCHEDULED_TRANSACTION_NAME=Navnet på den planlagte transaksjonen.  Dette bør være beskrivende nok til å identifisere hva den planlagte transaksjonen gjør.  Noen eksempler kan inkludere "Månedlig overføring til sparing", "Personlig godtgjørelse" osv.
HELP_SCHEDULED_TRANSACTION_REPEAT=Velg en frekvens for å gjenta denne planlagte transaksjonen.  Avhengig av tidsplanen som er valgt, kan det være forskjellige alternativer vist nedenfor.
HELP_SCHEDULED_TRANSACTION_START_DATE=Dagen da denne planlagte transaksjonen skal begynne.
HELP_SCHEDULED_TRANSACTION_TRANSACTION=Transaksjonen som automatisk legges til på den angitte tidsplanen.  Spesifiser som et minimum beskrivelse, beløp og fra/til kilder.
HELP_START_DATE=Brukes med 'Annet' intervallvelger.  Startdatoen for rapportintervallet.
HELP_STORE_EMAIL=Dette valget styrer om Buddi Live lagrer innloggings-e-posten din i gjenopprettbar form for system-e-post. La den vaere av for maksimal personvern.
HELP_TIMEZONE=Den lokale tidssonen.  Dette brukes til å kjøre planlagte transaksjoner ved midnatt, lokal tid.  Hvis en gitt tidssone skal støtte sommertid, velg "Sommertid"-oppføringen i stedet for "Standard" (f.eks. "Mountain Daylight Time" vil automatisk bytte sommertid, mens "Mountain Standard Time" ikke endres for sommertid).
HELP_USE_TWO_FACTOR=Bruk tofaktorautentisering. Etter oppsett med en autentiseringsapp ma du oppgi en 6-sifret kode nar du logger inn.
HELP=Hjelp
INCOME=Inntekt
INCORRECT_PASSWORD_ENABLE_ENCRYPTION=Ugyldig passord for å aktivere kryptering
INCORRECT_PASSWORD_DISABLE_ENCRYPTION=Ugyldig passord for å deaktivere kryptering
INCORRECT_PASSWORD_DISABLE_TWO_FACTOR=Ugyldig passord for å deaktivere tofaktorautentisering
INFLOW=Tilsig
INFO_LOADING_DELETED_SOURCE_TITLE=Slettet kilde i fra / til felt
INFO_LOADING_DELETED_SOURCE=Det ser ut til at du har lastet inn en transaksjon som refererer til en slettet konto/kategori.  Merk at du ikke vil kunne endre denne transaksjonen uten først å endre kilden til en som ikke er slettet.<br/><br/>Hvis du ønsker å endre denne transaksjonen uten å endre fra/til kilden, må du aktivere alternativet 'Vis slettede kontoer og budsjettkategorier' under System → Innstillinger.<br/>
INTERVAL_PICKER=Intervallvelger
INTERVAL=Intervall
INVALID=Ugyldig
LOADING=Laster inn...
LOGIN_FAILED_MESSAGE=Feil brukernavn/passord.
LOGIN_FAILED_TITLE=Innlogging mislyktes
