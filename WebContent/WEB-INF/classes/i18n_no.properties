CONFIRM_CHANGE_EXISTING_TRANSACTION=Du endrer kjerneattributter for en eksisterende transaksjon.  Er du sikker på at du vil gjøre dette?  Klikk "Ja" for å fortsette, eller klikk "Nei" for å avbryte.<br/><br/>Hvis du i stedet ønsker å legge til en ny transaksjon, klikker du på "Slett"-knappen før du legger til en ny transaksjon.<br/>
CONFIRM_DATE_OUT_OF_RANGE_AFTER=Datoen som er spesifisert er mer enn én måned frem i tid.  Er du sikker på at dette er riktig?  Klikk "Ja" for å fortsette med denne datoen, eller klikk "Nei" for å avbryte.
CONFIRM_DATE_OUT_OF_RANGE_BEFORE=Den angitte datoen er mer enn ett år siden.  Er du sikker på at dette er riktig?  Klikk "Ja" for å fortsette med denne datoen, eller klikk "Nei" for å avbryte.
CONFIRM_DATE_OUT_OF_RANGE_TITLE=Dato utenfor rekkevidde
CONFIRM_DELETE_ACCOUNT=Er du sikker på at du vil slette denne kontoen?<br/>Hvis det er noen transaksjoner knyttet til den, vil kontoen kun bli merket som slettet (og kan om ønskelig angres på et senere tidspunkt).<br/>Hvis det ikke er noen transaksjoner, vil kontoen bli slettet permanent.
CONFIRM_DELETE_CATEGORY=Er du sikker på at du vil slette denne budsjettkategorien?<br/>Hvis det er noen transaksjoner knyttet til den, vil kategorien bare bli merket som slettet (og kan om ønskelig angres på et senere tidspunkt).<br/>Hvis det ikke er noen transaksjoner, vil kategorien bli slettet permanent.
CONFIRM_DELETE_DATA=Avmerkingsboksen "Slett data" er merket, og alle eksisterende data vil bli slettet før sikkerhetskopien gjenopprettes.  Det er ingen måte å angre denne handlingen på.  Er du sikker på at du vil fortsette?
CONFIRM_DELETE_SCHEDULED=Er du sikker på at du vil slette denne planlagte transaksjonen?  Når de er slettet, vil transaksjoner ikke lenger opprettes automatisk.  Eksisterende transaksjoner som allerede er lagt til forblir.
CONFIRM_DELETE_TRANSACTION=Er du sikker på at du vil slette denne transaksjonen?  Det er ingen måte å angre denne handlingen på.
CONFIRM_DELETE_USER=Ved å slette brukerkontoen din vil du ikke lenger kunne logge på Buddi Live, og alle data som tidligere har blitt lagt inn vil bli permanent tapt.<br/><br/>Det anbefales sterkt at du laster ned en sikkerhetskopi av dataene dine før du sletter kontoen din; dette lar deg gjenopprette dataene i tilfelle du åpner en ny konto.<br/><br/>Vil du virkelig slette Buddi Live-brukerkontoen din?  Klikk "Ja" for å slette kontoen permanent, eller klikk "Nei" for å avbryte.<br/>
CONFIRM_DELETE_USER2=Er du sikker på at du vil slette brukerkontoen din og alle data fra systemet?  Denne handlingen kan ikke angres.<br/><br/>Klikk "Ja" for å slette din Buddi Live-brukerkonto permanent, eller klikk "Nei" for å avbryte.<br/>
COOKIES_USED_MESSAGE=Buddi Live bruker informasjonskapsler for å la brukere logge på. Derfor kreves informasjonskapsler for å bruke denne nettsiden.<br/><br/>Ved å klikke Ja godtar du at denne nettsiden kan lagre informasjonskapsler i nettleseren din.<br/><br/>For mer informasjon, se <a href='doc/termsandconditions.html'>Vilkår og betingelser</a>.
