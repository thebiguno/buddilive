REPORT_INFO_AVG_INCOME_EXPENSES_BODY=Affiche le montant mensuel moyen des revenus et des d\u00E9penses par cat\u00E9gorie sur la p\u00E9riode s\u00E9lectionn\u00E9e.\n\nCalcul\u00A0: les m\u00EAmes totaux que les revenus et d\u00E9penses par cat\u00E9gorie sont divis\u00E9s par le nombre de mois dans l'intervalle s\u00E9lectionn\u00E9 pour produire une moyenne mensuelle.\n\nHypoth\u00E8ses\u00A0: les mois partiels au d\u00E9but ou \u00E0 la fin de l'intervalle sont compt\u00E9s comme des mois complets. Utile pour identifier votre mod\u00E8le de d\u00E9penses mensuelles typique.
REPORT_INFO_AVG_INCOME_EXPENSES_TITLE=Revenus et d\u00E9penses moyens par cat\u00E9gorie
REPORT_INFO_BALANCES_OVER_TIME_BODY=Trace le solde courant de chaque compte sur la p\u00E9riode s\u00E9lectionn\u00E9e sous forme de graphique lin\u00E9aire.\n\nCalcul\u00A0: le serveur relit toutes les transactions par ordre de date, accumulant un solde courant pour chaque compte. Un point de donn\u00E9es est \u00E9mis par semaine (ou \u00E0 des dates significatives).\n\nHypoth\u00E8ses\u00A0:\u00A0les soldes sont indiqu\u00E9s comme \u00E9tant stock\u00E9s\u00A0\u2013\u00A0les comptes de d\u00E9bit (ch\u00E8ques, \u00E9pargne) sont positifs\u00A0; les comptes de cr\u00E9dit (cartes de cr\u00E9dit, pr\u00EAts) peuvent \u00EAtre n\u00E9gatifs. Le solde de d\u00E9part de chaque compte est inclus.
REPORT_INFO_BALANCES_OVER_TIME_TITLE=Soldes des comptes au fil du temps
REPORT_INFO_BUDGET_VS_ACTUAL_BODY=Compare votre montant budg\u00E9tis\u00E9 aux d\u00E9penses r\u00E9elles pour chaque cat\u00E9gorie de d\u00E9penses sur la p\u00E9riode s\u00E9lectionn\u00E9e.\n\nCalcul\u00A0: les montants budg\u00E9taires proviennent des entr\u00E9es budg\u00E9taires de cat\u00E9gorie pour la p\u00E9riode. Les montants r\u00E9els sont la somme de tous les fractionnements de transactions attribu\u00E9s \u00E0 chaque cat\u00E9gorie. Les deux sont affich\u00E9s sous forme de barres c\u00F4te \u00E0 c\u00F4te.\n\nHypoth\u00E8ses\u00A0: seules les cat\u00E9gories de d\u00E9penses avec une entr\u00E9e budg\u00E9taire ou des transactions r\u00E9elles sont affich\u00E9es. Les cat\u00E9gories de revenus sont exclues. Si une cat\u00E9gorie n\u2019a pas de budget d\u00E9fini, sa barre budg\u00E9taire sera nulle.
REPORT_INFO_BUDGET_VS_ACTUAL_TITLE=Budget vs r\u00E9el
REPORT_INFO_CATEGORY_DRILLDOWN_BODY=Affiche la tendance des d\u00E9penses mois par mois pour une seule cat\u00E9gorie s\u00E9lectionn\u00E9e sur l'intervalle choisi.\n\nCalcul\u00A0: toutes les r\u00E9partitions de transactions affect\u00E9es \u00E0 la cat\u00E9gorie s\u00E9lectionn\u00E9e (ou \u00E0 l'une de ses sous-cat\u00E9gories) sont additionn\u00E9es par mois civil et trac\u00E9es sous forme de graphique lin\u00E9aire.\n\nHypoth\u00E8ses\u00A0: les sous-cat\u00E9gories sont incluses dans le total. Seule la cat\u00E9gorie s\u00E9lectionn\u00E9e est affich\u00E9e : utilisez plusieurs onglets pour comparer les cat\u00E9gories c\u00F4te \u00E0 c\u00F4te.
REPORT_INFO_CATEGORY_DRILLDOWN_TITLE=Analyse d\u00E9taill\u00E9e des cat\u00E9gories
REPORT_INFO_DEBT_PAYDOWN_BODY=Suit le solde de vos comptes de cr\u00E9dit et de pr\u00EAt au fil du temps pour visualiser les progr\u00E8s de la r\u00E9duction de la dette.\n\nCalcul\u00A0: toutes les r\u00E9partitions de transactions impliquant des comptes de type cr\u00E9dit sont relues par ordre de date pour produire un solde courant pour chaque compte de cr\u00E9dit. Un point de donn\u00E9es est \u00E9mis par semaine.\n\nHypoth\u00E8ses\u00A0: seuls les comptes de type cr\u00E9dit (cartes de cr\u00E9dit, marges de cr\u00E9dit, pr\u00EAts) sont affich\u00E9s. Les soldes sont affich\u00E9s sous forme de nombres n\u00E9gatifs\u00A0: une ligne tendant vers z\u00E9ro signifie que la dette est en cours de remboursement. Les comptes de d\u00E9bit (ch\u00E8ques, \u00E9pargne) sont exclus.
REPORT_INFO_DEBT_PAYDOWN_TITLE=Suivi du remboursement des dettes
REPORT_INFO_INCOME_EXPENSES_BODY=Un tableau d\u00E9taill\u00E9 comparant les totaux des revenus et des d\u00E9penses pour chaque cat\u00E9gorie sur la p\u00E9riode s\u00E9lectionn\u00E9e.\n\nCalcul\u00A0: les r\u00E9partitions sont regroup\u00E9es par cat\u00E9gorie. Les cat\u00E9gories de revenus indiquent les entr\u00E9es totales\u00A0; les cat\u00E9gories de d\u00E9penses montrent les sorties totales. Les lignes peuvent \u00EAtre d\u00E9velopp\u00E9es pour afficher des transactions individuelles.\n\nHypoth\u00E8ses\u00A0: seule la p\u00E9riode en cours est affich\u00E9e. Les virements entre comptes n'apparaissent pas.
REPORT_INFO_INCOME_EXPENSES_TITLE=Revenus et d\u00E9penses par cat\u00E9gorie
REPORT_INFO_INFLOW_ACCOUNT_BODY=Affiche le montant total des flux entrants et sortants de chaque compte au cours de la p\u00E9riode s\u00E9lectionn\u00E9e.\n\nCalcul\u00A0: pour chaque compte, toutes les r\u00E9partitions pour lesquelles ce compte est la destination sont additionn\u00E9es comme entr\u00E9es\u00A0; toutes les r\u00E9partitions dont il s'agit de la source sont additionn\u00E9es en tant que sorties.\n\nHypoth\u00E8ses\u00A0: les transferts entre vos propres comptes apparaissent \u00E0 la fois comme une entr\u00E9e vers un compte et comme une sortie d'un autre, ils s'annulent donc au niveau de la valeur nette.
REPORT_INFO_INFLOW_ACCOUNT_TITLE=Entr\u00E9es et sorties par compte
REPORT_INFO_INFLOW_PAYEE_BODY=Classe les b\u00E9n\u00E9ficiaires (descriptions des transactions) en fonction de leurs entr\u00E9es et sorties totales sur la p\u00E9riode s\u00E9lectionn\u00E9e.\n\nCalcul\u00A0: les transactions sont regroup\u00E9es par description (nom du b\u00E9n\u00E9ficiaire). Toutes les r\u00E9partitions au sein de chaque transaction sont additionn\u00E9es en entr\u00E9es ou sorties en fonction du signe.\n\nHypoth\u00E8ses\u00A0:\u00A0la correspondance des b\u00E9n\u00E9ficiaires est exacte\u00A0: le m\u00EAme b\u00E9n\u00E9ficiaire avec une orthographe l\u00E9g\u00E8rement diff\u00E9rente appara\u00EEtra sous forme d'entr\u00E9es distinctes. Les noms crypt\u00E9s sont d\u00E9chiffr\u00E9s \u00E0 des fins d'affichage uniquement.
REPORT_INFO_INFLOW_PAYEE_TITLE=Entr\u00E9es et sorties par b\u00E9n\u00E9ficiaire
REPORT_INFO_MONTHLY_CASH_FLOW_BODY=Affiche le revenu total, le total des d\u00E9penses et le flux de tr\u00E9sorerie net (revenus moins d\u00E9penses) pour chaque mois de la p\u00E9riode s\u00E9lectionn\u00E9e.\n\nCalcul\u00A0: les r\u00E9partitions sont regroup\u00E9es par mois civil. Les fractionnements de revenu (d'une cat\u00E9gorie de type Revenu) sont additionn\u00E9s comme revenu\u00A0; les r\u00E9partitions de d\u00E9penses (dans une cat\u00E9gorie de type D\u00E9pense) sont additionn\u00E9es en tant que d\u00E9penses. Net = Revenu \u2212 D\u00E9penses.\n\nHypoth\u00E8ses\u00A0: les transferts entre comptes sont exclus. Une barre nette positive signifie que vous avez d\u00E9pens\u00E9 moins que ce que vous avez gagn\u00E9 ce mois-l\u00E0\u00A0; n\u00E9gatif signifie que vous avez trop d\u00E9pens\u00E9.
REPORT_INFO_MONTHLY_CASH_FLOW_TITLE=Flux de tr\u00E9sorerie mensuel
REPORT_INFO_NET_WORTH_BODY=Trace votre valeur nette totale (somme de tous les soldes de compte) sur la p\u00E9riode s\u00E9lectionn\u00E9e sur une seule ligne.\n\nCalcul\u00A0: identique \u00E0 celui des soldes de compte au fil du temps, mais tous les soldes de compte sont additionn\u00E9s en une seule valeur de valeur nette \u00E0 chaque point de donn\u00E9es hebdomadaire.\n\nHypoth\u00E8ses\u00A0: tous les comptes sont inclus\u00A0: les actifs (ch\u00E8ques, \u00E9pargnes, placements) s'ajoutent \u00E0 la valeur nette\u00A0; les passifs (cartes de cr\u00E9dit, pr\u00EAts) sont soustraits. Les comptes sans transaction au cours de la p\u00E9riode contribuent toujours \u00E0 leur solde.
REPORT_INFO_NET_WORTH_TITLE=Valeur nette au fil du temps
REPORT_INFO_PIE_EXPENSES_BODY=Affiche la proportion des d\u00E9penses totales attribu\u00E9es \u00E0 chaque cat\u00E9gorie de d\u00E9penses de niveau sup\u00E9rieur sur la p\u00E9riode s\u00E9lectionn\u00E9e.\n\nCalcul\u00A0: toutes les r\u00E9partitions de transactions dont la destination est une cat\u00E9gorie de d\u00E9penses sont additionn\u00E9es. Le total de chaque cat\u00E9gorie est exprim\u00E9 en pourcentage des d\u00E9penses globales. Les sous-cat\u00E9gories sont regroup\u00E9es dans leur parent.\n\nHypoth\u00E8ses\u00A0: les transferts entre comptes sont exclus. Seuls les fractionnements avec une destination de type D\u00E9pense sont comptabilis\u00E9s.
REPORT_INFO_PIE_EXPENSES_TITLE=Depenses par categorie (camembert)
REPORT_INFO_PIE_INCOME_BODY=Affiche la proportion du revenu total contribu\u00E9 par chaque cat\u00E9gorie de revenu de niveau sup\u00E9rieur sur la p\u00E9riode s\u00E9lectionn\u00E9e.\n\nCalcul\u00A0: toutes les r\u00E9partitions de transactions dont la source est une cat\u00E9gorie de revenu sont additionn\u00E9es. Le total de chaque cat\u00E9gorie est exprim\u00E9 en pourcentage du revenu global. Seules les cat\u00E9gories de niveau sup\u00E9rieur sont affich\u00E9es\u00A0; les sous-cat\u00E9gories sont regroup\u00E9es dans leur parent.\n\nHypoth\u00E8ses\u00A0: les transferts entre comptes sont exclus. Seuls les fractionnements avec une source de type Revenu sont comptabilis\u00E9s.
REPORT_INFO_PIE_INCOME_TITLE=Revenus par categorie (camembert)
REPORT_INFO_PROJECTED_BALANCE_BODY=Pr\u00E9voit l'\u00E9volution des soldes de vos comptes au cours des N prochains jours en fonction de vos habitudes de d\u00E9penses historiques.\n\nCalcul\u00A0: les 12\u00A0derniers mois de transactions sont analys\u00E9s pour calculer une variation nette mensuelle moyenne pour chaque compte. \u00C0 partir du solde r\u00E9el d'aujourd'hui, cette moyenne est appliqu\u00E9e au 1er de chaque mois projet\u00E9. Un instantan\u00E9 hebdomadaire est trac\u00E9 pour chaque compte actif.\n\nHypoth\u00E8ses\u00A0: seuls les comptes dont la variation mensuelle moyenne est sup\u00E9rieure \u00E0 1\u00A0$ sont affich\u00E9s (les comptes d'investissement statiques sont masqu\u00E9s). La projection suppose que l\u2019avenir ressemblera \u00E0 la moyenne des 12 derniers mois : elle ne tient pas compte des transactions importantes ponctuelles, des variations saisonni\u00E8res ou des changements dans les habitudes de d\u00E9penses.
REPORT_INFO_PROJECTED_BALANCE_TITLE=Solde projet\u00E9
REPORT_INFO_SAVINGS_RATE_BODY=Affiche le pourcentage de vos revenus que vous avez \u00E9pargn\u00E9 chaque mois sur la p\u00E9riode s\u00E9lectionn\u00E9e.\n\nCalcul\u00A0: Taux d'\u00E9pargne % = (Revenus \u2212 D\u00E9penses) / Revenu \u00D7 100, calcul\u00E9 par mois civil. Trac\u00E9 sous forme de graphique lin\u00E9aire.\n\nHypoth\u00E8ses\u00A0:\u00A0les mois sans revenu sont ignor\u00E9s pour \u00E9viter une division par z\u00E9ro. Un taux sup\u00E9rieur \u00E0 0 % signifie que vous avez \u00E9conomis\u00E9 de l\u2019argent ; en dessous de 0\u00A0% signifie que vous avez d\u00E9pens\u00E9 plus que ce que vous avez gagn\u00E9. Les virements entre comptes sont exclus.
REPORT_INFO_SAVINGS_RATE_TITLE=Taux d'\u00E9pargne
REPORT_INFO_TOP_PAYEES_BODY=Classe vos principaux b\u00E9n\u00E9ficiaires (descriptions de transactions) par d\u00E9penses totales sur la p\u00E9riode s\u00E9lectionn\u00E9e, sous forme de graphique \u00E0 barres horizontales.\n\nCalcul\u00A0: toutes les r\u00E9partitions de d\u00E9penses sont regroup\u00E9es par description de transaction (b\u00E9n\u00E9ficiaire). Les totaux sont tri\u00E9s par ordre d\u00E9croissant. Chaque barre indique \u00E9galement le pourcentage du b\u00E9n\u00E9ficiaire dans les d\u00E9penses totales pour la p\u00E9riode.\n\nHypoth\u00E8ses\u00A0: seules les sorties vers les cat\u00E9gories de type D\u00E9pense sont prises en compte\u00A0; les revenus et les transferts sont exclus. Les noms des b\u00E9n\u00E9ficiaires doivent correspondre exactement\u00A0; de l\u00E9g\u00E8res diff\u00E9rences orthographiques cr\u00E9ent des entr\u00E9es distinctes.
REPORT_INFO_TOP_PAYEES_TITLE=Principaux b\u00E9n\u00E9ficiaires par d\u00E9pense
REPORT_INFO_YEAR_OVER_YEAR_BODY=Compare les d\u00E9penses et les revenus par cat\u00E9gorie entre deux p\u00E9riodes cons\u00E9cutives de m\u00EAme dur\u00E9e (par exemple, cette ann\u00E9e et l'ann\u00E9e derni\u00E8re).\n\nCalcul\u00A0: L'intervalle s\u00E9lectionn\u00E9 d\u00E9finit la p\u00E9riode "en cours". Le serveur calcule automatiquement la p\u00E9riode ant\u00E9rieure \u00E9quivalente de m\u00EAme dur\u00E9e. Les totaux des cat\u00E9gories des deux p\u00E9riodes sont affich\u00E9s sous forme de barres c\u00F4te \u00E0 c\u00F4te.\n\nHypoth\u00E8ses\u00A0: la p\u00E9riode pr\u00E9c\u00E9dente a toujours la m\u00EAme dur\u00E9e que la p\u00E9riode s\u00E9lectionn\u00E9e, d\u00E9cal\u00E9e en arri\u00E8re d'exactement une longueur de p\u00E9riode. Les cat\u00E9gories sans activit\u00E9 au cours des deux p\u00E9riodes sont exclues.
REPORT_INFO_YEAR_OVER_YEAR_TITLE=Comparaison des p\u00E9riodes c\u00F4te \u00E0 c\u00F4te
