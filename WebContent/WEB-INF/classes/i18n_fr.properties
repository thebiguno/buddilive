HELP_ACCOUNT_EDITOR_ACCOUNT_TYPE=La cat\u00E9gorisation de haut niveau du compte.  Il s\u2019agit d\u2019une \u00E9tiquette de forme libre qui permet de regrouper des comptes similaires.  Les exemples incluent \u00AB Ch\u00E8ques \u00BB, \u00AB \u00C9pargne \u00BB, \u00AB Cartes de cr\u00E9dit \u00BB, etc.
HELP_ACCOUNT_EDITOR_NAME=Le nom du compte.  Il doit s'agir d'un nom descriptif qui identifie le compte de mani\u00E8re unique.  Des exemples de noms de compte sont \u00AB ABC Savings \u00BB, \u00AB Visa Premium \u00BB, \u00AB Cash in Wallet \u00BB, etc.
HELP_ACCOUNT_EDITOR_STARTING_BALANCE=Le solde de d\u00E9part est le montant d\u2019argent sur le compte lors de sa premi\u00E8re saisie dans Buddi.  Ce montant ne doit g\u00E9n\u00E9ralement pas \u00EAtre modifi\u00E9 apr\u00E8s la configuration initiale.
HELP_ACCOUNT_EDITOR_TYPE=Si ce compte est un compte \u00AB\u00A0D\u00E9bit\u00A0\u00BB ou \u00AB\u00A0Cr\u00E9dit\u00A0\u00BB.  Les comptes de d\u00E9bit sont destin\u00E9s aux comptes qui contiennent de l'argent\u00A0: des \u00E9l\u00E9ments tels que des \u00E9conomies, des ch\u00E8ques, de l'argent dans un portefeuille, etc. Les comptes de cr\u00E9dit sont destin\u00E9s aux comptes qui doivent de l'argent\u00A0: des \u00E9l\u00E9ments tels que des cartes de cr\u00E9dit, des pr\u00EAts, etc.
HELP_BUDGET_CATEGORY_NAME=C'est le nom d'un groupe de transactions courantes.  Par exemple, une cat\u00E9gorie nomm\u00E9e \u00AB\u00A0\u00C9picerie\u00A0\u00BB pourrait suivre les achats de nourriture\u00A0; une cat\u00E9gorie nomm\u00E9e \u00AB M\u00E9nage \u00BB pour suivre diverses d\u00E9penses du m\u00E9nage telles que les meubles et les simples r\u00E9parations domiciliaires ; et une cat\u00E9gorie nomm\u00E9e \u00AB Salaire \u00BB pourrait suivre les revenus d'un salaire mensuel.<br/>Pour regrouper des ensembles communs de cat\u00E9gories, veuillez vous r\u00E9f\u00E9rer \u00E0 la fonctionnalit\u00E9 \u00AB Cat\u00E9gorie parent \u00BB ci-dessous.
HELP_BUDGET_CATEGORY_PARENT=Une cat\u00E9gorie parent peut \u00EAtre utilis\u00E9e pour regrouper des cat\u00E9gories budg\u00E9taires associ\u00E9es.  Par exemple, supposons qu'il existe une cat\u00E9gorie nomm\u00E9e \u00AB\u00A0D\u00E9penses automobiles\u00A0\u00BB.  D'autres cat\u00E9gories pourraient ensuite \u00EAtre ajout\u00E9es : \u00AB Carburant \u00BB, \u00AB Assurance automobile \u00BB et \u00AB Entretien et r\u00E9parations \u00BB, toutes avec la cat\u00E9gorie parent \u00AB D\u00E9penses automobiles \u00BB.  Une fois compl\u00E9t\u00E9es, ces trois cat\u00E9gories appara\u00EEtront sous la cat\u00E9gorie parent \u00AB\u00A0D\u00E9penses automobiles\u00A0\u00BB.
HELP_BUDGET_CATEGORY_PERIOD_TYPE=La p\u00E9riode budg\u00E9taire \u00E0 affecter \u00E0 la cat\u00E9gorie budg\u00E9taire.  Une \u00AB\u00A0p\u00E9riode budg\u00E9taire\u00A0\u00BB est une plage r\u00E9p\u00E9titive de dates pour laquelle vous attribuez un montant dans votre budget\u00A0; par exemple, une cat\u00E9gorie budg\u00E9taire destin\u00E9e au suivi des taxes fonci\u00E8res mensuelles doit se voir attribuer un type de p\u00E9riode \u00AB\u00A0Mois\u00A0\u00BB.
HELP_BUDGET_CATEGORY_TYPE=Pr\u00E9cisez cette valeur selon que la cat\u00E9gorie budg\u00E9taire repr\u00E9sente des transactions de revenus ou de d\u00E9penses.  Des exemples de cat\u00E9gories de revenus pourraient inclure \u00AB Salaire \u00BB, \u00AB Bonus \u00BB, \u00AB Cadeaux re\u00E7us \u00BB, etc. Des exemples de cat\u00E9gories de d\u00E9penses pourraient inclure \u00AB \u00C9picerie \u00BB, \u00AB R\u00E9paration de voiture \u00BB, \u00AB Loyer \u00BB, etc.
HELP_CLEAR_TRANSACTION=Efface tous les champs de l'\u00E9diteur de transactions et d\u00E9s\u00E9lectionne toute transaction s\u00E9lectionn\u00E9e (le cas \u00E9ch\u00E9ant).
HELP_CURRENCY=La devise utilis\u00E9e pour toutes les transactions.  Ceci sera affich\u00E9 en fonction des param\u00E8tres r\u00E9gionaux sp\u00E9cifi\u00E9s.
HELP_DATE_FORMAT=Cela peut remplacer le format de date par d\u00E9faut pour les param\u00E8tres r\u00E9gionaux s\u00E9lectionn\u00E9s.  Laissez cette valeur sur \u00AB\u00A0Utiliser les param\u00E8tres r\u00E9gionaux par d\u00E9faut\u00A0\u00BB pour utiliser le format de date pour les param\u00E8tres r\u00E9gionaux sp\u00E9cifi\u00E9s.
HELP_SHOW_DELETED=Afficher les comptes et categories de budget supprimes dans les listes et selecteurs.
HELP_DELETE_DATA=Si cette option est s\u00E9lectionn\u00E9e, toutes les donn\u00E9es existantes seront supprim\u00E9es avant la restauration.  Il n'y a aucun moyen d'annuler cette action.  Notez que la restauration sur des donn\u00E9es existantes ne dupliquera pas tout : la proc\u00E9dure de restauration ajoute uniquement les nouveaut\u00E9s dans le fichier de sauvegarde.
HELP_DELETE_TRANSACTION=Supprime la transaction actuellement s\u00E9lectionn\u00E9e
HELP_ENCRYPT_DATA_PASSWORD=Pour modifier les parametres de chiffrement, saisissez votre mot de passe de connexion actuel.
HELP_ENCRYPT_DATA=Cette option determine si ce compte et ses donnees sensibles sont chiffres. Si elle est activee, Buddi Live chiffre certains champs, notamment les noms de comptes et de categories budgetaires, ainsi que les descriptions de transactions.<br/><br/>Attention : il n'existe aucune porte derobee pour ce chiffrement. En activant le chiffrement, la reinitialisation du mot de passe n'est plus possible et, si le mot de passe est perdu, les donnees deviennent definitivement irrecuperables.<br/><br/>Pour plus de details, consultez la <a href='doc/encryption.html' target='_blank'>page d'information sur le chiffrement Buddi Live</a>.
HELP_END_DATE=Utilis\u00E9 avec le s\u00E9lecteur d'intervalle \u00AB\u00A0Autre\u00A0\u00BB.  Date de fin de l'intervalle de rapport.
HELP_GETTING_STARTED_TITLE=Premiers pas
HELP_GETTING_STARTED=<b>Bienvenue sur Buddi Live !</b><br/><br/>Si vous utilisez deja Buddi sur ordinateur, vous pouvez exporter vos transactions via Fichier &rarr; Exporter &rarr; Exporter les donnees Buddi Live. Pour importer ce fichier dans Buddi Live, ouvrez Systeme &rarr; Restaurer et selectionnez le fichier .json cree lors de l'export.<br/><br/>Si vous decouvrez Buddi, vous pouvez <a href='doc/tutorial.html' target='_blank'>consulter le tutoriel</a> pour vous aider a demarrer.<br/><br/>Pour activer le chiffrement ou modifier la langue et les formats, ouvrez Systeme &rarr; Preferences.<br/><br/>Ce message s'affiche a chaque demarrage tant qu'aucun compte n'a ete ajoute. Vous pouvez l'afficher a nouveau via Systeme &rarr; Premiers pas.
HELP_INTERVAL_PICKER=L'intervalle de dates \u00E0 utiliser pour ce rapport.  Choisissez un intervalle pr\u00E9d\u00E9fini ou entrez une date de d\u00E9but/fin personnalis\u00E9e.
HELP_LOCALE=La langue/le pays utilis\u00E9 pour les localisations.  Les localisations incluent la langue, le formatage du symbole mon\u00E9taire, le formatage par d\u00E9faut de la date et des chiffres, etc.
HELP_RECORD_UPDATE_TRANSACTION=Enregistrez (ou mettez \u00E0 jour) la transaction actuellement s\u00E9lectionn\u00E9e.  Appuyez sur Ctrl + Entr\u00E9e lors de la modification de la transaction en tant que raccourci.
HELP_REGISTER_2=Veuillez v\u00E9rifier votre courrier \u00E9lectronique pour une cl\u00E9 d'activation.  Une fois arriv\u00E9, copiez-le ici, s\u00E9lectionnez un mot de passe et cliquez sur "Cr\u00E9er un compte".<br/><br/>Apr\u00E8s avoir cr\u00E9\u00E9 le compte, vous pouvez vous connecter avec votre adresse e-mail et votre mot de passe.
HELP_REGISTER=Veuillez saisir une adresse e-mail valide et cliquez sur \u00AB\u00A0G\u00E9n\u00E9rer la cl\u00E9\u00A0\u00BB.
HELP_REPEATING_BIWEEKLY=Configurez cette transaction pour qu'elle se r\u00E9p\u00E8te toutes les deux semaines le jour sp\u00E9cifi\u00E9 de la semaine.
HELP_REPEATING_EVERY_X_DAYS=Configurez cette transaction pour qu'elle se r\u00E9p\u00E8te apr\u00E8s le nombre de jours sp\u00E9cifi\u00E9.  Cette valeur doit \u00EAtre sup\u00E9rieure \u00E0 0.
HELP_REPEATING_MONTHLY_BY_DAY_OF_WEEK=Configurez cette transaction pour qu'elle se r\u00E9p\u00E8te chaque mois le jour sp\u00E9cifi\u00E9 de la semaine.
HELP_REPEATING_MONTHLY=Configurez cette transaction pour qu'elle se r\u00E9p\u00E8te chaque mois le jour sp\u00E9cifi\u00E9 du mois.  Gardez \u00E0 l\u2019esprit que seuls certains mois comptent 31 jours ; utilisez \u00AB\u00A0Dernier jour\u00A0\u00BB pour ajuster automatiquement les mois plus courts.
HELP_REPEATING_MULTIPLE_MONTHS_EVERY_YEAR=Configurez cette transaction pour qu'elle se r\u00E9p\u00E8te le jour sp\u00E9cifi\u00E9 du mois, les mois sp\u00E9cifi\u00E9s de l'ann\u00E9e.
HELP_REPEATING_MULTIPLE_WEEKS_EVERY_MONTH=Configurez cette transaction pour qu'elle se r\u00E9p\u00E8te le jour sp\u00E9cifi\u00E9 de la semaine, les semaines sp\u00E9cifi\u00E9es dans le mois.
HELP_REPEATING_WEEKLY=Configurez cette transaction pour qu'elle se r\u00E9p\u00E8te chaque semaine le jour sp\u00E9cifi\u00E9 de la semaine.
HELP_RESET_PASSWORD_2=Une fois la cl\u00E9 d'activation arriv\u00E9e dans votre e-mail, veuillez la copier ici et choisir un nouveau mot de passe.<br/><br/>Si votre compte est crypt\u00E9, il n'y a aucun moyen de r\u00E9cup\u00E9rer votre mot de passe et vous ne recevrez pas la cl\u00E9 d'activation.
HELP_RESET_PASSWORD=Entrez votre adresse e-mail de connexion pour recevoir une cl\u00E9 temporaire pour r\u00E9initialiser votre mot de passe.<br/><br/>Vous ne pouvez r\u00E9initialiser votre mot de passe que si vous n'avez pas activ\u00E9 le cryptage.  Si votre compte est crypt\u00E9, il n'y a aucun moyen de r\u00E9cup\u00E9rer votre mot de passe et vous ne recevrez pas la cl\u00E9 d'activation.
HELP_RESTORE_FILE=T\u00E9l\u00E9chargez un fichier pr\u00E9c\u00E9demment enregistr\u00E9 par Buddi Live ou un fichier export\u00E9 vers Buddi Live \u00E0 partir de la version de bureau de Buddi.  Ce fichier a g\u00E9n\u00E9ralement une extension .json et s'il est g\u00E9n\u00E9r\u00E9 \u00E0 partir de Buddi Live, il sera appel\u00E9 \u00AB\u00A0backup.json\u00A0\u00BB.
HELP_SCHEDULED_TRANSACTION_END_DATE=Le jour o\u00F9 cette transaction programm\u00E9e doit s'arr\u00EAter.  Laissez ce champ vide pour ne jamais planifier de date d'arr\u00EAt (cela peut \u00EAtre modifi\u00E9 ult\u00E9rieurement si vous le souhaitez).
HELP_SCHEDULED_TRANSACTION_MESSAGE=Un message \u00E0 afficher lorsque la transaction planifi\u00E9e a \u00E9t\u00E9 d\u00E9clench\u00E9e.  Le message s'affiche lors de la connexion.  Laissez ce champ vide pour ne rien afficher.
HELP_SCHEDULED_TRANSACTION_NAME=Le nom de la transaction planifi\u00E9e.  Cela doit \u00EAtre suffisamment descriptif pour identifier ce que fait la transaction planifi\u00E9e.  Quelques exemples pourraient inclure \u00AB\u00A0Transfert mensuel vers l'\u00E9pargne\u00A0\u00BB, \u00AB\u00A0Allocation personnelle\u00A0\u00BB, etc.
HELP_SCHEDULED_TRANSACTION_REPEAT=Choisissez une fr\u00E9quence pour r\u00E9p\u00E9ter cette transaction planifi\u00E9e.  Selon l'horaire choisi, diff\u00E9rentes options peuvent \u00EAtre pr\u00E9sent\u00E9es ci-dessous.
HELP_SCHEDULED_TRANSACTION_START_DATE=Le jour auquel cette transaction planifi\u00E9e doit commencer.
HELP_SCHEDULED_TRANSACTION_TRANSACTION=La transaction qui sera automatiquement ajout\u00E9e selon le calendrier sp\u00E9cifi\u00E9.  Au minimum, pr\u00E9cisez la description, le montant et les sources de/vers.
HELP_START_DATE=Utilis\u00E9 avec le s\u00E9lecteur d'intervalle \u00AB\u00A0Autre\u00A0\u00BB.  Date de d\u00E9but de l'intervalle de rapport.
HELP_STORE_EMAIL=Cette option determine si Buddi Live enregistre votre identifiant de connexion / adresse email sous une forme recuperable.<br/><br/>Si l'adresse email est recuperable, cela permet l'envoi d'emails systeme. Si vous preferez un maximum de confidentialite, laissez cette option desactivee.<br/><br/>Pour plus de details sur le stockage des donnees dans Buddi Live, consultez la <a href='doc/encryption.html' target='_blank'>page d'information sur le chiffrement Buddi Live</a>.
HELP_TIMEZONE=Le fuseau horaire local.  Ceci est utilis\u00E9 pour ex\u00E9cuter des transactions planifi\u00E9es \u00E0 minuit, heure locale.  Si un fuseau horaire donn\u00E9 doit prendre en charge l'heure d'\u00E9t\u00E9, choisissez l'entr\u00E9e \u00AB\u00A0Daylight\u00A0\u00BB au lieu de celle \u00AB\u00A0Standard\u00A0\u00BB (par exemple, \u00AB\u00A0Mountain Daylight Time\u00A0\u00BB changera automatiquement l'heure d'\u00E9t\u00E9, tandis que \u00AB Mountain Standard Time\u00A0\u00BB ne changera pas pour l'heure d'\u00E9t\u00E9).
HELP_USE_TWO_FACTOR=Utilisez l'authentification a deux facteurs. Apres configuration avec une application d'authentification, vous devrez saisir un code a 6 chiffres a la connexion.
