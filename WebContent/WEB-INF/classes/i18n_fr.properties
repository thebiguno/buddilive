CONFIRM_CHANGE_EXISTING_TRANSACTION_TITLE=Modifier une transaction existante
CONFIRM_CHANGE_EXISTING_TRANSACTION=Vous modifiez les attributs principaux d'une transaction existante.  \u00CAtes-vous s\u00FBr de vouloir faire cela\u00A0?  Cliquez sur \u00AB Oui \u00BB pour continuer ou cliquez sur \u00AB Non \u00BB pour annuler.<br/><br/>Si vous souhaitez plut\u00F4t ajouter une nouvelle transaction, veuillez cliquer sur le bouton \u00AB Effacer \u00BB avant d'ajouter une nouvelle transaction.<br/>
CONFIRM_DATE_OUT_OF_RANGE_AFTER=La date sp\u00E9cifi\u00E9e est plus d'un mois dans le futur.  Etes-vous s\u00FBr que c'est correct ?  Cliquez sur \u00AB\u00A0Oui\u00A0\u00BB pour continuer avec cette date, ou cliquez sur \u00AB\u00A0Non\u00A0\u00BB pour annuler.
CONFIRM_DATE_OUT_OF_RANGE_BEFORE=La date indiqu\u00E9e date d'il y a plus d'un an.  Etes-vous s\u00FBr que c'est correct ?  Cliquez sur \u00AB\u00A0Oui\u00A0\u00BB pour continuer avec cette date, ou cliquez sur \u00AB\u00A0Non\u00A0\u00BB pour annuler.
CONFIRM_DATE_OUT_OF_RANGE_TITLE=Date hors plage
CONFIRM_DELETE_ACCOUNT=\u00CAtes-vous s\u00FBr de vouloir supprimer ce compte\u00A0?<br/>Si des transactions y sont associ\u00E9es, le compte sera uniquement marqu\u00E9 comme supprim\u00E9 (et pourra \u00EAtre restaur\u00E9 ult\u00E9rieurement si vous le souhaitez).<br/>S'il n'y a aucune transaction, le compte sera d\u00E9finitivement supprim\u00E9.
CONFIRM_DELETE_CATEGORY=\u00CAtes-vous s\u00FBr de vouloir supprimer cette cat\u00E9gorie budg\u00E9taire\u00A0?<br/>Si des transactions y sont associ\u00E9es, la cat\u00E9gorie sera uniquement marqu\u00E9e comme supprim\u00E9e (et pourra \u00EAtre restaur\u00E9e ult\u00E9rieurement si vous le souhaitez).<br/>S'il n'y a aucune transaction, la cat\u00E9gorie sera d\u00E9finitivement supprim\u00E9e.
CONFIRM_DELETE_DATA=La case \u00AB\u00A0Supprimer les donn\u00E9es\u00A0\u00BB est coch\u00E9e et toutes les donn\u00E9es existantes seront supprim\u00E9es avant de restaurer la sauvegarde.  Il n'y a aucun moyen d'annuler cette action.  \u00CAtes-vous s\u00FBr de vouloir continuer\u00A0?
CONFIRM_DELETE_SCHEDULED=\u00CAtes-vous s\u00FBr de vouloir supprimer cette transaction planifi\u00E9e\u00A0?  Une fois supprim\u00E9es, les transactions ne seront plus cr\u00E9\u00E9es automatiquement.  Les transactions existantes qui ont d\u00E9j\u00E0 \u00E9t\u00E9 ajout\u00E9es resteront.
CONFIRM_DELETE_TRANSACTION=\u00CAtes-vous s\u00FBr de vouloir supprimer cette transaction\u00A0?  Il n'y a aucun moyen d'annuler cette action.
CONFIRM_DELETE_USER=En supprimant votre compte utilisateur, vous ne pourrez plus vous connecter \u00E0 Buddi Live et toutes les donn\u00E9es pr\u00E9c\u00E9demment saisies seront d\u00E9finitivement perdues.<br/><br/>Il est fortement recommand\u00E9 de t\u00E9l\u00E9charger une sauvegarde de vos donn\u00E9es avant de supprimer votre compte ; cela vous permettra de restaurer les donn\u00E9es si vous ouvrez un nouveau compte.<br/><br/>Voulez-vous vraiment supprimer votre compte utilisateur Buddi Live\u00A0?  Cliquez sur \u00AB Oui \u00BB pour supprimer d\u00E9finitivement le compte ou cliquez sur \u00AB Non \u00BB pour annuler.<br/>
CONFIRM_DELETE_USER2=\u00CAtes-vous s\u00FBr de vouloir supprimer votre compte utilisateur et toutes les donn\u00E9es du syst\u00E8me\u00A0?  Cette action ne peut pas \u00EAtre annul\u00E9e.<br/><br/>Cliquez sur \u00AB Oui \u00BB pour supprimer d\u00E9finitivement votre compte utilisateur Buddi Live, ou cliquez sur \u00AB Non \u00BB pour annuler.<br/>
COOKIES_USED_MESSAGE=Buddi Live utilise des cookies pour permettre aux utilisateurs de se connecter. Ainsi, les cookies sont n\u00E9cessaires pour utiliser ce site Web.<br/><br/>En cliquant sur Oui, vous acceptez que ce site Web puisse enregistrer des cookies sur votre navigateur.<br/><br/>Pour plus d'informations, veuillez consulter les <a href='doc/termsandconditions.html'>Conditions g\u00E9n\u00E9rales</a>.
COPY_FROM_PREVIOUS_BUDGET_PERIOD_TOOLTIP=Copier les \u00E9critures budg\u00E9taires de la p\u00E9riode budg\u00E9taire pr\u00E9c\u00E9dente vers la p\u00E9riode budg\u00E9taire actuelle
