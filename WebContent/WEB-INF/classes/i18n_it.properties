REPORT_INFO_AVG_INCOME_EXPENSES_BODY=Mostra l'importo medio mensile delle entrate e delle spese per categoria nel periodo selezionato.\n\nCalcolo: gli stessi totali di Entrate e uscite per categoria vengono divisi per il numero di mesi nell'intervallo selezionato per produrre una media mensile.\n\nPresupposti: i mesi parziali all'inizio o alla fine dell'intervallo vengono conteggiati come mesi interi. Utile per identificare il tipico modello di spesa mensile.
REPORT_INFO_AVG_INCOME_EXPENSES_TITLE=Redditi e spese medi per categoria
REPORT_INFO_BALANCES_OVER_TIME_BODY=Traccia il saldo corrente di ciascun conto nel periodo selezionato come grafico a linee.\n\nCalcolo: il server riproduce tutte le transazioni in ordine di data, accumulando un saldo corrente per ciascun conto. Viene emesso un punto dati a settimana (o in date significative).\n\nPresupposti: i saldi vengono visualizzati come archiviati: i conti di debito (assegni, risparmi) sono positivi; i conti attivi (carte di credito, prestiti) possono essere negativi. È incluso il saldo iniziale per ciascun account.
REPORT_INFO_BALANCES_OVER_TIME_TITLE=Saldi dei conti nel tempo
REPORT_INFO_BUDGET_VS_ACTUAL_BODY=Confronta l'importo preventivato con la spesa effettiva per ciascuna categoria di spesa nel periodo selezionato.\n\nCalcolo: gli importi del budget provengono dalle voci del budget della categoria per il periodo. Gli importi effettivi sono la somma di tutte le suddivisioni delle transazioni assegnate a ciascuna categoria. Entrambi vengono visualizzati come barre affiancate.\n\nPresupposti: vengono visualizzate solo le categorie di spesa con una voce di budget o transazioni effettive. Sono escluse le categorie di reddito. Se per una categoria non è impostato un budget, la barra del budget sarà pari a zero.
REPORT_INFO_BUDGET_VS_ACTUAL_TITLE=Budget vs effettivo
REPORT_INFO_CATEGORY_DRILLDOWN_BODY=Mostra l'andamento della spesa mese per mese per una singola categoria selezionata nell'intervallo scelto.\n\nCalcolo: tutte le suddivisioni delle transazioni assegnate alla categoria selezionata (o a una qualsiasi delle sue sottocategorie) vengono sommate per mese di calendario e tracciate come grafico a linee.\n\nPresupposti: le sottocategorie sono incluse nel totale. Viene mostrata solo la categoria selezionata: utilizza più schede per confrontare le categorie una accanto all'altra.
REPORT_INFO_CATEGORY_DRILLDOWN_TITLE=Analisi approfondita delle categorie
REPORT_INFO_DEBT_PAYDOWN_BODY=Tiene traccia del saldo dei tuoi conti di credito e prestito nel tempo per visualizzare i progressi nella riduzione del debito.\n\nCalcolo: tutte le suddivisioni delle transazioni che coinvolgono conti di tipo Credito vengono riprodotte in ordine di data per produrre un saldo corrente per ciascun conto di credito. Viene emesso un punto dati a settimana.\n\nPresupposti: vengono visualizzati solo i conti di tipo Credito (carte di credito, linee di credito, prestiti). I saldi sono mostrati come numeri negativi: una linea che tende verso lo zero significa che il debito viene ripagato. Sono esclusi i conti di debito (assegni, risparmi).
REPORT_INFO_DEBT_PAYDOWN_TITLE=Monitoraggio del pagamento del debito
REPORT_INFO_INCOME_EXPENSES_BODY=Una tabella dettagliata che confronta i totali di entrate e uscite per ciascuna categoria nel periodo selezionato.\n\nCalcolo: le suddivisioni sono raggruppate in base alla categoria. Le categorie di reddito mostrano gli afflussi totali; le categorie di spesa mostrano i deflussi totali. Le righe possono essere espanse per mostrare singole transazioni.\n\nPresupposti: viene mostrato solo il periodo corrente. I trasferimenti tra conti non vengono visualizzati.
REPORT_INFO_INCOME_EXPENSES_TITLE=Entrate e spese per categoria
REPORT_INFO_INFLOW_ACCOUNT_BODY=Mostra il denaro totale in entrata e in uscita da ciascun conto nel periodo selezionato.\n\nCalcolo: per ciascun conto, tutte le suddivisioni in cui quel conto è la destinazione vengono sommate come afflusso; tutte le suddivisioni in cui è l'origine vengono sommate come deflusso.\n\nPresupposti: i trasferimenti tra i tuoi conti appaiono sia come un afflusso verso un conto sia come un deflusso da un altro, quindi si annullano a livello di patrimonio netto.
REPORT_INFO_INFLOW_ACCOUNT_TITLE=Afflussi e deflussi per conto
REPORT_INFO_INFLOW_PAYEE_BODY=Classifica i beneficiari (descrizioni delle transazioni) in base al loro afflusso e deflusso totale nel periodo selezionato.\n\nCalcolo: le transazioni sono raggruppate per descrizione (nome del beneficiario). Tutte le suddivisioni all'interno di ciascuna transazione vengono sommate come afflusso o deflusso a seconda del segno.\n\nPresupposti: la corrispondenza del beneficiario è esatta: lo stesso beneficiario con un'ortografia leggermente diversa verrà visualizzato come voci separate. I nomi crittografati vengono decrittografati solo per la visualizzazione.
REPORT_INFO_INFLOW_PAYEE_TITLE=Afflussi e deflussi per beneficiario
REPORT_INFO_MONTHLY_CASH_FLOW_BODY=Mostra le entrate totali, le spese totali e il flusso di cassa netto (entrate meno spese) per ogni mese nel periodo selezionato.\n\nCalcolo: le suddivisioni sono raggruppate per mese di calendario. Le ripartizioni del reddito (da una categoria di tipo reddito) vengono sommate come reddito; le suddivisioni delle spese (in una categoria di tipo Spesa) vengono sommate come spese. Netto = Entrate − Spese.\n\nIpotesi: i trasferimenti tra conti sono esclusi. Una barra Netta positiva significa che hai speso meno di quanto hai guadagnato quel mese; negativo significa che hai speso troppo.
REPORT_INFO_MONTHLY_CASH_FLOW_TITLE=Flusso di cassa mensile
REPORT_INFO_NET_WORTH_BODY=Traccia il tuo patrimonio netto totale (somma di tutti i saldi dei conti) nel periodo selezionato su un'unica riga.\n\nCalcolo: uguale ai saldi dei conti nel tempo, ma tutti i saldi dei conti vengono sommati in un unico valore del patrimonio netto in ogni punto dati settimanale.\n\nPresupposti: tutti i conti sono inclusi: le risorse (assegni, risparmi, investimenti) si aggiungono al patrimonio netto; le passività (carte di credito, prestiti) si sottraggono. I conti senza transazioni nel periodo contribuiscono comunque con il loro saldo.
REPORT_INFO_NET_WORTH_TITLE=Patrimonio netto nel tempo
REPORT_INFO_PIE_EXPENSES_BODY=Mostra la proporzione della spesa totale attribuita a ciascuna categoria di spesa di livello superiore nel periodo selezionato.\n\nCalcolo: vengono sommate tutte le suddivisioni delle transazioni in cui la destinazione è una categoria di spesa. Il totale di ciascuna categoria è espresso come percentuale della spesa complessiva. Le sottocategorie vengono raggruppate nel relativo genitore.\n\nPresupposti: i trasferimenti tra conti sono esclusi. Vengono conteggiati solo i frazionamenti con destinazione di tipo Spesa.
REPORT_INFO_PIE_EXPENSES_TITLE=Spese per categoria (torta)
REPORT_INFO_PIE_INCOME_BODY=Mostra la proporzione del reddito totale apportato da ciascuna categoria di reddito di livello superiore nel periodo selezionato.\n\nCalcolo: vengono sommate tutte le suddivisioni delle transazioni in cui la fonte è una categoria di reddito. Il totale di ciascuna categoria è espresso come percentuale del reddito complessivo. Vengono visualizzate solo le categorie di livello superiore; le sottocategorie vengono raggruppate nel relativo genitore.\n\nPresupposti: i trasferimenti tra conti sono esclusi. Vengono conteggiati solo i frazionamenti con una fonte di tipo Reddito.
REPORT_INFO_PIE_INCOME_TITLE=Reddito per categoria (torta)
REPORT_INFO_PROJECTED_BALANCE_BODY=Prevede come cambieranno i saldi del tuo conto nei prossimi N giorni in base ai tuoi modelli di spesa storici.\n\nCalcolo: gli ultimi 12 mesi di transazioni vengono analizzati per calcolare una variazione netta mensile media per ciascun conto. A partire dal saldo effettivo di oggi, tale media viene applicata il 1° di ogni mese previsto. Viene tracciata un'istantanea settimanale per ciascun conto attivo.\n\nPresupposti: vengono visualizzati solo i conti con una variazione mensile media superiore a $ 1 (i conti di investimento statici sono nascosti). La proiezione presuppone che il futuro assomiglierà alla media degli ultimi 12 mesi: non tiene conto di grandi transazioni una tantum, variazioni stagionali o cambiamenti nelle abitudini di spesa.
REPORT_INFO_PROJECTED_BALANCE_TITLE=Saldo previsto
REPORT_INFO_SAVINGS_RATE_BODY=Mostra la percentuale del tuo reddito risparmiata ogni mese nel periodo selezionato.\n\nCalcolo: Tasso di risparmio% = (Reddito − Spese) / Reddito × 100, calcolato per mese di calendario. Tracciato come un grafico a linee.\n\nPresupposti: i mesi con reddito pari a zero vengono saltati per evitare la divisione per zero. Un tasso superiore allo 0% significa che hai risparmiato denaro; inferiore allo 0% significa che hai speso più di quanto hai guadagnato. Sono esclusi i trasferimenti tra conti.
REPORT_INFO_SAVINGS_RATE_TITLE=Tasso di risparmio
REPORT_INFO_TOP_PAYEES_BODY=Classifica i principali beneficiari (descrizioni delle transazioni) in base alla spesa totale nel periodo selezionato, mostrato come grafico a barre orizzontale.\n\nCalcolo: tutte le suddivisioni delle spese sono raggruppate in base alla descrizione della transazione (beneficiario). I totali sono ordinati in modo decrescente. Ciascuna barra mostra anche la percentuale della spesa totale del beneficiario per il periodo.\n\nPresupposti: vengono conteggiati solo i deflussi verso le categorie di tipo Spesa: sono esclusi i redditi e i trasferimenti. I nomi dei beneficiari devono corrispondere esattamente; lievi differenze ortografiche creano voci separate.
REPORT_INFO_TOP_PAYEES_TITLE=Principali beneficiari per spesa
REPORT_INFO_YEAR_OVER_YEAR_BODY=Confronta la spesa e il reddito per categoria tra due periodi consecutivi della stessa durata (ad esempio quest'anno rispetto all'anno scorso).\n\nCalcolo: l'intervallo selezionato definisce il periodo "attuale". Il server calcola automaticamente il periodo precedente equivalente della stessa durata. I totali delle categorie di entrambi i periodi vengono visualizzati come barre affiancate.\n\nPresupposti: il periodo precedente ha sempre la stessa durata del periodo selezionato, spostato indietro esattamente di una durata del periodo. Sono escluse le categorie senza attività in nessuno dei due periodi.
REPORT_INFO_YEAR_OVER_YEAR_TITLE=Confronto dei periodi affiancati
