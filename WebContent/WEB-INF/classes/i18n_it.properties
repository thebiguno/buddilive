INFO_LOADING_DELETED_SOURCE=Sembra che tu abbia caricato una transazione che fa riferimento a un conto/categoria cancellato.  Tieni presente che non sarai in grado di modificare questa transazione senza prima cambiare la fonte con una che non sia stata eliminata.<br/><br/>Se desideri modificare questa transazione senza cambiare la fonte da/a, abilita l'opzione "Mostra account e categorie di budget eliminati" in Sistema → Preferenze.<br/>
