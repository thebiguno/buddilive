HELP_ACCOUNT_EDITOR_ACCOUNT_TYPE=La categorizzazione di alto livello dell'account.  Si tratta di un'etichetta a forma libera che consente di raggruppare insieme account simili.  Gli esempi includono "Assegni", "Risparmi", "Carte di credito", ecc.
HELP_ACCOUNT_EDITOR_NAME=Il nome dell'account.  Dovrebbe essere un nome descrittivo che identifichi in modo univoco l'account.  Esempi di nomi di account sono "ABC Savings", "Visa Premium", "Cash in Wallet", ecc.
HELP_ACCOUNT_EDITOR_STARTING_BALANCE=Il saldo iniziale è la quantità di denaro presente sul conto quando viene inserito per la prima volta in Buddi.  Generalmente questo importo non deve essere modificato dopo la configurazione iniziale.
HELP_ACCOUNT_EDITOR_TYPE=Indica se questo conto è un conto "Debito" o "Credito".  I conti di debito sono per conti che hanno denaro: cose come risparmi, assegni, contanti nel portafoglio, ecc. I conti di credito sono per conti che devono denaro: cose come carte di credito, prestiti, ecc.
HELP_BUDGET_CATEGORY_NAME=Questo è il nome di un gruppo di transazioni comuni.  Ad esempio, una categoria denominata "Alimentari" potrebbe tenere traccia degli acquisti di cibo; una categoria denominata "Famiglia" per tenere traccia delle varie spese domestiche come mobili e semplici riparazioni domestiche; e una categoria denominata "Stipendio" potrebbe tenere traccia del reddito derivante da uno stipendio mensile.<br/>Per raggruppare insiemi comuni di categorie, fare riferimento alla funzionalità "Categoria principale" di seguito.
HELP_BUDGET_CATEGORY_PARENT=Una categoria principale può essere utilizzata per raggruppare insieme le categorie di budget correlate.  Ad esempio, supponiamo che esista una categoria denominata "Spese automobilistiche".  Potrebbero quindi essere aggiunte altre categorie: "Carburante", "Assicurazione auto" e "Manutenzione e riparazioni", tutte con la categoria principale "Spese automobilistiche".  Una volta completate, queste tre categorie verranno visualizzate sotto la categoria principale "Spese automobilistiche".
HELP_BUDGET_CATEGORY_PERIOD_TYPE=Il periodo di budget da assegnare alla categoria di budget.  Un "periodo di budget" è un intervallo ripetuto di date per il quale assegni un importo nel budget; ad esempio, a una categoria di budget per il monitoraggio delle imposte mensili sulla proprietà dovrebbe essere assegnato il tipo di periodo "Mese".
HELP_BUDGET_CATEGORY_TYPE=Specificare questo valore a seconda che la categoria di budget rappresenti transazioni di entrate o uscite.  Esempi di categorie di reddito potrebbero includere "Stipendio", "Bonus", "Regali ricevuti", ecc. Esempi di categorie di spesa potrebbero includere "Alimentari", "Riparazione auto", "Affitto", ecc.
HELP_CLEAR_TRANSACTION=Cancella tutti i campi nell'editor delle transazioni e deseleziona qualsiasi transazione selezionata (se applicabile).
HELP_CURRENCY=La valuta utilizzata per tutte le transazioni.  Questo verrà visualizzato in base alla locale specificata.
HELP_DATE_FORMAT=Ciò può sovrascrivere il formato della data predefinito per la locale selezionata.  Lasciare questo valore su "Utilizza impostazioni locali predefinite" per utilizzare il formato della data per le impostazioni internazionali specificate.
HELP_SHOW_DELETED=Mostra conti e categorie budget eliminati in elenchi e selettori.
HELP_DELETE_DATA=Se questa opzione è selezionata, tutti i dati esistenti verranno eliminati prima del ripristino.  Non è possibile annullare questa azione.  Tieni presente che il ripristino dei dati esistenti non duplicherà tutto: la procedura di ripristino aggiunge solo le novità nel file di backup.
HELP_DELETE_TRANSACTION=Elimina la transazione attualmente selezionata
HELP_ENCRYPT_DATA_PASSWORD=Per modificare le impostazioni di cifratura, inserisci la password di accesso attuale.
HELP_ENCRYPT_DATA=Questa opzione controlla se i dati del conto sono cifrati. Se abilitata, Buddi Live cifra campi sensibili come nomi di conti e budget e descrizioni delle transazioni. Se abiliti la cifratura, il ripristino password non e disponibile e le password perse non possono essere recuperate. Vedi la pagina di cifratura di Buddi Live per dettagli.
HELP_END_DATE=Utilizzato con il selettore di intervalli "Altro".  La data di fine dell'intervallo del report.
HELP_GETTING_STARTED_TITLE=Guida introduttiva
HELP_GETTING_STARTED=<b>Benvenuto in Buddi Live!</b><br/><br/>Se sei gia utente di Buddi Desktop, puoi esportare le transazioni da File &rarr; Export &rarr; Export Buddi Live data. Puoi importarle in Buddi Live da Sistema &rarr; Ripristina, selezionando il file .json creato durante l'esportazione.<br/><br/>Se sei nuovo nella suite Buddi, puoi <a href='doc/tutorial.html' target='_blank'>visualizzare il tutorial</a> per iniziare.<br/><br/>Per abilitare la crittografia o modificare locale e formati, fai clic su Sistema &rarr; Preferenze.<br/><br/>Questo messaggio verra mostrato ad ogni avvio finche non avrai aggiunto almeno un account. Puoi visualizzarlo di nuovo da Sistema &rarr; Guida introduttiva.
HELP_INTERVAL_PICKER=L'intervallo di date da utilizzare per questo report.  Scegli un intervallo predefinito o inserisci una data di inizio/fine personalizzata.
HELP_LOCALE=La lingua/il paese utilizzato per le localizzazioni.  Le localizzazioni includono la lingua, la formattazione del simbolo della valuta, la formattazione predefinita di data e numero, ecc.
HELP_RECORD_UPDATE_TRANSACTION=Registra (o aggiorna) la transazione attualmente selezionata.  Premi Ctrl + Invio quando modifichi la transazione come scorciatoia.
HELP_REGISTER_2=Controlla la tua email per una chiave di attivazione.  Una volta arrivato, copialo qui, seleziona una password e fai clic su "Crea account".<br/><br/>Dopo aver creato l'account, puoi accedere con il tuo indirizzo email e la tua password.
HELP_REGISTER=Inserisci un indirizzo email valido e fai clic su "Genera chiave".
HELP_REPEATING_BIWEEKLY=Imposta questa transazione in modo che si ripeta ogni due settimane nel giorno della settimana specificato.
HELP_REPEATING_EVERY_X_DAYS=Imposta questa transazione in modo che si ripeta dopo il numero di giorni specificato.  Questo valore deve essere maggiore di 0.
HELP_REPEATING_MONTHLY_BY_DAY_OF_WEEK=Imposta questa transazione in modo che si ripeta ogni mese nel giorno della settimana specificato.
HELP_REPEATING_MONTHLY=Imposta questa transazione in modo che si ripeta ogni mese nel giorno del mese specificato.  Tieni presente che solo alcuni mesi hanno 31 giorni; utilizzare "Ultimo giorno" per adattarsi automaticamente ai mesi più brevi.
HELP_REPEATING_MULTIPLE_MONTHS_EVERY_YEAR=Imposta questa transazione in modo che si ripeta nel giorno del mese specificato, nei mesi specificati dell'anno.
HELP_REPEATING_MULTIPLE_WEEKS_EVERY_MONTH=Imposta questa transazione in modo che si ripeta nel giorno della settimana specificato, nelle settimane specificate del mese.
HELP_REPEATING_WEEKLY=Imposta questa transazione in modo che si ripeta ogni settimana nel giorno della settimana specificato.
HELP_RESET_PASSWORD_2=Una volta che la chiave di attivazione arriva nella tua email, copiala qui e scegli una nuova password.<br/><br/>Se il tuo account è crittografato, non c'è modo di recuperare la password e non riceverai la chiave di attivazione.
HELP_RESET_PASSWORD=Inserisci il tuo indirizzo email di accesso per ricevere una chiave temporanea per reimpostare la password.<br/><br/>Puoi reimpostare la password solo se non hai abilitato la crittografia.  Se il tuo account è crittografato, non c'è modo di recuperare la password e non riceverai la chiave di attivazione.
HELP_RESTORE_FILE=Carica un file salvato in precedenza da Buddi Live o un file esportato su Buddi Live dalla versione desktop di Buddi.  Questo file ha generalmente un'estensione .json e, se generato da Buddi Live, verrà chiamato "backup.json".
HELP_SCHEDULED_TRANSACTION_END_DATE=Il giorno in cui la transazione pianificata dovrebbe terminare.  Lascia vuoto questo campo per non programmare mai una data di fine (questa può essere modificata in seguito, se lo si desidera).
HELP_SCHEDULED_TRANSACTION_MESSAGE=Un messaggio da mostrare quando la transazione pianificata è stata attivata.  Il messaggio viene visualizzato all'accesso.  Lascialo vuoto per non mostrare nulla.
HELP_SCHEDULED_TRANSACTION_NAME=Il nome della transazione pianificata.  Dovrebbe essere sufficientemente descrittivo per identificare cosa fa la transazione pianificata.  Alcuni esempi potrebbero includere "Trasferimento mensile al risparmio", "Indennità personale", ecc.
HELP_SCHEDULED_TRANSACTION_REPEAT=Scegli una frequenza per ripetere questa transazione pianificata.  A seconda del programma scelto, potrebbero esserci diverse opzioni mostrate di seguito.
HELP_SCHEDULED_TRANSACTION_START_DATE=Il giorno in cui dovrebbe iniziare la transazione pianificata.
HELP_SCHEDULED_TRANSACTION_TRANSACTION=La transazione che verrà aggiunta automaticamente alla pianificazione specificata.  Come minimo, specifica la descrizione, l'importo e le fonti da/verso.
HELP_START_DATE=Utilizzato con il selettore di intervalli "Altro".  La data di inizio per l'intervallo del report.
HELP_STORE_EMAIL=Questa opzione controlla se Buddi Live memorizza l'email di login in forma recuperabile per le email di sistema. Lasciala disabilitata per la massima privacy.
HELP_TIMEZONE=Il fuso orario locale.  Viene utilizzato per eseguire transazioni pianificate a mezzanotte, ora locale.  Se un dato fuso orario deve supportare l'ora legale, seleziona la voce "Luce diurna" invece di quella "Standard" (ad esempio, "Ora legale di montagna" cambierà automaticamente l'ora legale, mentre "Ora solare di montagna" non cambierà per l'ora legale).
HELP_USE_TWO_FACTOR=Usa l'autenticazione a due fattori. Dopo la configurazione con un'app autenticatrice, dovrai inserire un codice a 6 cifre al login.
