CLICK_TO_ENTER_BUDGETED_AMOUNT=&lt;Fai clic per modificare&gt;
CONFIRM_CHANGE_EXISTING_TRANSACTION_TITLE=Modifica la transazione esistente
CONFIRM_CHANGE_EXISTING_TRANSACTION=Stai modificando gli attributi principali di una transazione esistente.  Sei sicuro di volerlo fare?  Fai clic su "Sì" per continuare oppure fai clic su "No" per annullare.<br/><br/>Se invece desideri aggiungere una nuova transazione, fai clic sul pulsante "Cancella" prima di aggiungere una nuova transazione.<br/>
CONFIRM_DATE_OUT_OF_RANGE_AFTER=La data specificata è più di un mese nel futuro.  Sei sicuro che sia corretto?  Fare clic su "Sì" per continuare con questa data oppure fare clic su "No" per annullare.
CONFIRM_DATE_OUT_OF_RANGE_BEFORE=La data specificata è più di un anno fa.  Sei sicuro che sia corretto?  Fare clic su "Sì" per continuare con questa data oppure fare clic su "No" per annullare.
CONFIRM_DATE_OUT_OF_RANGE_TITLE=Data fuori intervallo
CONFIRM_DELETE_ACCOUNT=Sei sicuro di voler eliminare questo account?<br/>Se sono presenti transazioni ad esso associate, l'account verrà contrassegnato solo come eliminato (e potrà essere annullato in un secondo momento, se lo si desidera).<br/>Se non sono presenti transazioni, l'account verrà eliminato definitivamente.
CONFIRM_DELETE_CATEGORY=Sei sicuro di voler eliminare questa categoria di budget?<br/>Se sono presenti transazioni ad essa associate, la categoria verrà contrassegnata solo come eliminata (e potrà essere annullata in un secondo momento, se lo desideri).<br/>Se non sono presenti transazioni, la categoria verrà eliminata definitivamente.
CONFIRM_DELETE_DATA=La casella di controllo "Elimina dati" è selezionata e tutti i dati esistenti verranno eliminati prima di ripristinare il backup.  Non è possibile annullare questa azione.  Sei sicuro di voler procedere?
CONFIRM_DELETE_SCHEDULED=Sei sicuro di voler eliminare questa transazione pianificata?  Una volta eliminate, le transazioni non verranno più create automaticamente.  Le transazioni esistenti che sono già state aggiunte rimarranno.
CONFIRM_DELETE_TRANSACTION=Sei sicuro di voler eliminare questa transazione?  Non è possibile annullare questa azione.
CONFIRM_DELETE_USER=Eliminando il tuo account utente, non sarai più in grado di accedere a Buddi Live e tutti i dati precedentemente inseriti andranno persi definitivamente.<br/><br/>Si consiglia vivamente di scaricare un backup dei tuoi dati prima di eliminare il tuo account; questo ti consentirà di ripristinare i dati nel caso in cui apri un nuovo account.<br/><br/>Vuoi davvero eliminare il tuo account utente Buddi Live?  Fai clic su "Sì" per eliminare definitivamente l'account oppure fai clic su "No" per annullare.<br/>
CONFIRM_DELETE_USER2=Sei sicuro di voler eliminare il tuo account utente e tutti i dati dal sistema?  Questa azione non può essere annullata.<br/><br/>Fai clic su "Sì" per eliminare definitivamente il tuo account utente Buddi Live oppure fai clic su "No" per annullare.<br/>
COOKIES_USED_MESSAGE=Buddi Live utilizza i cookie per consentire agli utenti di accedere. Pertanto, i cookie sono necessari per utilizzare questo sito web.<br/><br/>Facendo clic su Sì, accetti che questo sito web possa salvare cookie nel tuo browser.<br/><br/>Per ulteriori informazioni, consulta <a href='doc/termsandconditions.html'>Termini e condizioni</a>.
